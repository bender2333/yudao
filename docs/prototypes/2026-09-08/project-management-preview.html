.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

function header(){const p=current();bar.innerHTML=`&lt;div class=&quot;yp-row&quot;&gt;&lt;button class=&quot;yp-icon yp-mobile-toggle&quot; type=&quot;button&quot; data-action=&quot;nav&quot; aria-label=&quot;切换项目导航&quot; aria-expanded=&quot;${state.nav}&quot;&gt;${icon(&#x27;panel-left&#x27;)}&lt;/button&gt;&lt;div class=&quot;yp-breadcrumb&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;home&quot;&gt;项目&lt;/button&gt;${icon(&#x27;chevron-right&#x27;)}&lt;button type=&quot;button&quot; data-page=&quot;home&quot;&gt;${esc(p?.name||&#x27;工作空间&#x27;)}&lt;/button&gt;${state.page===&#x27;task&#x27;?`${icon(&#x27;chevron-right&#x27;)}&lt;strong&gt;任务工作台&lt;/strong&gt;`:state.page===&#x27;wizard&#x27;?`${icon(&#x27;chevron-right&#x27;)}&lt;strong&gt;建立项目&lt;/strong&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;yp-auto&quot;&gt;&lt;span class=&quot;yp-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;自动推进 · 关键问题再询问&lt;/span&gt;&lt;/div&gt;`}
function projectHeading(){const p=current();return `&lt;header class=&quot;yp-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;yp-eyebrow&quot;&gt;${p.kind===&#x27;existing&#x27;?&#x27;接入已有项目&#x27;:&#x27;从想法开始&#x27;} · ${esc(p.status)}&lt;/div&gt;&lt;h1&gt;${esc(p.name)}&lt;/h1&gt;&lt;p class=&quot;yp-subtitle&quot;&gt;${esc(p.goal)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;yp-row&quot;&gt;&lt;button class=&quot;yp-icon&quot; type=&quot;button&quot; data-action=&quot;pin&quot; aria-label=&quot;${p.pinned?&#x27;取消置顶&#x27;:&#x27;置顶项目&#x27;}&quot; title=&quot;${p.pinned?&#x27;取消置顶&#x27;:&#x27;置顶项目&#x27;}&quot;&gt;${icon(p.pinned?&#x27;pin-off&#x27;:&#x27;pin&#x27;)}&lt;/button&gt;&lt;div class=&quot;yp-menu-wrap&quot;&gt;&lt;button class=&quot;yp-icon&quot; type=&quot;button&quot; data-action=&quot;menu&quot; aria-label=&quot;项目操作&quot; aria-expanded=&quot;${state.menu}&quot;&gt;${icon(&#x27;ellipsis&#x27;)}&lt;/button&gt;${state.menu?`&lt;div class=&quot;yp-menu&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;rename&quot;&gt;${icon(&#x27;pencil&#x27;)}重命名项目&lt;/button&gt;&lt;button type=&quot;button&quot; data-page=&quot;settings&quot;&gt;${icon(&#x27;settings-2&#x27;)}项目设置&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;archive&quot;&gt;${icon(&#x27;archive&#x27;)}归档项目&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;${pTabs()}`}
function compose(key,label,placeholder,action=&#x27;create-task&#x27;){return `&lt;form class=&quot;yp-composer&quot; data-form=&quot;${action}&quot;&gt;&lt;textarea aria-label=&quot;${label}&quot; placeholder=&quot;${placeholder}&quot; data-draft=&quot;${key}&quot; required&gt;${esc(state.drafts[key]||&#x27;&#x27;)}&lt;/textarea&gt;&lt;div class=&quot;yp-composer-footer&quot;&gt;&lt;span class=&quot;yp-small&quot;&gt;${action===&#x27;create-task&#x27;?&#x27;沿用当前项目资料与成果&#x27;:&#x27;本次任务 · 产品负责接收整体要求&#x27;}&lt;/span&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;submit&quot;&gt;${icon(&#x27;arrow-up&#x27;)}${action===&#x27;create-task&#x27;?&#x27;开始任务&#x27;:&#x27;发送要求&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`}
function taskRows(list){return `&lt;div class=&quot;yp-task-list&quot;&gt;${list.map(t=&gt;`&lt;div class=&quot;yp-task-row&quot;&gt;&lt;span class=&quot;yp-icon&quot;&gt;${icon(t.status===&#x27;done&#x27;?&#x27;circle-check&#x27;:t.status===&#x27;waiting&#x27;?&#x27;circle-help&#x27;:t.status===&#x27;stopped&#x27;?&#x27;circle-stop&#x27;:&#x27;circle-dashed&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;yp-task-title&quot; data-task=&quot;${t.id}&quot;&gt;${esc(t.title)}&lt;/button&gt;&lt;div class=&quot;yp-task-meta&quot;&gt;&lt;span&gt;${esc(t.summary)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;${statusTag(t)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;yp-empty&quot;&gt;&lt;h3&gt;还没有任务&lt;/h3&gt;&lt;p&gt;把接下来想完成的事情交给三部门。&lt;/p&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;button&quot; data-action=&quot;new-task&quot;&gt;新建任务&lt;/button&gt;&lt;/div&gt;&#x27;}&lt;/div&gt;`}
function deptCards(){const p=current();return `&lt;div class=&quot;yp-depts&quot;&gt;${Object.entries(roles).map(([key,r])=&gt;`&lt;article class=&quot;yp-dept&quot;&gt;&lt;div class=&quot;yp-row yp-between&quot;&gt;&lt;h3 class=&quot;yp-row&quot;&gt;${icon(r.icon)}${r.name}&lt;/h3&gt;${tag(p.sourceReady?&#x27;已建档&#x27;:&#x27;逐步形成&#x27;,p.sourceReady?&#x27;&#x27;:&#x27;green&#x27;)}&lt;/div&gt;&lt;p&gt;${r.text}&lt;/p&gt;&lt;div class=&quot;yp-small&quot;&gt;${p.sourceReady?{product:&#x27;功能与范围 · 需求来源&#x27;,engineering:&#x27;结构与实现 · 当前版本&#x27;,quality:&#x27;检查依据 · 验证缺口&#x27;}[key]:&#x27;依据首轮工作持续补充&#x27;}&lt;/div&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-basis=&quot;${key}&quot;&gt;查看工作依据 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}
function home(){const p=current();return `${projectHeading()}${p.question&amp;&amp;!p.answer?`&lt;section class=&quot;yp-section yp-notice&quot;&gt;${icon(&#x27;circle-help&#x27;)}&lt;div class=&quot;yp-notice-copy&quot;&gt;&lt;strong&gt;有一项取舍需要你决定&lt;/strong&gt;&lt;p&gt;${esc(p.question)}&lt;/p&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;decision&quot;&gt;查看问题与建议 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;${tag(&#x27;产品&#x27;,&#x27;amber&#x27;)}&lt;/section&gt;`:&#x27;&#x27;}&lt;section class=&quot;yp-summary&quot;&gt;&lt;div&gt;&lt;div class=&quot;yp-small&quot;&gt;当前工作重点&lt;/div&gt;&lt;p&gt;${esc(p.tasks.find(t=&gt;t.status===&#x27;running&#x27;||t.status===&#x27;waiting&#x27;)?.title||&#x27;准备下一项工作&#x27;)}&lt;/p&gt;&lt;div class=&quot;yp-row&quot; style=&quot;margin-top:9px&quot;&gt;${p.answer?tag(&#x27;取舍已记录&#x27;,&#x27;green&#x27;):tag(p.kind===&#x27;existing&#x27;?&#x27;已有项目资料&#x27;:&#x27;初始想法&#x27;)}&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-page=&quot;sources&quot;&gt;查看依据 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;yp-summary-side&quot;&gt;&lt;div class=&quot;yp-small&quot;&gt;当前采用成果&lt;/div&gt;&lt;p&gt;${esc(p.baseline)}&lt;/p&gt;&lt;div class=&quot;yp-row&quot; style=&quot;margin-top:9px&quot;&gt;${tag(p.baseline===&#x27;尚无交付&#x27;?&#x27;等待首轮交付&#x27;:&#x27;包含历史验证记录&#x27;)}&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;delivery&quot;&gt;查看成果 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;接下来，想完成什么？&lt;/h2&gt;&lt;/div&gt;${compose(&#x27;project-&#x27;+p.id,&#x27;新任务目标&#x27;,&#x27;描述一个新功能、需要修复的问题，或想调整的方向…&#x27;)}&lt;/section&gt;&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;近期任务&lt;/h2&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-page=&quot;tasks&quot;&gt;全部 ${p.tasks.length} 项 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;${taskRows(p.tasks.slice(0,3))}&lt;/section&gt;&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;三部门工作依据&lt;/h2&gt;&lt;span class=&quot;yp-small&quot;&gt;随项目演化持续更新&lt;/span&gt;&lt;/div&gt;${deptCards()}&lt;/section&gt;`}
function tasksPage(){const p=current();return `${projectHeading()}&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;项目任务&lt;/h2&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;button&quot; data-action=&quot;new-task&quot;&gt;${icon(&#x27;plus&#x27;)}新任务&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;yp-list-tools&quot;&gt;${[[&#x27;all&#x27;,&#x27;全部&#x27;],[&#x27;active&#x27;,&#x27;进行中&#x27;],[&#x27;done&#x27;,&#x27;已完成&#x27;]].map(([v,l])=&gt;`&lt;button class=&quot;yp-pill ${state.filter===v?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-filter=&quot;${v}&quot; type=&quot;button&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${taskRows(p.tasks.filter(t=&gt;state.filter===&#x27;all&#x27;||state.filter===&#x27;done&#x27;&amp;&amp;t.status===&#x27;done&#x27;||state.filter===&#x27;active&#x27;&amp;&amp;[&#x27;running&#x27;,&#x27;waiting&#x27;,&#x27;queued&#x27;].includes(t.status)))}&lt;/section&gt;`}
function reportFacts(p,dept){if(!p.sourceReady)return `&lt;div class=&quot;yp-detail&quot;&gt;&lt;h3&gt;${roles[dept].name}依据正在形成&lt;/h3&gt;&lt;p&gt;${dept===&#x27;product&#x27;?p.goal:dept===&#x27;engineering&#x27;?&#x27;首轮方案将在需求范围明确后形成。&#x27;:&#x27;验收依据随首轮目标形成，目前没有验证结果。&#x27;}&lt;/p&gt;&lt;p class=&quot;yp-small&quot;&gt;来源：初始想法 · 用户原文&lt;/p&gt;&lt;/div&gt;`;
 const facts={product:[[&#x27;资料支持&#x27;,&#x27;已有需求说明与功能清单&#x27;,&#x27;来源：&#x27;+p.material],[&#x27;待核对&#x27;,&#x27;资料描述的功能，需要与当前实现逐项对应&#x27;,&#x27;来源：项目资料 · 尚未完整核对&#x27;],[&#x27;有冲突&#x27;,p.id===&#x27;cargo&#x27;?&#x27;数量与体积的优先关系在现有材料中不明确&#x27;:&#x27;旧版说明与当前计划可能存在差异，示例待核对&#x27;,&#x27;处理：影响本次工作时提出具体问题&#x27;]],engineering:[[&#x27;资料支持&#x27;,&#x27;已关联项目位置和工程资料&#x27;,&#x27;来源：&#x27;+p.path],[&#x27;推断&#x27;,&#x27;模块职责可依据工程结构形成初步说明&#x27;,&#x27;示例推断 · 需要对应到实际代码&#x27;],[&#x27;待验证&#x27;,&#x27;运行方式、依赖和未提交修改仍需核对&#x27;,&#x27;未执行构建或修改工作目录&#x27;]],quality:[[&#x27;资料支持&#x27;,&#x27;现有测试与历史验收材料列入检查依据&#x27;,&#x27;来源：已有资料 · 历史证据&#x27;],[&#x27;待验证&#x27;,&#x27;历史通过记录不代表当前版本通过&#x27;,&#x27;应核对受测版本、检查范围与执行结果&#x27;],[&#x27;待验证&#x27;,&#x27;没有测试覆盖的能力保留为验证缺口&#x27;,&#x27;不因建档完成而显示为验证通过&#x27;]]};
 return facts[dept].map(([s,t,n])=&gt;`&lt;div class=&quot;yp-fact&quot;&gt;${tag(s,s===&#x27;有冲突&#x27;?&#x27;amber&#x27;:s===&#x27;资料支持&#x27;?&#x27;green&#x27;:&#x27;&#x27;)}&lt;div&gt;${esc(t)}&lt;small&gt;${esc(n)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
function sourcesPage(){const p=current();return `${projectHeading()}&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;资料与工作依据&lt;/h2&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-action=&quot;add-source&quot;&gt;${icon(&#x27;plus&#x27;)}添加资料&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;yp-small&quot;&gt;资料记录保留来源；推断与验证结果分别呈现。&lt;/p&gt;&lt;div class=&quot;yp-source-row&quot;&gt;${icon(&#x27;folder-code&#x27;)}&lt;div&gt;&lt;strong&gt;项目工作位置&lt;/strong&gt;&lt;small&gt;${esc(p.path)}&lt;/small&gt;&lt;/div&gt;${tag(&#x27;已登记&#x27;)}&lt;/div&gt;&lt;div class=&quot;yp-source-row&quot;&gt;${icon(&#x27;files&#x27;)}&lt;div&gt;&lt;strong&gt;${esc(p.material||&#x27;尚无补充资料&#x27;)}&lt;/strong&gt;&lt;small&gt;项目建立时提供的资料&lt;/small&gt;&lt;/div&gt;${tag(&#x27;来源&#x27;)}&lt;/div&gt;${p.notes.map(n=&gt;`&lt;div class=&quot;yp-source-row&quot;&gt;${icon(&#x27;file-text&#x27;)}&lt;div&gt;&lt;strong&gt;${esc(n.name)}&lt;/strong&gt;&lt;small&gt;${esc(n.text)}&lt;/small&gt;&lt;/div&gt;${tag(&#x27;补充资料&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;三部门当前依据&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;yp-list-tools&quot;&gt;${Object.entries(roles).map(([k,r])=&gt;`&lt;button class=&quot;yp-pill ${state.sourceTab===k?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-source-tab=&quot;${k}&quot; type=&quot;button&quot;&gt;${r.name}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;yp-report&quot;&gt;${reportFacts(p,roles[state.sourceTab]?state.sourceTab:&#x27;product&#x27;)}&lt;/div&gt;&lt;/section&gt;${p.answer?`&lt;section class=&quot;yp-section&quot;&gt;&lt;h2&gt;重要决定&lt;/h2&gt;&lt;div class=&quot;yp-detail&quot;&gt;&lt;h3&gt;${esc(p.answer)}&lt;/h3&gt;&lt;p&gt;来源：你对项目取舍的回答 · 已用于当前任务&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}`}
function settingsPage(){const p=current();return `${projectHeading()}&lt;section class=&quot;yp-section&quot; style=&quot;max-width:620px&quot;&gt;&lt;h2&gt;项目设置&lt;/h2&gt;&lt;form class=&quot;yp-form&quot; data-form=&quot;settings&quot; style=&quot;margin-top:19px&quot;&gt;&lt;label class=&quot;yp-field&quot;&gt;项目名称&lt;input name=&quot;name&quot; value=&quot;${esc(p.name)}&quot; required maxlength=&quot;60&quot;&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;项目目标&lt;textarea name=&quot;goal&quot; required&gt;${esc(p.goal)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;项目工作位置&lt;input name=&quot;path&quot; value=&quot;${p.path===&#x27;尚未关联目录&#x27;?&#x27;&#x27;:esc(p.path)}&quot; placeholder=&quot;可选，例如 C:/project/my-project&quot;&gt;&lt;small&gt;关联位置是项目来源；变更工作副本在正式执行时确定。&lt;/small&gt;&lt;/label&gt;&lt;div class=&quot;yp-form-actions&quot;&gt;&lt;span class=&quot;yp-small&quot;&gt;此处修改仅作用于当前原型&lt;/span&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;submit&quot;&gt;保存设置&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;div class=&quot;yp-detail&quot; style=&quot;margin-top:20px&quot;&gt;&lt;h3&gt;默认工作方式&lt;/h3&gt;&lt;p&gt;三部门自动推进，遇到关键问题再询问，完成后供你检查。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;yp-detail&quot;&gt;&lt;h3&gt;部门与模型&lt;/h3&gt;&lt;p&gt;沿用产品、工程、质检三个部门。Provider 配置与模型选择将在后续原型中补充。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`}
function archivesPage(){return `&lt;header class=&quot;yp-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;yp-eyebrow&quot;&gt;项目管理&lt;/div&gt;&lt;h1&gt;已归档项目&lt;/h1&gt;&lt;p class=&quot;yp-subtitle&quot;&gt;暂时收起的项目，随时可以恢复到项目列表。&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-action=&quot;new-project&quot;&gt;${icon(&#x27;plus&#x27;)}建立项目&lt;/button&gt;&lt;/header&gt;&lt;section class=&quot;yp-section&quot;&gt;${projects.filter(p=&gt;p.archived).map(p=&gt;`&lt;div class=&quot;yp-source-row&quot;&gt;${icon(&#x27;archive&#x27;)}&lt;div&gt;&lt;strong&gt;${esc(p.name)}&lt;/strong&gt;&lt;small&gt;${esc(p.goal)}&lt;/small&gt;&lt;/div&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-restore=&quot;${p.id}&quot;&gt;恢复项目&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;div class=&quot;yp-empty&quot;&gt;&lt;h3&gt;没有已归档项目&lt;/h3&gt;&lt;p&gt;归档会保留项目的资料和历史。&lt;/p&gt;&lt;/div&gt;&#x27;}&lt;/section&gt;`}
function wizardPage(){const w=state.wizard;const stage=w.step;return `&lt;div class=&quot;yp-wizard&quot;&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;leave-wizard&quot;&gt;${icon(&#x27;arrow-left&#x27;)}返回项目&lt;/button&gt;&lt;div style=&quot;margin-top:22px&quot;&gt;&lt;div class=&quot;yp-eyebrow&quot;&gt;建立一个持续演化的项目&lt;/div&gt;&lt;h1&gt;${stage===&#x27;choice&#x27;?&#x27;从哪里开始？&#x27;:w.kind===&#x27;idea&#x27;?&#x27;从一个想法开始&#x27;:&#x27;接入已有项目&#x27;}&lt;/h1&gt;&lt;p class=&quot;yp-subtitle&quot;&gt;${stage===&#x27;choice&#x27;?&#x27;两种起点，同一套项目工作台。&#x27;:w.kind===&#x27;idea&#x27;?&#x27;描述你想解决的问题，三部门会逐步形成需求、方案和成果。&#x27;:&#x27;先建立产品、工程与质检依据，再基于现状继续工作。&#x27;}&lt;/p&gt;&lt;/div&gt;${stage===&#x27;choice&#x27;?`&lt;div class=&quot;yp-choices&quot;&gt;&lt;button class=&quot;yp-choice&quot; type=&quot;button&quot; data-kind=&quot;idea&quot;&gt;${icon(&#x27;lightbulb&#x27;)}&lt;strong&gt;从想法新建&lt;/strong&gt;&lt;p&gt;有一个新想法，或准备从零开发。无需提前准备完整需求。&lt;/p&gt;&lt;/button&gt;&lt;button class=&quot;yp-choice&quot; type=&quot;button&quot; data-kind=&quot;existing&quot;&gt;${icon(&#x27;folder-input&#x27;)}&lt;strong&gt;接入已有项目&lt;/strong&gt;&lt;p&gt;已有代码或部分资料，先让三部门理解项目现状。&lt;/p&gt;&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;yp-small&quot; style=&quot;margin-top:20px&quot;&gt;项目会持续保留目标、成果和重要决定。&lt;/p&gt;`:stage===&#x27;form&#x27;?wizardForm(w):wizardReport(w)}&lt;/div&gt;`}
function wizardForm(w){return `&lt;div class=&quot;yp-steps&quot;&gt;&lt;span class=&quot;yp-step-current&quot;&gt;01 · 项目信息&lt;/span&gt;&lt;span class=&quot;yp-step-line&quot;&gt;&lt;/span&gt;&lt;span&gt;02 · ${w.kind===&#x27;idea&#x27;?&#x27;进入首轮工作&#x27;:&#x27;三部门建档&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;form class=&quot;yp-form&quot; data-form=&quot;wizard&quot;&gt;&lt;label class=&quot;yp-field&quot;&gt;项目名称&lt;input name=&quot;name&quot; required maxlength=&quot;60&quot; value=&quot;${esc(w.name)}&quot; placeholder=&quot;给项目起一个容易找到的名字&quot;&gt;&lt;/label&gt;${w.kind===&#x27;idea&#x27;?`&lt;label class=&quot;yp-field&quot;&gt;你想做什么？&lt;textarea name=&quot;goal&quot; required placeholder=&quot;希望谁在什么场景下，解决什么问题？&quot;&gt;${esc(w.goal)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;重要约束与参考资料 &lt;span class=&quot;yp-small&quot;&gt;选填&lt;/span&gt;&lt;textarea name=&quot;material&quot; placeholder=&quot;例如必须离线使用、已有设计稿，或暂时不做的事情&quot;&gt;${esc(w.material)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;工作目录 &lt;span class=&quot;yp-small&quot;&gt;选填&lt;/span&gt;&lt;input name=&quot;path&quot; value=&quot;${esc(w.path)}&quot; placeholder=&quot;可以在开发前再关联目录&quot;&gt;&lt;/label&gt;`:`&lt;label class=&quot;yp-field&quot;&gt;项目目录或资料位置&lt;input name=&quot;path&quot; value=&quot;${esc(w.path)}&quot; placeholder=&quot;例如 C:/project/my-project&quot;&gt;&lt;small&gt;可以先从代码、文档或部分资料开始，不要求齐全。&lt;/small&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;已有资料&lt;textarea name=&quot;material&quot; placeholder=&quot;列出需求说明、代码、测试、设计记录等；可填写资料位置&quot;&gt;${esc(w.material)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;yp-field&quot;&gt;接下来希望做什么？ &lt;span class=&quot;yp-small&quot;&gt;选填&lt;/span&gt;&lt;textarea name=&quot;goal&quot; placeholder=&quot;可以先了解项目，也可以指定准备继续开发的内容&quot;&gt;${esc(w.goal)}&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;yp-notice&quot;&gt;${icon(&#x27;info&#x27;)}&lt;div class=&quot;yp-notice-copy&quot;&gt;&lt;strong&gt;本次体验使用建档示例&lt;/strong&gt;&lt;p&gt;填写的位置只用于演示，不会读取本地目录；建档结果不是对该项目的实际分析。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`}&lt;p class=&quot;yp-error&quot; role=&quot;alert&quot; id=&quot;yp-wizard-error&quot; hidden&gt;&lt;/p&gt;&lt;div class=&quot;yp-form-actions&quot;&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-action=&quot;wizard-back&quot;&gt;上一步&lt;/button&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;submit&quot;&gt;${w.kind===&#x27;idea&#x27;?&#x27;创建项目并开始首轮工作&#x27;:&#x27;查看建档示例&#x27;} ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`}
function wizardReport(w){const temp={...w,sourceReady:true,id:&#x27;preview&#x27;};return `&lt;div class=&quot;yp-steps&quot;&gt;&lt;span&gt;01 · 项目信息&lt;/span&gt;&lt;span class=&quot;yp-step-line&quot;&gt;&lt;/span&gt;&lt;span class=&quot;yp-step-current&quot;&gt;02 · 三部门建档&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;yp-row yp-between&quot;&gt;&lt;h2&gt;${esc(w.name)} · 建档预览&lt;/h2&gt;${tag(&#x27;示例数据&#x27;,&#x27;amber&#x27;)}&lt;/div&gt;&lt;p class=&quot;yp-small&quot; style=&quot;margin-top:8px&quot;&gt;下面演示如何组织已有信息。没有读取目录或执行验证。&lt;/p&gt;${Object.entries(roles).map(([k,r])=&gt;`&lt;section class=&quot;yp-report&quot;&gt;&lt;h3 class=&quot;yp-row&quot;&gt;${icon(r.icon)}${r.name} · ${r.text}&lt;/h3&gt;${reportFacts(temp,k)}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;yp-form-actions&quot;&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-action=&quot;wizard-back&quot;&gt;调整项目信息&lt;/button&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;button&quot; data-action=&quot;finish-import&quot;&gt;建立示例项目 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;yp-small&quot; style=&quot;margin-top:10px&quot;&gt;建档与实际验证分别记录；可从已有可靠依据开始局部工作。&lt;/p&gt;`}
function taskPage(){const p=current(),t=task();if(!t){state.page=&#x27;home&#x27;;return home()}const dep=roles[state.taskTab];return `&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-page=&quot;home&quot;&gt;${icon(&#x27;arrow-left&#x27;)}回到项目&lt;/button&gt;&lt;header class=&quot;yp-heading&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;&lt;div class=&quot;yp-eyebrow&quot;&gt;${esc(p.name)} · 任务&lt;/div&gt;&lt;h1&gt;${esc(t.title)}&lt;/h1&gt;&lt;p class=&quot;yp-subtitle&quot;&gt;${esc(t.summary)}&lt;/p&gt;&lt;/div&gt;${statusTag(t)}&lt;/header&gt;&lt;nav class=&quot;yp-tabs&quot; aria-label=&quot;任务工作区&quot;&gt;${[[&#x27;overview&#x27;,&#x27;总览&#x27;],[&#x27;product&#x27;,&#x27;产品&#x27;],[&#x27;engineering&#x27;,&#x27;工程&#x27;],[&#x27;quality&#x27;,&#x27;质检&#x27;],[&#x27;observation&#x27;,&#x27;观测&#x27;]].map(([k,l])=&gt;`&lt;button class=&quot;yp-tab ${state.taskTab===k?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; type=&quot;button&quot; data-task-tab=&quot;${k}&quot; ${state.taskTab===k?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;${dep?departmentView(t,dep):state.taskTab===&#x27;observation&#x27;?observationView(t):taskOverview(t)}`}
function taskOverview(t){const p=current();return `${t.status===&#x27;waiting&#x27;?`&lt;section class=&quot;yp-section yp-notice&quot;&gt;${icon(&#x27;circle-help&#x27;)}&lt;div&gt;&lt;strong&gt;${esc(p.question||&#x27;产品需要你补充一个重要取舍&#x27;)}&lt;/strong&gt;&lt;p&gt;取舍会影响后续方案的比较方式。推荐分别呈现数量与体积指标。&lt;/p&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;decision&quot;&gt;回答问题 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`:&#x27;&#x27;}&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;三部门协作&lt;/h2&gt;&lt;span class=&quot;yp-small&quot;&gt;需求 → 实现 → 验收&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;yp-depts&quot;&gt;${Object.entries(roles).map(([k,r])=&gt;`&lt;article class=&quot;yp-dept&quot;&gt;&lt;div class=&quot;yp-row yp-between&quot;&gt;&lt;h3&gt;${r.name}&lt;/h3&gt;${tag(t.status===&#x27;done&#x27;?&#x27;已完成&#x27;:k===&#x27;product&#x27;?&#x27;当前工作&#x27;:&#x27;等待交接&#x27;,t.status!==&#x27;done&#x27;&amp;&amp;k===&#x27;product&#x27;?&#x27;green&#x27;:&#x27;&#x27;)}&lt;/div&gt;&lt;p&gt;${r.text}&lt;/p&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-task-tab=&quot;${k}&quot;&gt;进入工作区 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;${t.status===&#x27;done&#x27;?&#x27;本次交付&#x27;:&#x27;当前进展&#x27;}&lt;/h2&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;delivery&quot;&gt;查看成果与依据&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;yp-detail&quot;&gt;&lt;h3&gt;${t.status===&#x27;done&#x27;?&#x27;工作结果已记录&#x27;:t.status===&#x27;stopped&#x27;?&#x27;任务已停止，过程记录保留&#x27;:&#x27;正在使用当前项目依据推进&#x27;}&lt;/h3&gt;&lt;p&gt;${esc(t.summary)}&lt;/p&gt;&lt;p class=&quot;yp-small&quot;&gt;基于：${esc(p.baseline)} · ${esc(p.material)}&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;${t.messages.filter(m=&gt;m.scope===&#x27;global&#x27;).map(m=&gt;`&lt;div class=&quot;yp-detail&quot;&gt;&lt;h3&gt;你追加的要求 ${tag(&#x27;已接收&#x27;,&#x27;green&#x27;)}&lt;/h3&gt;&lt;p&gt;${esc(m.text)}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;section class=&quot;yp-section&quot;&gt;${[&#x27;done&#x27;,&#x27;stopped&#x27;].includes(t.status)?`&lt;div class=&quot;yp-notice&quot;&gt;${icon(&#x27;git-branch&#x27;)}&lt;div&gt;&lt;strong&gt;在同一项目中继续演化&lt;/strong&gt;&lt;p&gt;后续修改建立新任务，关联本次成果和项目依据。&lt;/p&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;new-task&quot;&gt;基于当前项目开始新任务 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:`${compose(&#x27;task-&#x27;+t.id,&#x27;追加整体要求&#x27;,&#x27;补充本次任务的目标、优先级或约束…&#x27;,&#x27;task-input&#x27;)}&lt;div style=&quot;margin-top:10px;text-align:right&quot;&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-action=&quot;stop-task&quot;&gt;停止本次任务&lt;/button&gt;&lt;/div&gt;`}&lt;/section&gt;`}
function departmentView(t,r){const k=state.taskTab,p=current();const messages=t.messages.filter(m=&gt;m.scope===k);return `&lt;div class=&quot;yp-work&quot;&gt;&lt;section&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;工作消息&lt;/h2&gt;&lt;span class=&quot;yp-small&quot;&gt;${r.name} · 本次任务&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;yp-timeline&quot;&gt;&lt;article class=&quot;yp-message&quot;&gt;&lt;div class=&quot;yp-row yp-between&quot;&gt;&lt;strong&gt;${r.name}&lt;/strong&gt;&lt;span class=&quot;yp-small&quot;&gt;项目依据已载入 · 示例&lt;/span&gt;&lt;/div&gt;&lt;p&gt;${k===&#x27;product&#x27;?`本次目标：${t.title}。先核对已有要求与本次变化，重要取舍会向你提出。`:k===&#x27;engineering&#x27;?`从「${p.baseline}」开始，依据产品明确的范围形成方案并实施，保留已有有效行为。`:&#x27;依据当前要求检查本次交付，并区分历史证据与本次实际验证。&#x27;}&lt;/p&gt;&lt;/article&gt;${messages.map(m=&gt;`&lt;article class=&quot;yp-message user&quot;&gt;&lt;div class=&quot;yp-row yp-between&quot;&gt;&lt;strong&gt;你 · 定向指导&lt;/strong&gt;${tag(&#x27;已接收&#x27;,&#x27;green&#x27;)}&lt;/div&gt;&lt;p&gt;${esc(m.text)}&lt;/p&gt;&lt;p class=&quot;yp-small&quot;&gt;等待${r.name}处理；不会转成其他部门的私有对话。&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${[&#x27;done&#x27;,&#x27;stopped&#x27;].includes(t.status)?&#x27;&lt;p class=&quot;yp-small&quot;&gt;本次任务已结束，指导记录保留。&lt;/p&gt;&#x27;:`&lt;form class=&quot;yp-composer&quot; data-form=&quot;guidance&quot;&gt;&lt;div class=&quot;yp-small&quot; style=&quot;margin-bottom:8px&quot;&gt;接收方 · ${r.name}&lt;/div&gt;&lt;textarea data-draft=&quot;guidance-${t.id}-${k}&quot; aria-label=&quot;发给${r.name}的指导&quot; placeholder=&quot;给当前部门追加说明或指导…&quot; required&gt;${esc(state.drafts[&#x27;guidance-&#x27;+t.id+&#x27;-&#x27;+k]||&#x27;&#x27;)}&lt;/textarea&gt;&lt;div class=&quot;yp-composer-footer&quot;&gt;&lt;span class=&quot;yp-small&quot;&gt;保留原文与处理状态&lt;/span&gt;&lt;button class=&quot;yp-btn primary&quot; type=&quot;submit&quot;&gt;发送指导 ${icon(&#x27;send&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`}&lt;/section&gt;&lt;aside class=&quot;yp-inspector&quot; aria-label=&quot;部门检查区&quot;&gt;&lt;h3&gt;本次工作依据&lt;/h3&gt;&lt;div class=&quot;yp-tabs&quot;&gt;${[[&#x27;context&#x27;,&#x27;Context&#x27;],[&#x27;provider&#x27;,&#x27;Provider&#x27;],[&#x27;prompt&#x27;,&#x27;Prompt&#x27;]].map(([v,l])=&gt;`&lt;button class=&quot;yp-tab ${state.inspect===v?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; type=&quot;button&quot; data-inspect=&quot;${v}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${state.inspect===&#x27;context&#x27;?`&lt;p&gt;当前项目目标、已采用成果及本次任务。&lt;/p&gt;&lt;details open&gt;&lt;summary&gt;项目目标&lt;/summary&gt;&lt;p&gt;${esc(p.goal)}&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;本次任务&lt;/summary&gt;&lt;p&gt;${esc(t.title)}&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;采用成果&lt;/summary&gt;&lt;p&gt;${esc(p.baseline)}&lt;/p&gt;&lt;/details&gt;&lt;button class=&quot;yp-link&quot; type=&quot;button&quot; data-page=&quot;sources&quot; style=&quot;margin-top:18px&quot;&gt;查看项目资料 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;`:state.inspect===&#x27;provider&#x27;?&#x27;&lt;p&gt;当前为交互示例，没有实际模型请求。&lt;/p&gt;&lt;p&gt;正式运行时显示本次采用的 Provider 和模型。配置管理将在后续原型中补充。&lt;/p&gt;&#x27;:`&lt;p&gt;${r.name}负责${r.text}。使用当前任务依据，遇到影响目标的重要取舍时提出问题。&lt;/p&gt;&lt;p&gt;示例部门规则 · 未连接真实 Prompt&lt;/p&gt;`}&lt;/aside&gt;&lt;/div&gt;`}
function observationView(t){return `&lt;section class=&quot;yp-section&quot;&gt;&lt;div class=&quot;yp-section-title&quot;&gt;&lt;h2&gt;任务观测&lt;/h2&gt;${tag(&#x27;示例范围&#x27;)}&lt;/div&gt;&lt;div class=&quot;yp-empty&quot;&gt;${icon(&#x27;activity&#x27;)}&lt;h3 style=&quot;margin-top:10px&quot;&gt;本次原型没有发起模型请求&lt;/h3&gt;&lt;p&gt;正式运行的请求记录、原始数据与用量都归属当前任务。&lt;/p&gt;&lt;button class=&quot;yp-btn&quot; type=&quot;button&quot; data-action=&quot;sample-request&quot;&gt;查看请求详情样式&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`}
function render(){root.querySelector(&#x27;.yp-shell&#x27;).classList.toggle(&#x27;show-nav&#x27;,state.nav);renderSide();header();content.innerHTML=state.page===&#x27;wizard&#x27;?wizardPage():state.page===&#x27;archives&#x27;?archivesPage():!current()?archivesPage():state.page===&#x27;tasks&#x27;?tasksPage():state.page===&#x27;sources&#x27;?sourcesPage():state.page===&#x27;settings&#x27;?settingsPage():state.page===&#x27;task&#x27;?taskPage():home();initIcons()}
function goProject(id){state.projectId=id;state.page=&#x27;home&#x27;;state.taskId=null;state.taskTab=&#x27;overview&#x27;;state.menu=false;state.nav=false;render()}
function openTask(id){state.taskId=id;state.page=&#x27;task&#x27;;state.taskTab=&#x27;overview&#x27;;state.menu=false;state.nav=false;render()}
