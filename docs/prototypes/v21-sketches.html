<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yudao V21 结构草图对比（A / B / C / D）</title>
  <style>
    :root, :root[data-theme="dark"] {
      --bg: #151821;
      --bg-sub: #1a1e29;
      --bg-card: #1d2230;
      --bg-card-hi: #222838;
      --dot: rgba(148, 163, 184, 0.16);
      --fg: #e6ebf5;
      --muted: #8b96ad;
      --dim: #5d677c;
      --line: #283042;
      --line-hi: #39445c;
      --ok: #5cd69a;
      --ok-wash: rgba(92, 214, 154, 0.12);
      --accent: #68b5ff;
      --accent-wash: rgba(104, 181, 255, 0.13);
      --warn: #ebb04d;
      --warn-wash: rgba(235, 176, 77, 0.13);
      --err: #ee7272;
      --err-wash: rgba(238, 114, 114, 0.13);
      --coral: #f08e72;
      --bar-bg: rgba(15, 18, 25, 0.94);
      --bar-fg: #eef2fa;
      --bar-border: #3a455e;
    }

    :root[data-theme="light"] {
      --bg: #fbfaf7;
      --bg-sub: #f4f1ea;
      --bg-card: #ffffff;
      --bg-card-hi: #f6f4ee;
      --dot: rgba(47, 93, 80, 0.14);
      --fg: #1f2421;
      --muted: #626b66;
      --dim: #8c9590;
      --line: #dedad0;
      --line-hi: #bcb6a8;
      --ok: #257a55;
      --ok-wash: rgba(37, 122, 85, 0.10);
      --accent: #2266a8;
      --accent-wash: rgba(34, 102, 168, 0.10);
      --warn: #b36e0d;
      --warn-wash: rgba(179, 110, 13, 0.11);
      --err: #be3b3b;
      --err-wash: rgba(190, 59, 59, 0.10);
      --coral: #b85335;
      --bar-bg: rgba(28, 34, 30, 0.94);
      --bar-fg: #f8f6f1;
      --bar-border: #3f4a43;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .mono {
      font-family: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 58px;
      overflow: hidden;
    }

    .dot-bg {
      background-image: radial-gradient(var(--dot) 1.15px, transparent 1.15px);
      background-size: 18px 18px;
    }

    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .ok { color: var(--ok); }
    .accent { color: var(--accent); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
    .coral { color: var(--coral); }

    .btn-ghost {
      padding: 4px 10px;
      border: 1px solid var(--line-hi);
      border-radius: 4px;
      font-size: 12px;
      background: var(--bg-card);
    }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-primary {
      padding: 5px 12px;
      border: 1px solid var(--warn);
      border-radius: 4px;
      font-size: 12px;
      background: var(--warn-wash);
      color: var(--warn);
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--warn); color: #151821; }

    /* ============================================================
       Variant A: Troupe 极简原味（无框纯排版 + 静默折线 + 纵向展开）
       ============================================================ */
    .va-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .va-head {
      padding: 8px 16px 6px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .va-head-row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .va-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .va-head-row2 {
      display: flex;
      gap: 18px;
      margin-top: 3px;
      font-size: 12px;
    }

    .va-tab {
      color: var(--muted);
      padding: 1px 0;
      border-bottom: 1.5px solid transparent;
    }
    .va-tab.is-on {
      color: var(--fg);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .va-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
    }

    .va-left {
      border-right: 1px solid var(--line);
      padding: 10px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .va-sec-label {
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--dim);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .va-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 12px;
      text-align: left;
    }
    .va-row:hover { background: var(--bg-sub); }
    .va-row.is-sel {
      background: var(--accent-wash);
      color: var(--fg);
    }

    .va-act-line {
      font-size: 11.5px;
      color: var(--muted);
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 6px;
      padding: 1px 0;
    }

    .va-right {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .va-flow-zone {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .va-flow-canvas {
      position: relative;
      width: 780px;
      max-width: 100%;
      height: 222px;
      margin: 4px auto 0;
    }

    .va-flow-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .va-node {
      position: absolute;
      border: 1.5px solid var(--line-hi);
      border-radius: 4px;
      background: var(--bg);
      padding: 6px 9px;
      text-align: left;
      transition: border-color 0.15s;
    }
    .va-node.is-working { border-color: var(--ok); box-shadow: inset 0 0 0 1px rgba(92, 214, 154, 0.25); }
    .va-node.is-waits { border-color: var(--warn); box-shadow: inset 0 0 0 1px rgba(235, 176, 77, 0.25); }
    .va-node.is-selected { outline: 1px solid var(--accent); outline-offset: 2px; }
    .va-node.is-dashed { border-style: dashed; }

    .va-exit {
      position: absolute;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      background: var(--bg);
    }
    .va-exit.is-ver { border: 1.5px solid var(--ok); color: var(--ok); }
    .va-exit.is-open { border: 1.5px dashed var(--warn); color: var(--warn); }

    .va-live-zone {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .va-kv {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      row-gap: 3px;
      column-gap: 12px;
      font-size: 12px;
    }
    .va-kv-k { color: var(--dim); }

    .va-tree {
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .va-gate-inline {
      padding: 8px 12px;
      border-left: 3px solid var(--warn);
      background: var(--warn-wash);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .va-prompt {
      border-top: 1px solid var(--line);
      padding: 7px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg);
    }
    .va-prompt input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--fg);
      font: inherit;
    }

    /* ============================================================
       Variant B: 环形回环台（围着一份事实转圈 · 单屏零页签）
       ============================================================ */
    .vb-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .vb-top {
      height: 40px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .vb-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 58fr) minmax(320px, 42fr);
    }

    .vb-orbit-pane {
      border-right: 1px solid var(--line);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
    }

    .vb-stage {
      position: relative;
      width: 690px;
      height: 410px;
      flex-shrink: 0;
    }

    .vb-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .vb-core {
      position: absolute;
      left: 205px;
      top: 152px;
      width: 206px;
      padding: 10px 12px;
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      background: var(--bg-card);
      text-align: left;
      box-shadow: 0 0 0 4px var(--accent-wash);
    }

    .vb-node {
      position: absolute;
      padding: 8px 10px;
      border: 1.5px solid var(--line-hi);
      border-radius: 8px;
      background: var(--bg-card);
      text-align: left;
    }
    .vb-node.is-working { border-color: var(--ok); }
    .vb-node.is-waits { border-color: var(--warn); }
    .vb-node.is-selected { outline: 2px solid var(--accent); outline-offset: 2px; }
    .vb-node.is-dashed { border-style: dashed; }

    .vb-feed {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .vb-feed-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vb-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-card);
      padding: 10px 12px;
    }

    /* ============================================================
       Variant C: 按轮展开泳道（第1轮 -> 第2轮 纵向展开 · 零交叉）
       ============================================================ */
    .vc-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .vc-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 66fr) minmax(300px, 34fr);
    }

    .vc-lanes {
      border-right: 1px solid var(--line);
      padding: 16px 20px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vc-matrix {
      width: 100%;
      max-width: 820px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      overflow: hidden;
    }

    .vc-row {
      display: grid;
      align-items: stretch;
      border-top: 1px solid var(--line);
    }
    .vc-row:first-child { border-top: 0; }

    .vc-hdr {
      background: var(--bg-sub);
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .vc-cell {
      padding: 10px 10px;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }
    .vc-cell:first-child { border-left: 0; }

    .vc-pill {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 9px;
      border-radius: 5px;
      border: 1px solid var(--line-hi);
      background: var(--bg-card);
      font-size: 12px;
    }
    .vc-pill.is-done { border-color: var(--line-hi); }
    .vc-pill.is-reject { border-color: var(--err); background: var(--err-wash); }
    .vc-pill.is-working { border-color: var(--ok); background: var(--ok-wash); }
    .vc-pill.is-waits { border-color: var(--warn); background: var(--warn-wash); }
    .vc-pill.is-open { border-style: dashed; border-color: var(--warn); color: var(--warn); }
    .vc-pill.is-sel { outline: 2px solid var(--accent); outline-offset: 1px; }

    .vc-rework-band {
      padding: 5px 14px;
      border-top: 1px dashed var(--err);
      background: var(--err-wash);
      color: var(--err);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ============================================================
       Variant D: 对话主轴 + 顶部紧凑循环脉冲条
       ============================================================ */
    .vd-shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr);
    }

    .vd-rail {
      border-right: 1px solid var(--line);
      padding: 12px;
      background: var(--bg-sub);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .vd-item {
      padding: 7px 9px;
      border-radius: 5px;
      text-align: left;
      font-size: 12px;
      border: 1px solid transparent;
    }
    .vd-item.is-on {
      background: var(--bg-card);
      border-color: var(--line-hi);
    }

    .vd-main {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .vd-pulse-bar {
      min-height: 70px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-sub);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .vd-track {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .vd-step {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line-hi);
      background: var(--bg-card);
      font-size: 12px;
    }
    .vd-step.is-working { border-color: var(--ok); color: var(--ok); }
    .vd-step.is-waits { border-color: var(--warn); color: var(--warn); }
    .vd-step.is-open { border-style: dashed; border-color: var(--warn); color: var(--warn); }

    .vd-stream {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 24px;
    }

    .vd-stream-inner {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vd-msg {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg-card);
      padding: 11px 14px;
    }

    .vd-msg.is-fold {
      background: transparent;
      border-style: dashed;
      padding: 8px 12px;
    }

    /* ============================================================
       底部悬浮原型切换器（独立高对比胶囊，不混入应用界面）
       ============================================================ */
    .proto-dock {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--bar-bg);
      color: var(--bar-fg);
      border: 1px solid var(--bar-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      font-size: 12px;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
      white-space: nowrap;
    }

    .dock-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.16);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .dock-btn {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      color: #c2cbe0;
      border: 1px solid transparent;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .dock-btn.is-on {
      background: #68b5ff;
      color: #11151d;
      font-weight: 600;
    }
    .dock-btn.is-scene.is-on {
      background: #ebb04d;
      color: #11151d;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <nav class="proto-dock" aria-label="原型方案切换条">
    <button type="button" class="dock-btn" data-act="prev-variant" title="上一套草图 (←)">←</button>
    <button type="button" class="dock-btn" data-act="set-variant" data-v="A">A 极简Troupe</button>
    <button type="button" class="dock-btn" data-act="set-variant" data-v="B">B 环形回环</button>
    <button type="button" class="dock-btn" data-act="set-variant" data-v="C">C 按轮展开</button>
    <button type="button" class="dock-btn" data-act="set-variant" data-v="D">D 对话+脉冲条</button>
    <button type="button" class="dock-btn" data-act="next-variant" title="下一套草图 (→)">→</button>
    <span class="dock-sep"></span>
    <button type="button" class="dock-btn is-scene" data-act="set-scene" data-s="rework">1 返工</button>
    <button type="button" class="dock-btn is-scene" data-act="set-scene" data-s="gate">2 拍板</button>
    <button type="button" class="dock-btn is-scene" data-act="set-scene" data-s="suborg">3 子组织</button>
    <button type="button" class="dock-btn is-scene" data-act="set-scene" data-s="openloop">4 开环</button>
    <span class="dock-sep"></span>
    <button type="button" class="dock-btn" data-act="toggle-theme" title="切换深色蓝图与浅色纸面 (t)">◐ 深/浅</button>
  </nav>

  <script>

      /* ------------------------------------------------------------

        const cols = isOpen
          ? ["轮次", "意图", "工程 (OpenCode)", "出口"]

        const gridCols = isOpen ? "66px 140px 1fr 170px" : "66px 115px 1fr 1.25fr 1fr 118px";

        const rowsHtml = sc.rounds.map((rw, idx) => {
          const cells = isOpen
            ? [
                '<div class="vc-cell mono"><b>第 ' + rw.r + " 轮</b></div>",
                '<div class="vc-cell muted">' + esc(rw.intent) + "</div>",
                '<div class="vc-cell"><button type="button" class="vc-pill ' + esc(rw.eng.cls) + ' is-sel" data-act="sel-role" data-r="engineering">' + esc(rw.eng.t) + "</button></div>",
                '<div class="vc-cell"><div class="vc-pill ' + esc(rw.exit.cls) + '">' + esc(rw.exit.t) + "</div></div>",
              ]
            : [
                '<div class="vc-cell mono"><b>第 ' + rw.r + " 轮</b></div>",
                '<div class="vc-cell muted">' + esc(rw.intent) + "</div>",
                '<div class="vc-cell"><button type="button" class="vc-pill ' + esc(rw.product.cls) + (role.id === "product" ? " is-sel" : "") + '" data-act="sel-role" data-r="product">' + esc(rw.product.t) + "</button></div>",
                '<div class="vc-cell"><button type="button" class="vc-pill ' + esc(gateOpen && rw.r === 2 ? "is-waits" : rw.eng.cls) + (role.id === "engineering" ? " is-sel" : "") + '" data-act="sel-role" data-r="engineering">' + esc(gateOpen && rw.r === 2 ? "◆ 等你拍板" : rw.eng.t) + "</button></div>",

          '      <div style="font-size:12px" class="muted">每一轮占一行，横跨各职能；打回从上轮质检直接落到下轮工程。</div>' +

          cols.map((c) => '<div class="vc-cell">' + esc(c) + "</div>").join("") +
          "        </div>" +
          rowsHtml +

              sc.gate.options.map((o, i) => '<button type="button" class="' + (i === 0 ? "btn-primary" : "btn-ghost") + '" data-act="resolve-gate">' + esc(o) + "</button>").join("") +
              "  </div>" +
              "</div>"
            : "") +
          '        <div class="vb-card">' +
          '          <div style="display:flex;justify-content:space-between"><b>选中单元 · ' + esc(role.name) + '</b><span class="mono ok">' + esc(role.rate || role.ctx) + "</span></div>" +

          sc.liveSteps.map((st) => '<div class="' + esc(st[2]) + '">' + esc(st[0]) + "  " + esc(st[1]) + "</div>").join("") +

          "          </div>" +
          "        </div>" +
          '        <div class="vb-card">' +
          '          <div class="muted" style="font-size:11.5px;margin-bottom:6px">本轮文件改动</div>' +
          sc.diffFiles.map((f) => '<div class="mono" style="font-size:11.5px"><span class="ok">' + esc(f.stat) + "</span> " + esc(f.file) + '<div class="muted">' + esc(f.line) + "</div></div>").join("") +

          "    </div>" +
          "  </div>" +
          "</div>"
        );

         Variant D: 对话主轴 + 顶部紧凑 72px 循环脉冲条
         ------------------------------------------------------------ */
      function renderVariantD(sc) {
        const role = sc.roles.find((r) => r.id === sc.activeRole) || sc.roles[0];
        const gateOpen = isGateOpen(sc);

        const steps = sc.id === "openloop"
          ? [
              { t: "意图", cls: "" },
              { t: "● 工程 (OpenCode · 64 tok/s)", cls: "is-working" },
              { t: "◌ 开环完成", cls: "is-open" },
            ]
          : [
              { t: "意图", cls: "" },
              { t: "✓ 产品", cls: "" },
              { t: (gateOpen ? "◆ 工程等你拍板" : sc.subRoles ? "● 工程小组 3人 · 76 tok/s" : "● 工程 · 轮2 · 87 tok/s"), cls: gateOpen ? "is-waits" : "is-working" },
              { t: "○ 质检·核", cls: "" },
              { t: "✓ 放行", cls: "" },
            ];

        return (
          '<div class="vd-shell">' +
          '  <aside class="vd-rail">' +
          '    <div class="va-sec-label">' + esc(sc.project) + "</div>" +
          Object.values(SCENES).map((s) =>
            '<button type="button" class="vd-item' + (s.id === sc.id ? " is-on" : "") + '" data-act="set-scene" data-s="' + esc(s.id) + '">' +
            '  <div style="font-weight:600">' + esc(s.item) + "</div>" +
            '  <div class="muted" style="font-size:11px">' + esc(s.roundLabel) + " · " + (s.gate && !state.resolvedGates[s.id] ? "等你拍板" : s.exitText) + "</div>" +
            "</button>"
          ).join("") +
          "  </aside>" +
          '  <section class="vd-main">' +
          '    <div class="vd-pulse-bar">' +
          '      <div class="vd-track">' +
          steps.map((st, i) => (i > 0 ? '<span class="dim">──▶</span>' : "") + '<span class="vd-step ' + esc(st.cls) + '">' + esc(st.t) + "</span>").join("") +
          (sc.id === "rework" ? '<span class="err mono" style="font-size:11.5px;margin-left:6px">↺ 轮1打回返工</span>' : "") +
          "      </div>" +
          '      <div class="mono muted" style="font-size:11.5px">' + esc(sc.form) + " · " + esc(sc.elapsed) + "</div>" +
          "    </div>" +
          '    <div class="vd-stream">' +
          '      <div class="vd-stream-inner">' +
          '        <div class="vd-msg"><b>你</b> · 发起事项<div style="margin-top:4px">' + esc(sc.item) + "（" + esc(role.goal) + "）</div></div>" +
          (sc.rounds.length > 1
            ? '<div class="vd-msg is-fold">' +
              '  <button type="button" class="muted" data-act="toggle-fold" style="font-size:12px">' + (state.foldOpen ? "▾ 收起第 1 轮经过" : "▸ 第 1 轮已折叠：产品交 PRD v1 → 工程交交付 v1 → 质检打回 2 项（点开）") + "</button>" +
              (state.foldOpen ? '<div style="margin-top:6px;font-size:12px" class="muted">· ' + esc(sc.activity[sc.activity.length - 1][1]) + "<br>· " + esc(sc.activity[1][1]) + "</div>" : "") +
              "</div>"
            : "") +
          (gateOpen
            ? '<div class="vd-msg" style="border-color:var(--warn);background:var(--warn-wash)">' +
              '  <div class="warn" style="font-weight:600">◆ 需要你拍板</div>' +
              '  <div style="margin:6px 0 10px">' + esc(sc.gate.ask) + "</div>" +
              '  <div style="display:flex;gap:8px">' +
              sc.gate.options.map((o, i) => '<button type="button" class="' + (i === 0 ? "btn-primary" : "btn-ghost") + '" data-act="resolve-gate">' + esc(o) + "</button>").join("") +
              "  </div>" +
              "</div>"
            : (sc.gate ? '<div class="vd-msg ok">✓ ' + esc(sc.gate.resolvedText) + "</div>" : "")) +
          '        <div class="vd-msg">' +
          '          <div style="display:flex;justify-content:space-between;align-items:baseline">' +
          '            <b>' + esc(role.name) + ' · 当前进展</b>' +
          '            <span class="mono ok" style="font-size:12px">' + esc(sparkStr(role.spark)) + " " + esc(role.rate || role.ctx) + "</span>" +
          "          </div>" +
          '          <div style="margin:6px 0">' + esc(role.diff) + ' <span class="muted">· ' + esc(role.verify) + "</span></div>" +
          '          <div class="mono accent" style="font-size:11.5px;margin-bottom:6px">允许改动范围：' + esc(role.touches) + "</div>" +
          '          <button type="button" class="btn-ghost" data-act="toggle-live">' + (state.liveOpen ? "▾ 收起现场步骤" : "▸ 看最近 3 行现场步骤与改动") + "</button>" +
          (state.liveOpen
            ? '<div class="mono" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px">' +
              sc.liveSteps.map((st) => '<div class="' + esc(st[2]) + '">' + esc(st[0]) + "  " + esc(st[1]) + "</div>").join("") +
              "</div>"
            : "") +
          "        </div>" +
          state.userNotes.map((n) => '<div class="vd-msg" style="border-color:var(--accent)"><b>你</b> · 刚刚<div style="margin-top:4px">' + esc(n) + "</div></div>").join("") +
          "      </div>" +
          "    </div>" +
          '    <form class="va-prompt" data-act="send-note"><span class="mono accent">›</span><input type="text" placeholder="发一句话给当前正在做的角色（回车发出）…"></form>' +
          "  </section>" +
          "</div>"
        );
      }

      function render() {
        document.documentElement.setAttribute("data-theme", state.theme);
        const sc = currentScene();
        const root = document.getElementById("app");
        if (state.variant === "A") root.innerHTML = renderVariantA(sc);
        else if (state.variant === "B") root.innerHTML = renderVariantB(sc);
        else if (state.variant === "C") root.innerHTML = renderVariantC(sc);
        else root.innerHTML = renderVariantD(sc);

        document.querySelectorAll("[data-act='set-variant']").forEach((el) => {
          el.classList.toggle("is-on", el.getAttribute("data-v") === state.variant);
        });
        document.querySelectorAll("[data-act='set-scene']").forEach((el) => {
          el.classList.toggle("is-on", el.getAttribute("data-s") === state.scene);
        });
        syncUrl();
      }

      document.addEventListener("click", (ev) => {
        const el = ev.target.closest("[data-act]");
        if (!el) return;
        const act = el.getAttribute("data-act");
        if (act === "set-variant") {
          state.variant = el.getAttribute("data-v");
          render();
        } else if (act === "prev-variant" || act === "next-variant") {
          const i = VARIANT_ORDER.indexOf(state.variant);
          const next = (i + (act === "next-variant" ? 1 : VARIANT_ORDER.length - 1)) % VARIANT_ORDER.length;
          state.variant = VARIANT_ORDER[next];
          render();
        } else if (act === "set-scene") {
          state.scene = el.getAttribute("data-s");
          state.selectedRole = null;
          state.foldOpen = false;
          state.liveOpen = false;
          state.userNotes = [];
          render();
        } else if (act === "toggle-theme") {
          state.theme = state.theme === "dark" ? "light" : "dark";
          render();
        } else if (act === "a-tab") {
          state.aTab = Number(el.getAttribute("data-t"));
          render();
        } else if (act === "sel-role") {
          const rid = el.getAttribute("data-r");
          if (rid && rid !== "src") {
            state.selectedRole = rid;
            render();
          }
        } else if (act === "resolve-gate") {
          state.resolvedGates[state.scene] = true;
          render();
        } else if (act === "toggle-fold") {
          state.foldOpen = !state.foldOpen;
          render();
        } else if (act === "toggle-live") {
          state.liveOpen = !state.liveOpen;
          render();
        }
      });

      document.addEventListener("submit", (ev) => {
        const form = ev.target.closest("[data-act='send-note']");
        if (!form) return;
        ev.preventDefault();
        const input = form.querySelector("input");
        const val = input && input.value.trim();
        if (!val) return;
        state.userNotes.push(val);
        input.value = "";
        render();
      });

      document.addEventListener("keydown", (ev) => {
        if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
        if (ev.key === "ArrowLeft") {
          const i = VARIANT_ORDER.indexOf(state.variant);
          state.variant = VARIANT_ORDER[(i + VARIANT_ORDER.length - 1) % VARIANT_ORDER.length];
          render();
        } else if (ev.key === "ArrowRight") {
          const i = VARIANT_ORDER.indexOf(state.variant);
          state.variant = VARIANT_ORDER[(i + 1) % VARIANT_ORDER.length];
          render();
        } else if (ev.key === "t" || ev.key === "T") {
          state.theme = state.theme === "dark" ? "light" : "dark";
          render();
        } else if (ev.key >= "1" && ev.key <= "4") {
          const keys = ["rework", "gate", "suborg", "openloop"];
          state.scene = keys[Number(ev.key) - 1];
          state.selectedRole = null;
          render();
        }
      });

      readUrlParams();
      render();
    })();
  </script>
</body>
</html>
