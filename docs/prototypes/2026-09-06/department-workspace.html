      });
      root.addEventListener("change", event => {
        if (event.target.matches("[data-obs-department]")) { state.observationFilters.department = event.target.value; updateObservationContent(); }
        if (event.target.matches("[data-obs-status]")) { state.observationFilters.status = event.target.value; updateObservationContent(); }
      });
      function appendMessage(form) {
        if (form.id === "dw-global-form") {
          const text = state.globalDraft.trim();
          if (!text) return;
          state.globalMessages.push({ source: "用户", text, time: "刚刚" }); state.globalDraft = ""; state.globalPending = true; renderOverview();
          const input = root.querySelector("[data-global-draft]"); if (input) input.focus();
          return;
        }
        if (form.id === "dw-dept-form") {
          const key = form.dataset.departmentForm; const text = state.deptDrafts[key].trim();
          if (!text) return;
          state.deptMessages[key].push({ source: "用户", detail: "追加指导", text, time: "刚刚", kind: "user" }); state.deptDrafts[key] = ""; state.deptPending[key] = true; renderDepartment(key);
          const input = root.querySelector(`[data-dept-draft="${key}"]`); if (input) input.focus();
        }
      }
      renderObservability();
    })();
  </script>
</div>
