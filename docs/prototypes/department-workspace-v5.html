<!-- Yudao 综合工作台原型 v5 · 完整移植 model-management 原型的全部结构与细节，并在最底部接入三部门全局模型与 Effort 分配 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yudao · 项目工作台与协作</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-width: 0; min-height: 100%; background: light-dark(#f7f8f7, #171918); }
    body { overflow-x: hidden; }

    #yudao-project-prototype {
      --yp-bg: light-dark(#f7f8f7, #171918);
      --yp-side: light-dark(#eef1ef, #1c201d);
      --yp-surface: light-dark(#fff, #212522);
      --yp-soft: light-dark(#f1f4f2, #292e2a);
      --yp-text: light-dark(#29312d, #e7eee9);
      --yp-muted: light-dark(#68766e, #a4b1a8);
      --yp-line: light-dark(#dce4de, #37443b);
      --yp-green: light-dark(#087f69, #6bd8ba);
      --yp-tint: light-dark(#e4f2eb, #243e32);
      --yp-amber: light-dark(#96680e, #e2be71);
      --yp-amber-bg: light-dark(#faf1dc, #3a3223);
      --yp-red: light-dark(#b44338, #ee9e92);
      --yp-blue: light-dark(#39658c, #95bde3);
      font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      color: var(--yp-text);
      background: var(--yp-bg);
      position: relative;
      min-width: 0;
      text-align: left;
    }

    #yudao-project-prototype * { box-sizing: border-box; }
    #yudao-project-prototype [hidden] { display: none !important; }
    #yudao-project-prototype button,
    #yudao-project-prototype input,
    #yudao-project-prototype textarea,
    #yudao-project-prototype select { font: inherit; color: inherit; }
    #yudao-project-prototype button { cursor: pointer; }
    #yudao-project-prototype button:disabled { cursor: default; opacity: .55; }
    #yudao-project-prototype h1,
    #yudao-project-prototype h2,
    #yudao-project-prototype h3,
    #yudao-project-prototype p { margin: 0; }
    #yudao-project-prototype h1 { font-size: 24px; font-weight: 500; line-height: 1.4; letter-spacing: -.4px; }
    #yudao-project-prototype h2 { font-size: 16px; font-weight: 500; }
    #yudao-project-prototype h3 { font-size: 14px; font-weight: 500; }
    #yudao-project-prototype strong { font-weight: 500; }
    #yudao-project-prototype svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* 外壳骨架 */
    #yudao-project-prototype .yp-shell { display: grid; grid-template-columns: 218px minmax(0, 1fr); min-height: 100vh; }
    #yudao-project-prototype .yp-sidebar { background: var(--yp-side); border-right: 1px solid var(--yp-line); padding: 20px 13px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    #yudao-project-prototype .yp-brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 17px; font-weight: 500; letter-spacing: .3px; }
    #yudao-project-prototype .yp-brand svg { color: var(--yp-green); width: 21px; height: 21px; }
    #yudao-project-prototype .yp-proto { font-size: 10px; color: var(--yp-muted); border: 1px solid var(--yp-line); border-radius: 4px; padding: 1px 4px; letter-spacing: 1px; margin-left: auto; }
    #yudao-project-prototype .yp-muted { color: var(--yp-muted); }
    #yudao-project-prototype .yp-small { font-size: 12px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-row { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
    #yudao-project-prototype .yp-between { justify-content: space-between; }
    #yudao-project-prototype .yp-side-label { display: flex; align-items: center; justify-content: space-between; padding: 0 9px; margin: 0 0 8px; font-size: 11px; letter-spacing: 1px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-icon { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; padding: 7px; min-width: 30px; min-height: 30px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-icon:hover { background: var(--yp-soft); color: var(--yp-text); }
    #yudao-project-prototype .yp-search { display: flex; align-items: center; gap: 7px; border: 1px solid var(--yp-line); background: var(--yp-surface); border-radius: 7px; padding: 7px 9px; margin-top: 10px; }
    #yudao-project-prototype .yp-search input { width: 100%; min-width: 0; border: 0; background: transparent; font-size: 12px; padding: 0; outline: none; }
    #yudao-project-prototype .yp-project-list { display: grid; gap: 3px; }
    #yudao-project-prototype .yp-project { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 7px; display: flex; gap: 8px; text-align: left; align-items: center; padding: 9px 8px; margin-top: 2px; }
    #yudao-project-prototype .yp-project:hover { background: var(--yp-soft); }
    #yudao-project-prototype .yp-project.is-selected { background: var(--yp-tint); color: var(--yp-green); border-color: color-mix(in srgb, var(--yp-green) 15%, transparent); }
    #yudao-project-prototype .yp-project span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #yudao-project-prototype .yp-project .yp-project-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--yp-muted); flex: none; }
    #yudao-project-prototype .yp-project.is-selected .yp-project-mark { background: var(--yp-green); }
    #yudao-project-prototype .yp-side-bottom { margin-top: auto; display: grid; gap: 6px; border-top: 1px solid var(--yp-line); padding-top: 14px; }
    #yudao-project-prototype .yp-sidebar-link { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 8px 9px; border-radius: 6px; color: var(--yp-muted); font-size: 12px; }
    #yudao-project-prototype .yp-sidebar-link:hover { background: var(--yp-soft); color: var(--yp-text); }
    #yudao-project-prototype .yp-sidebar-link.is-active { background: var(--yp-soft); color: var(--yp-green); font-weight: 500; }
    #yudao-project-prototype .yp-sidebar-link .yp-count { margin-left: auto; font-size: 11px; }

    /* 顶栏 */
    #yudao-project-prototype .yp-main { min-width: 0; display: flex; flex-direction: column; }
    #yudao-project-prototype .yp-topbar { padding: 12px 28px; min-height: 56px; border-bottom: 1px solid var(--yp-line); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--yp-surface); position: sticky; top: 0; z-index: 20; }
    #yudao-project-prototype .yp-breadcrumb { display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 12px; color: var(--yp-muted); flex-wrap: wrap; }
    #yudao-project-prototype .yp-breadcrumb button { padding: 0; border: 0; background: none; color: var(--yp-muted); }
    #yudao-project-prototype .yp-breadcrumb strong { color: var(--yp-text); }
    #yudao-project-prototype .yp-auto { font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--yp-muted); white-space: nowrap; }
    #yudao-project-prototype .yp-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--yp-green); flex-shrink: 0; }

    /* 主内容区 */
    #yudao-project-prototype .yp-content { padding: 24px 28px 48px; max-width: 1200px; margin: 0 auto; width: 100%; min-width: 0; }
    #yudao-project-prototype .yp-eyebrow { font-size: 11px; letter-spacing: 1.3px; color: var(--yp-muted); margin-bottom: 6px; }
    #yudao-project-prototype .yp-heading { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    #yudao-project-prototype .yp-heading-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; position: relative; }
    #yudao-project-prototype .yp-subtitle { font-size: 13px; color: var(--yp-muted); margin-top: 6px; max-width: 75ch; overflow-wrap: anywhere; }

    /* 按钮 */
    #yudao-project-prototype .yp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--yp-line); border-radius: 6px; background: var(--yp-surface); font-size: 13px; min-height: 33px; white-space: nowrap; }
    #yudao-project-prototype .yp-btn:hover { background: var(--yp-soft); }
    #yudao-project-prototype .yp-btn.primary { background: var(--yp-green); color: light-dark(#fff, #102b20); border-color: var(--yp-green); }
    #yudao-project-prototype .yp-btn.primary:hover { filter: brightness(1.07); }
    #yudao-project-prototype .yp-btn.quiet { background: transparent; }
    #yudao-project-prototype .yp-btn.small { padding: 4px 10px; min-height: 26px; font-size: 12px; }
    #yudao-project-prototype .yp-btn.danger-text { border: none; background: transparent; color: var(--yp-red); padding: 4px 8px; }
    #yudao-project-prototype .yp-btn.danger-text:hover { background: light-dark(#feecec, #3b1e1e); }

    /* 标签与选项卡 */
    #yudao-project-prototype .yp-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--yp-line); margin-top: 18px; flex-wrap: wrap; }
    #yudao-project-prototype .yp-tab { padding: 8px 0; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--yp-muted); font-size: 13px; min-height: 34px; }
    #yudao-project-prototype .yp-tab:hover { color: var(--yp-text); }
    #yudao-project-prototype .yp-tab.is-selected { color: var(--yp-green); border-bottom-color: var(--yp-green); font-weight: 500; }
    #yudao-project-prototype .yp-secondary-tabs { display: flex; gap: 16px; margin-top: 12px; }
    #yudao-project-prototype .yp-secondary-tabs .yp-tab { font-size: 12px; min-height: 28px; padding: 4px 0; }
    #yudao-project-prototype .yp-tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; background: var(--yp-soft); color: var(--yp-muted); padding: 2px 6px; font-size: 11px; white-space: nowrap; }
    #yudao-project-prototype .yp-tag.green { color: var(--yp-green); background: var(--yp-tint); }
    #yudao-project-prototype .yp-tag.amber { color: var(--yp-amber); background: var(--yp-amber-bg); }
    #yudao-project-prototype .yp-tag.blue { color: var(--yp-blue); background: color-mix(in srgb, var(--yp-blue) 12%, transparent); }

    /* 区块 */
    #yudao-project-prototype .yp-section { margin-top: 24px; }
    #yudao-project-prototype .yp-section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }

    /* 概览：项目简要与流转 */
    #yudao-project-prototype .yp-project-summary { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--yp-line); }
    #yudao-project-prototype .yp-project-summary p { font-size: 13px; margin-top: 6px; }
    #yudao-project-prototype .yp-summary-side { border-left: 1px solid var(--yp-line); padding-left: 20px; display: grid; gap: 10px; }
    #yudao-project-prototype .yp-summary-item { display: grid; gap: 2px; }
    #yudao-project-prototype .yp-summary-item strong { font-size: 13px; }
    #yudao-project-prototype .yp-summary-item span { font-size: 12px; color: var(--yp-muted); }

    #yudao-project-prototype .yp-handoff-list { border-top: 1px solid var(--yp-line); }
    #yudao-project-prototype .yp-handoff { display: grid; grid-template-columns: 85px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--yp-line); font-size: 12px; }
    #yudao-project-prototype .yp-handoff-time { font-size: 11px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-handoff p { font-size: 11px; color: var(--yp-muted); margin-top: 3px; }
    #yudao-project-prototype .yp-handoff-status { font-size: 11px; color: var(--yp-green); }
    #yudao-project-prototype .yp-handoff-status.rework { color: var(--yp-amber); }

    /* ========================================================
       2D 像素风房间与动态 Agent 舞台设计 (全宽纯净布局，无右侧检查栏)
       ======================================================== */
    .pixel-room-boundary {
      border: 3px solid light-dark(#2b322e, #101211);
      border-radius: 8px;
      background: light-dark(#dbe2de, #1a1e1b);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12), inset 0 0 0 2px light-dark(#f4f7f5, #2f3632);
      overflow: hidden;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pixel-room-header {
      background: light-dark(#2e3632, #111412);
      color: #e5ece8;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid light-dark(#1f2522, #080a09);
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .pixel-room-header strong { display: flex; align-items: center; gap: 8px; color: light-dark(#8ae2cb, #6bd8ba); font-family: ui-monospace, monospace; }

    .pixel-room-stage {
      position: relative;
      height: 350px;
      background: repeating-linear-gradient(
        0deg,
        light-dark(#cdd5d1, #1e2421) 0px,
        light-dark(#cdd5d1, #1e2421) 20px,
        light-dark(#c5cdc9, #1a201d) 20px,
        light-dark(#c5cdc9, #1a201d) 40px
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 18px 24px;
    }

    .pixel-room-topwall {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 2;
    }

    .crt-monitor-board {
      background: #0d1411;
      border: 4px solid #3d4742;
      border-radius: 8px;
      box-shadow: inset 0 0 10px #043828, 0 3px 8px rgba(0,0,0,0.3);
      padding: 10px 14px;
      width: 320px;
      color: #55f3be;
      font-family: Consolas, "Courier New", monospace;
      position: relative;
    }
    .crt-monitor-board::before {
      content: "TASK MONITOR // CRT-01";
      font-size: 9px;
      color: #2e8b6e;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
      border-bottom: 1px dashed #1d4d3c;
      padding-bottom: 2px;
    }
    .crt-monitor-text {
      font-size: 12px;
      line-height: 1.5;
      text-shadow: 0 0 4px rgba(85, 243, 190, 0.4);
    }

    .pixel-room-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 115px;
      background: repeating-linear-gradient(
        45deg,
        light-dark(#aeb9b3, #151a17),
        light-dark(#aeb9b3, #151a17) 16px,
        light-dark(#a2aea8, #121614) 16px,
        light-dark(#a2aea8, #121614) 32px
      );
      border-top: 4px solid light-dark(#6e7a73, #2a312c);
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.1);
    }

    .pixel-desk-lane {
      position: absolute;
      bottom: 42px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 64px;
      z-index: 4;
    }

    .pixel-workstation {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .pixel-bubble {
      position: absolute;
      bottom: 100px;
      background: #ffffff;
      color: #191c1a;
      border: 2px solid #1a1e1b;
      box-shadow: 2px 2px 0px #1a1e1b;
      padding: 4px 10px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 10;
      animation: floatPixel 2s steps(4) infinite alternate;
    }
    .pixel-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 6px solid #1a1e1b;
    }
    @keyframes floatPixel {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    .pixel-agent {
      width: 34px;
      height: 50px;
      position: relative;
      margin-bottom: -10px;
    }
    .pixel-agent-head {
      width: 26px;
      height: 24px;
      background: var(--yp-green);
      border: 2px solid #161b18;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
      margin: 0 auto;
      position: relative;
      animation: headBob 1.6s steps(2) infinite;
    }
    .pixel-agent-eye-l, .pixel-agent-eye-r {
      width: 3px;
      height: 4px;
      background: #111;
      position: absolute;
      top: 9px;
    }
    .pixel-agent-eye-l { left: 4px; }
    .pixel-agent-eye-r { right: 4px; }
    .pixel-agent-body {
      width: 30px;
      height: 28px;
      background: #2b332f;
      border: 2px solid #161b18;
      margin: -2px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9px;
      font-weight: bold;
      font-family: monospace;
    }

    .pixel-workstation.subagent .pixel-agent-head { background: var(--yp-blue); }
    .pixel-workstation.subagent .pixel-agent-body { background: #3d4a56; }

    .pixel-desk {
      width: 96px;
      height: 40px;
      background: light-dark(#8c694a, #523e2b);
      border: 3px solid #231b14;
      border-radius: 2px;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 3px;
    }
    .pixel-computer {
      width: 38px;
      height: 24px;
      background: #39423d;
      border: 2px solid #111412;
      box-shadow: inset 0 0 6px #55f3be;
      position: relative;
    }
    .pixel-workstation-label {
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      color: var(--yp-text);
      background: var(--yp-surface);
      padding: 1px 8px;
      border: 1px solid var(--yp-line);
      border-radius: 4px;
    }

    @keyframes headBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .pixel-stage-toolbar {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 5;
      display: flex;
      gap: 6px;
    }

    .pixel-room-log {
      background: var(--yp-surface);
      border-top: 1px solid var(--yp-line);
      padding: 12px 16px;
      max-height: 140px;
      overflow-y: auto;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pixel-log-row { display: flex; gap: 8px; line-height: 1.4; }
    .pixel-log-time { color: var(--yp-muted); font-family: monospace; font-size: 11px; white-space: nowrap; }
    .pixel-log-msg { color: var(--yp-text); }
    .pixel-log-msg.highlight { color: var(--yp-green); font-weight: 500; }

    /* 底部人类输入容器 (完全固定在最底端) */
    .pixel-room-input-box {
      background: var(--yp-surface);
      border: 1px solid var(--yp-line);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      padding: 14px 16px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pixel-input-head { display: flex; justify-content: space-between; align-items: center; }
    .pixel-input-head strong { font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .pixel-input-row { display: flex; gap: 10px; align-items: flex-end; }
    .pixel-input-row textarea {
      flex: 1;
      min-height: 60px;
      resize: vertical;
      border: 1px solid var(--yp-line);
      background: var(--yp-bg);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
    }
    .pixel-input-row textarea:focus { border-color: var(--yp-green); }

    /* 部门设置下拉菜单 (原返回概览位置) */
    .dept-settings-menu-wrap { position: relative; display: inline-block; }
    .dept-settings-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--yp-surface);
      border: 1px solid var(--yp-line);
      border-radius: 7px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      min-width: 170px;
      z-index: 50;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .dept-settings-menu button {
      border: none;
      background: transparent;
      padding: 8px 12px;
      font-size: 12px;
      text-align: left;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dept-settings-menu button:hover { background: var(--yp-soft); color: var(--yp-green); }

    /* 全局弹窗 Modal (用于模型配置与 Prompt 设置) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--yp-surface);
      border: 1px solid var(--yp-line);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 14px 20px;
      border-bottom: 1px solid var(--yp-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--yp-soft);
    }
    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 75vh;
      overflow-y: auto;
    }
    .modal-foot {

  function getAdmittedModels(providerId) {
    const p = modelState.providers.find(item => item.id === providerId);
    if (!p) return [];
    return p.models.filter(m => m.status === '已准入');
  }

  window.toggleExpand = function(id) {
    const item = modelState.providers.find(p => p.id === id);
    if (item) {
      item.expanded = !item.expanded;
      render();
    }
  };

  window.testSingleModel = function(pId, mId, e) {
    e.stopPropagation();
    toast(`正在对模型 [${mId}] 执行准入测试...`);
    setTimeout(() => {
      toast(`模型 [${mId}] 响应正常，验证通过！`);
    }, 600);
  };

  window.deleteProvider = function(pId, e) {
    e.stopPropagation();
    const dependentDept = Object.keys(roles).find(k => globalDeptBindings[k].providerId === pId);
    if (dependentDept) {
      alert(`无法删除此 Provider：${roles[dependentDept].name}部 当前已绑定此连接！请先在底部更改绑定后再删除。`);
      return;
    }
    const item = modelState.providers.find(p => p.id === pId);
    if (!confirm(`确定要移除服务提供商「${item ? item.name : pId}」及其包含的所有模型吗？`)) return;
    modelState.providers = modelState.providers.filter(p => p.id !== pId);
    render();
    toast("服务已移除");
  };

  window.openEditProvider = function(pId, e) {
    if (e) e.stopPropagation();
    const item = modelState.providers.find(p => p.id === pId);
    if (!item) return;

    modelState.editingProviderId = pId;
    const panel = document.getElementById("providerEditor");
    panel.style.display = "flex";
    document.getElementById("editorTitle").textContent = `编辑模型服务：${item.name}`;
    document.getElementById("inputProviderName").value = item.name;
    document.getElementById("inputProtocol").value = item.protocol;
    document.getElementById("inputBaseUrl").value = item.baseUrl;
    document.getElementById("inputDocUrl").value = item.docUrl || "";
    document.getElementById("inputCredRef").value = item.credRef;
    document.getElementById("inputTimeout").value = item.timeout || 600;

    modelState.currentFormModels = JSON.parse(JSON.stringify(item.models));
    renderEditorModelTable();
    panel.scrollIntoView({ behavior: "smooth" });
  };

  window.openAddProviderForm = function() {
    modelState.editingProviderId = null;
    const panel = document.getElementById("providerEditor");
    panel.style.display = "flex";
    document.getElementById("editorTitle").textContent = "添加模型服务";
    document.getElementById("inputProviderName").value = "OpenCode Go";
    document.getElementById("inputProtocol").value = "responses";
    document.getElementById("inputBaseUrl").value = "https://opencode.ai/zen/go/v1";
    document.getElementById("inputDocUrl").value = "https://opencode.ai/docs/go";
    document.getElementById("inputCredRef").value = "OPENCODE_GO_KEY";
    document.getElementById("inputTimeout").value = 600;

    modelState.currentFormModels = JSON.parse(JSON.stringify(PRESETS["opencode-go"].models));
    renderEditorModelTable();
    document.getElementById("remoteCandidateContainer").style.display = "none";
    panel.scrollIntoView({ behavior: "smooth" });
  };

  window.cancelEditProvider = function() {
    document.getElementById("providerEditor").style.display = "none";
  };

  function renderEditorModelTable() {
    const tbody = document.getElementById("editorModelTableBody");
    if (!tbody) return;
    if (modelState.currentFormModels.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--yp-muted); padding: 14px;">暂未添加模型，请点击上方“获取模型列表”或“手动添加模型”</td></tr>`;
      return;
    }

    tbody.innerHTML = modelState.currentFormModels.map((m, idx) => `
      <tr>
        <td><input type="text" value="${m.id}" onchange="updateFormModel(${idx}, 'id', this.value)" style="font-family: Consolas, monospace; border: 1px solid var(--yp-line); padding: 4px 6px; border-radius: 4px; width: 100%;"></td>
        <td><input type="number" value="${m.window}" onchange="updateFormModel(${idx}, 'window', this.value)" style="border: 1px solid var(--yp-line); padding: 4px 6px; border-radius: 4px; width: 100%;"></td>
        <td><input type="number" value="${m.maxOutput}" onchange="updateFormModel(${idx}, 'maxOutput', this.value)" style="border: 1px solid var(--yp-line); padding: 4px 6px; border-radius: 4px; width: 100%;"></td>
        <td>
          <span class="yp-tag ${m.status === '已准入' ? 'green' : 'amber'}">${m.status}</span>
        </td>
        <td style="text-align: right;">
          <button type="button" class="yp-btn small danger-text" onclick="removeFormModel(${idx})">移除</button>
        </td>
      </tr>
    `).join("");
  }

  window.updateFormModel = function(idx, key, val) {
    if (key === 'window' || key === 'maxOutput') {
      modelState.currentFormModels[idx][key] = parseInt(val, 10) || 0;
    } else {
      modelState.currentFormModels[idx][key] = val;
    }
  };

  window.removeFormModel = function(idx) {
    modelState.currentFormModels.splice(idx, 1);
    renderEditorModelTable();
  };

  window.exportModelsJson = function() {
    const json = JSON.stringify(modelState.providers, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "models-config.json";
    a.click();
    URL.revokeObjectURL(url);
    toast("配置已导出为 JSON 文件");
  };

  // 全局三部门分配变更
  window.updateGlobalProvider = function(deptKey, providerId) {
    globalDeptBindings[deptKey].providerId = providerId;
    const admitted = getAdmittedModels(providerId);
    if (admitted.length) globalDeptBindings[deptKey].modelId = admitted[0].id;
    render();
    toast(`${roles[deptKey].name}部 Provider 调整为 ${providerId}`);
  };

  window.updateGlobalModel = function(deptKey, modelId) {
    globalDeptBindings[deptKey].modelId = modelId;
    toast(`${roles[deptKey].name}部 模型调整为 ${modelId}`);
  };

  window.updateGlobalEffort = function(deptKey, val) {
    globalDeptBindings[deptKey].effortValue = parseInt(val, 10);
    const tag = document.getElementById(`effort-tag-global-${deptKey}`);
    const txt = document.getElementById(`effort-txt-global-${deptKey}`);
    if (tag) tag.textContent = val == 1 ? '低' : val == 2 ? '中' : val == 3 ? '深' : '极';
    if (txt) txt.textContent = effortTexts[val];
  };

  // 弹窗与部门操作
  window.openDeptModelModal = function(deptKey) {
    showDeptMenu = false;
    const r = roles[deptKey];
    const bind = globalDeptBindings[deptKey];
    const modal = document.getElementById('modalContainer');

    modal.innerHTML = `
      <div class="modal-card">
        <div class="modal-head">
          <strong>${r.icon} ${r.name}部 · 模型与 Effort 配置</strong>
          <button class="yp-btn small" type="button" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <p class="yp-small">针对当前部门选择要使用的 Provider 配置与模型访问定义。只有通过模型测试（已准入）的模型才可被选用。</p>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; color: var(--yp-muted);">指定 Provider 配置</label>
            <select id="modalProvSelect" onchange="modalProviderChanged('${deptKey}', this.value)" style="width:100%; border:1px solid var(--yp-line); padding:6px; border-radius:4px; font-size:12px; background:var(--yp-surface);">
              ${modelState.providers.map(p => `<option value="${p.id}" ${p.id === bind.providerId ? 'selected' : ''}>${p.name}</option>`).join('')}
            </select>
          </div>

          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; color: var(--yp-muted);">模型访问定义 (仅限已准入)</label>
            <select id="modalModelSelect" style="width:100%; border:1px solid var(--yp-line); padding:6px; border-radius:4px; font-size:12px; background:var(--yp-surface);">
              ${getAdmittedModels(bind.providerId).map(m => `<option value="${m.id}" ${m.id === bind.modelId ? 'selected' : ''}>${m.id} (窗 ${m.window.toLocaleString()} · 出 ${m.maxOutput.toLocaleString()})</option>`).join('')}
            </select>
          </div>

          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; color: var(--yp-muted);">思考 / 努力程度 (Effort: <span id="modalEffortTxt">${effortTexts[bind.effortValue]}</span>)</label>
            <div style="display: flex; align-items: center; gap: 10px;">
              <input type="range" min="1" max="4" value="${bind.effortValue}" oninput="modalEffortChanged(this.value)" style="flex:1; accent-color: var(--yp-green);">
              <span style="font-size: 11px; font-weight: 600; color: var(--yp-green); min-width: 32px; text-align: right;" id="modalEffortTag">${bind.effortValue === 1 ? '低' : bind.effortValue === 2 ? '中' : bind.effortValue === 3 ? '深' : '极'}</span>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="yp-btn small" type="button" onclick="closeModal()">取消</button>
          <button class="yp-btn small primary" type="button" onclick="saveDeptModelModal('${deptKey}')">保存部门配置</button>
        </div>
      </div>
    `;
    modal.style.display = 'flex';
  };

  window.openDeptPromptModal = function(deptKey) {
    showDeptMenu = false;
    const r = roles[deptKey];
    const bind = globalDeptBindings[deptKey];
    const modal = document.getElementById('modalContainer');

    modal.innerHTML = `
      <div class="modal-card" style="max-width: 640px;">
        <div class="modal-head">
          <strong>${r.icon} ${r.name}部 · 部门 Prompt 设置</strong>
          <button class="yp-btn small" type="button" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <p class="yp-small">编辑本部门执行 Agent 的 System Prompt 规则。修改后将在该部门下一次激活工作时载入。</p>
          <textarea id="modalPromptText" style="width: 100%; min-height: 180px; border: 1px solid var(--yp-line); border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.6; background: var(--yp-bg); font-family: monospace;">${bind.prompt}</textarea>
        </div>
        <div class="modal-foot">
          <button class="yp-btn small" type="button" onclick="closeModal()">取消</button>
          <button class="yp-btn small primary" type="button" onclick="saveDeptPromptModal('${deptKey}')">保存 Prompt</button>
        </div>
      </div>
    `;
    modal.style.display = 'flex';
  };

  window.closeModal = function() {
    document.getElementById('modalContainer').style.display = 'none';
  };

  window.modalProviderChanged = function(deptKey, providerId) {
    const sel = document.getElementById('modalModelSelect');
    sel.innerHTML = getAdmittedModels(providerId).map(m => `<option value="${m.id}">${m.id} (窗 ${m.window.toLocaleString()} · 出 ${m.maxOutput.toLocaleString()})</option>`).join('');
  };

  window.modalEffortChanged = function(val) {
    document.getElementById('modalEffortTxt').textContent = effortTexts[val];
    document.getElementById('modalEffortTag').textContent = val == 1 ? '低' : val == 2 ? '中' : val == 3 ? '深' : '极';
  };

  window.saveDeptModelModal = function(deptKey) {
    const pId = document.getElementById('modalProvSelect').value;
    const mId = document.getElementById('modalModelSelect').value;
    globalDeptBindings[deptKey].providerId = pId;
    globalDeptBindings[deptKey].modelId = mId;
    closeModal();
    render();
    toast(`${roles[deptKey].name}部模型配置已更新`);
  };

  window.saveDeptPromptModal = function(deptKey) {
    const text = document.getElementById('modalPromptText').value.trim();
    if (!text) {
      alert('Prompt 内容不能为空！');
      return;
    }
    globalDeptBindings[deptKey].prompt = text;
    closeModal();
    toast(`${roles[deptKey].name}部 Prompt 规则已更新`);
  };

  window.toggleDeptMenu = function(e) {
    e.stopPropagation();
    showDeptMenu = !showDeptMenu;
    render();
  };

  document.addEventListener('click', () => {
    if (showDeptMenu) {
      showDeptMenu = false;
      render();
    }
  });

  window.navigate = function(page) {
    currentPage = page;
    showDeptMenu = false;
    render();
  };

  window.navigateProject = function(id) {
    toast(`切换到项目：${id === 'cargo' ? '货物装载规划' : '实验记录助手'}`);
  };

  window.toggleSubagent = function(deptKey) {
    globalDeptBindings[deptKey].subagentActive = !globalDeptBindings[deptKey].subagentActive;
    render();
    toast(globalDeptBindings[deptKey].subagentActive ? '已派发 SubAgent 协同就座！' : 'SubAgent 已完成任务离场');
  };

  window.simulatePixelAction = function(deptKey) {
    const bubble = document.getElementById(`bubble-${deptKey}`);
    if (!bubble) return;
    const old = bubble.textContent;
    bubble.textContent = '执行工具：run_check...';
    setTimeout(() => { bubble.textContent = old; }, 1400);
    toast('小人执行工具操作');
  };

  window.sendHumanInput = function(deptKey) {
    const input = document.getElementById(`humanInput-${deptKey}`);
    const val = input.value.trim();
    if (!val) {
      alert('请输入要下达的指导内容！');
      return;
    }
    const log = document.getElementById(`roomLog-${deptKey}`);
    if (log) {
      const now = new Date().toTimeString().slice(0, 8);
      const row = document.createElement('div');
      row.className = 'pixel-log-row';
      row.innerHTML = `<span class="pixel-log-time">${now}</span><span class="pixel-log-msg">[人类指导] ${val}</span>`;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }
    input.value = '';
    const bubble = document.getElementById(`bubble-${deptKey}`);
    if (bubble) bubble.textContent = '收到人类指令，正在重算任务！';
    toast('指导已注入部门下轮 Context！');
  };

  function bindModelManagementEvents() {
    if (currentPage !== 'model-management') return;

    // 绑定预置药丸点击
    document.querySelectorAll(".pm-preset-pill").forEach(pill => {
      pill.onclick = () => {
        document.querySelectorAll(".pm-preset-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");

        const presetKey = pill.dataset.preset;
        const config = PRESETS[presetKey];
        if (!config) return;

        document.getElementById("inputProviderName").value = config.name;
        document.getElementById("inputProtocol").value = config.protocol;
        document.getElementById("inputBaseUrl").value = config.baseUrl;
        document.getElementById("inputDocUrl").value = config.docUrl;
        document.getElementById("inputCredRef").value = config.credRef;

        modelState.currentFormModels = JSON.parse(JSON.stringify(config.models));
        renderEditorModelTable();

        const candidateArea = document.getElementById("remoteCandidateContainer");
        if (candidateArea) candidateArea.style.display = "none";
        toast(`已加载 [${config.name}] 推荐预置`);
      };
    });

    // 绑定获取模型列表
    const fetchBtn = document.getElementById("btnFetchRemoteModels");
    if (fetchBtn) {
      fetchBtn.onclick = () => {
        const activePill = document.querySelector(".pm-preset-pill.active");
        const presetKey = activePill ? activePill.dataset.preset : "custom";
        const config = PRESETS[presetKey] || PRESETS.custom;

        toast("正在连接上游 /models 接口拉取可用模型...");
        setTimeout(() => {
          const grid = document.getElementById("candidateChipGrid");
          grid.innerHTML = config.remoteCandidates.map(candidateId => `
            <div class="pm-candidate-chip" onclick="addCandidateToModels('${candidateId}')">
              <span>+</span> <span>${candidateId}</span>
            </div>
          `).join("");

          document.getElementById("remoteCandidateContainer").style.display = "block";
          toast(`成功获取到 ${config.remoteCandidates.length} 个远端模型，点击即可勾选添加`);
        }, 600);
      };
    }

    // 绑定手动添加一行
    const addManualBtn = document.getElementById("btnAddManualModel");
    if (addManualBtn) {
      addManualBtn.onclick = () => {
        modelState.currentFormModels.push({
          id: "new-custom-model",
          window: 64000,
          maxOutput: 4096,
          status: "待核验"
        });
        renderEditorModelTable();
      };
    }

    // 绑定测试连接
    const testConnBtn = document.getElementById("btnTestConnection");
    if (testConnBtn) {
      testConnBtn.onclick = () => {
        const url = document.getElementById("inputBaseUrl").value;
        toast(`正在向 ${url} 发起连通性探针探测...`);
        setTimeout(() => {
          toast("连接成功！端点握手正常 (耗时 142ms)");
        }, 600);
      };
    }

    // 绑定保存 Provider
    const saveProvBtn = document.getElementById("btnSaveProvider");
    if (saveProvBtn) {
      saveProvBtn.onclick = () => {
        const name = document.getElementById("inputProviderName").value.trim();
        const protocol = document.getElementById("inputProtocol").value;
        const baseUrl = document.getElementById("inputBaseUrl").value.trim();
        const credRef = document.getElementById("inputCredRef").value.trim();
        const timeout = parseInt(document.getElementById("inputTimeout").value, 10) || 600;

        if (!name || !baseUrl) {
          alert("请填写供应商名称与服务地址！");
          return;
        }

        if (modelState.currentFormModels.length === 0) {
          if (!confirm("当前尚未映射任何模型，是否继续保存？")) return;
        }

        if (modelState.editingProviderId) {
          const target = modelState.providers.find(p => p.id === modelState.editingProviderId);
          if (target) {
            target.name = name;
            target.protocol = protocol;
            target.baseUrl = baseUrl;
            target.credRef = credRef;
            target.timeout = timeout;
            target.models = JSON.parse(JSON.stringify(modelState.currentFormModels));
          }
          toast("服务配置已更新");
        } else {
          const newId = "p-" + Date.now().toString(36);
          modelState.providers.unshift({
            id: newId,
            name: name,
            protocol: protocol,
            baseUrl: baseUrl,
            docUrl: document.getElementById("inputDocUrl").value.trim(),
            credRef: credRef,
            timeout: timeout,
            expanded: true,
            models: JSON.parse(JSON.stringify(modelState.currentFormModels))
          });
          toast("新增服务已保存并折叠归档");
        }

        document.getElementById("providerEditor").style.display = "none";
        render();
      };
    }
  }

  window.addCandidateToModels = function(modelId) {
    const exists = modelState.currentFormModels.some(m => m.id === modelId);
    if (exists) {
      toast(`模型 ${modelId} 已存在于映射列表中`);
      return;
    }
    modelState.currentFormModels.push({
      id: modelId,
      window: 128000,
      maxOutput: 8192,
      status: "待核验"
    });
    renderEditorModelTable();
    toast(`已添加模型：${modelId}`);
  };

  // 主渲染
  function render() {
    const container = document.getElementById('mainContent');
    if (currentPage === 'overview') {
      container.innerHTML = renderOverview();
    } else if (roles[currentPage]) {
      container.innerHTML = renderDepartment(currentPage);
    } else if (currentPage === 'model-management') {
      container.innerHTML = renderModelManagement();
      bindModelManagementEvents();
    } else if (currentPage === 'sources') {
      container.innerHTML = `${renderNavTabs()}<div class="yp-section"><h2>资料与依据</h2><p class="yp-small">这里是项目长期保留的资料说明与三部门依据。</p></div>`;
    } else if (currentPage === 'settings') {
      container.innerHTML = `${renderNavTabs()}<div class="yp-section"><h2>项目设置</h2><p class="yp-small">调整项目名称、目标及关联位置。</p></div>`;
    }
  }

  render();
})();
</script>
</body>
</html>
