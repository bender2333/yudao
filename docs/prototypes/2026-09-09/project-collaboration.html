`;

  function fallbackEsc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
    });
  }

  function create(options) {
    options = options || {};
    const root = options.root;
    const esc = options.esc || fallbackEsc;
    const icon = options.icon || function (name) { return '<span aria-hidden="true">' + name + '</span>'; };
    const getProjectId = options.getProjectId || function () { return 'cargo'; };
    const onBackToDepartment = options.onBackToDepartment || function () {};
    const notify = options.notify || function () {};
    let projectId = getProjectId() || 'cargo';
    let mounted = false;
    const state = {
      tab: 'requests',
      screen: 'list',
      detailTab: 'overview',
      selectedId: null,
      returnContext: null,
      filters: { department: 'all', workItem: 'all', status: 'all', search: '' }
    };

    function allRequests() {
      return (DATA[projectId] || []).slice();
    }

    function requestById(id) {
      const items = allRequests();
      return items.find(function (item) { return item.id === id; }) ||
        items.find(function (item) { return item.requestId === id; }) || null;
    }

    function attemptsFor(request) {
      if (!request) return [];
      return allRequests().filter(function (item) { return item.callId === request.callId; })
        .sort(function (a, b) { return a.attempt - b.attempt; });
    }

    function selectedRequest() {
      return requestById(state.selectedId);
    }

    function copyReturnContext(context) {
      if (!context) return null;
      return Object.assign({}, context, {
        deptScope: context.deptScope ? Object.assign({}, context.deptScope) : undefined,
        drafts: context.drafts ? Object.assign({}, context.drafts) : undefined,
        scrollTop: context.scrollTop ? Object.assign({}, context.scrollTop) : context.scrollTop
      });
    }

    function returnSourceButton() {
      const context = state.returnContext || { page: 'overview' };
      const label = context.sourceLabel || (context.page === 'department'
        ? '返回' + (DEPARTMENTS[context.department] || '部门') + '工作区' + (context.scopeLabel ? ' · ' + context.scopeLabel : '')
        : context.page === 'sources' ? '返回资料与依据'
          : context.page === 'settings' ? '返回项目设置'
            : '返回项目概览');
      return '<button class="yo-btn quiet" type="button" data-ob-back-department>' + icon('corner-up-left') + esc(label) + '</button>';
    }

    function filteredRequests() {
      const filters = state.filters;
      const query = String(filters.search || '').trim().toLowerCase();
      return allRequests().filter(function (item) {
        if (filters.department !== 'all' && item.department !== filters.department) return false;
        if (filters.workItem !== 'all' && item.workItemId !== filters.workItem) return false;
        if (filters.status !== 'all' && item.status !== filters.status) return false;
        if (!query) return true;
        const haystack = [item.id, item.requestId, item.callId, item.model, item.provider, item.workItemTitle, item.workItemType, item.departmentLabel || DEPARTMENTS[item.department]].join(' ').toLowerCase();
        return haystack.indexOf(query) >= 0;
      });
    }

    function formatNumber(value) {
      if (value == null) return '未上报';
      return Number(value).toLocaleString('en-US');
    }

    function formatDuration(value) {
      if (value == null) return '未测量';
      if (value < 1000) return value + ' ms';
      return (value / 1000).toFixed(value % 1000 ? 1 : 0) + ' s';
    }

    function json(value) {
      return esc(JSON.stringify(value, null, 2));
    }

    function statusTag(status) {
      return '<span class="yo-status ' + esc(status) + '">' + esc(STATUS[status] || status) + '</span>';
    }

    function usageSummary(items) {
      const reported = items.filter(function (item) { return item.usage && item.usage.reported; });
      const sum = function (key) {
        const known = reported.map(function (item) { return item.usage[key]; }).filter(function (value) { return value != null; });
        return known.length ? known.reduce(function (total, value) { return total + Number(value); }, 0) : null;
      };
      return { reported: reported.length, total: items.length, input: sum('inputTotal'), cache: sum('cacheRead'), output: sum('output'), all: sum('total') };
    }

    function filterMarkup() {
      const filters = state.filters;
      const items = [];
      const seen = {};
      allRequests().forEach(function (request) {
        if (!seen[request.workItemId]) {
          seen[request.workItemId] = true;
          items.push(request);
        }
      });
      return '<div class="yo-filters" aria-label="观测筛选">' +
        '<label class="yo-filter"><span>部门</span><select data-ob-department aria-label="按部门筛选"><option value="all" ' + (filters.department === 'all' ? 'selected' : '') + '>全部部门</option>' +
        Object.keys(DEPARTMENTS).map(function (key) { return '<option value="' + key + '" ' + (filters.department === key ? 'selected' : '') + '>' + DEPARTMENTS[key] + '部</option>'; }).join('') + '</select></label>' +
        '<label class="yo-filter"><span>事项</span><select data-ob-work-item aria-label="按项目事项筛选"><option value="all" ' + (filters.workItem === 'all' ? 'selected' : '') + '>全部事项</option>' +
        items.map(function (item) { return '<option value="' + esc(item.workItemId) + '" ' + (filters.workItem === item.workItemId ? 'selected' : '') + '>' + esc(item.workItemTitle) + '</option>'; }).join('') + '</select></label>' +
        '<label class="yo-filter"><span>状态</span><select data-ob-status aria-label="按请求状态筛选"><option value="all" ' + (filters.status === 'all' ? 'selected' : '') + '>全部状态</option>' +
        Object.keys(STATUS).map(function (key) { return '<option value="' + key + '" ' + (filters.status === key ? 'selected' : '') + '>' + STATUS[key] + '</option>'; }).join('') + '</select></label>' +
        '<label class="yo-filter"><span>搜索</span><input data-ob-search type="search" value="' + esc(filters.search) + '" placeholder="请求 ID、模型、事项或调用" aria-label="搜索请求"></label>' +
        '</div>';
    }

    function requestRow(item) {
      const usage = item.usage && item.usage.reported ? '输入 ' + formatNumber(item.usage.inputTotal) + ' · 输出 ' + formatNumber(item.usage.output) : 'usage 未上报';
      return '<button class="yo-request-row" type="button" data-ob-request="' + esc(item.id) + '" aria-label="查看请求 ' + esc(item.id) + '">' +
        '<span class="yo-request-main"><span class="yo-row-title"><strong>' + esc(item.id) + '</strong>' + statusTag(item.status) + '</span><span>' + esc(DEPARTMENTS[item.department]) + ' · ' + esc(item.workItemTitle) + '</span><span>逻辑调用 ' + esc(item.callId) + ' · 第 ' + item.attempt + '/' + item.totalAttempts + ' 次</span></span>' +
        '<span class="yo-request-meta"><span>' + esc(item.provider) + '</span><strong>' + esc(item.model) + '</strong><span>' + esc(item.time) + ' · ' + formatDuration(item.durationMs) + '</span></span>' +
        '<span class="yo-request-versions"><span>Context · ' + esc(item.context.version) + '</span><span>Prompt · ' + esc(item.prompt.version) + '</span><span>Provider · ' + esc(item.providerConfig.version) + '</span></span>' +
        '<span class="yo-request-usage"><span>' + usage + '</span><span>总 Token · ' + (item.usage && item.usage.reported ? formatNumber(item.usage.total) : '未上报') + '</span><span>费用 · 未上报</span></span>' +
        '</button>';
    }

    function listMarkup() {
      const items = filteredRequests();
      const all = allRequests();
      const title = all.length ? '模型请求' : '模型请求';
      return '<div class="yo-results"><div class="yo-results-head"><div><h2>' + title + '</h2><p>显示 ' + items.length + ' / ' + all.length + ' 次物理尝试 · 同一逻辑调用可切换失败与成功尝试</p></div><span class="yo-status ' + (items.some(function (item) { return item.status === 'running'; }) ? 'running' : 'success') + '">' + (items.some(function (item) { return item.status === 'running'; }) ? '有请求进行中' : '历史记录') + '</span></div>' +
        (items.length ? '<div class="yo-request-list">' + items.map(requestRow).join('') + '</div>' : '<div class="yo-empty"><strong>' + (all.length ? '没有符合筛选条件的请求' : '该项目暂时没有模型请求观测') + '</strong><span>' + (all.length ? '可以清除筛选后查看全部尝试。' : '选择其他项目或等待项目产生执行记录。') + '</span></div>') +
        '<p class="yo-footer-note">请求范围属于当前项目。Request 是发送前实际请求，Response 是 Provider 返回对象；失败、取消和缺少终态均保留为观察证据。</p></div>';
    }

    function usageValue(value) {
      return value == null ? '未上报' : formatNumber(value);
    }

    function groupUsage(items, keyFn) {
      const groups = {};
      items.forEach(function (item) {
        const key = keyFn(item);
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });
      return groups;
    }

    function usageLines(title, groups) {
      const keys = Object.keys(groups);
      if (!keys.length) return '';
      return '<section class="yo-usage-group"><h3>' + esc(title) + '</h3><div class="yo-usage-table"><div class="yo-usage-line"><span>分组</span><span>输入（含缓存）</span><span>缓存读取（子集）</span><span>输出</span><span>总 Token</span></div>' + keys.map(function (key) {
        const summary = usageSummary(groups[key]);
        return '<div class="yo-usage-line"><strong>' + esc(key) + '</strong><strong>' + usageValue(summary.input) + '</strong><span>' + usageValue(summary.cache) + '</span><span>' + usageValue(summary.output) + '</span><span>' + usageValue(summary.all) + '</span></div>';
      }).join('') + '</div></section>';
    }

    function usageMarkup() {
      const items = filteredRequests();
      const summary = usageSummary(items);
      const coverage = summary.total ? Math.round(summary.reported / summary.total * 100) : 0;
      return '<div class="yo-results"><div class="yo-results-head"><div><h2>用量统计</h2><p>与请求记录使用同一组筛选 · 覆盖率 ' + coverage + '%</p></div><span class="yo-status ' + (summary.reported === summary.total && summary.total ? 'success' : 'running') + '">' + summary.reported + '/' + summary.total + ' 次已上报</span></div>' +
        '<div class="yo-usage-note">输入（含缓存）已经包含缓存读取，缓存读取是输入的子集，不再重复相加。缺失用量保持“未上报”，费用当前没有独立上报来源。</div>' +
        (items.length ? '<div class="yo-usage-summary"><div class="yo-metric"><span>尝试数</span><strong>' + items.length + '</strong><small>当前筛选</small></div><div class="yo-metric"><span>输入（含缓存）</span><strong>' + usageValue(summary.input) + '</strong><small>仅汇总已知值</small></div><div class="yo-metric"><span>缓存读取</span><strong>' + usageValue(summary.cache) + '</strong><small>输入子集</small></div><div class="yo-metric"><span>输出</span><strong>' + usageValue(summary.output) + '</strong><small>Provider usage</small></div><div class="yo-metric"><span>费用</span><strong>未上报</strong><small>没有估算值</small></div></div>' + usageLines('按部门', groupUsage(items, function (item) { return DEPARTMENTS[item.department]; })) + usageLines('按 Provider / 模型', groupUsage(items, function (item) { return item.provider + ' / ' + item.model; })) : '<div class="yo-empty"><strong>没有可统计的请求</strong><span>当前筛选范围没有尝试记录，缺失不按零处理。</span></div>') + '</div>';
    }

    function overviewMarkup(item) {
      const usage = item.usage || {};
      const attempts = attemptsFor(item);
      return '<div class="yo-overview-grid"><div class="yo-panel"><h2>请求概览</h2><div class="yo-facts"><div class="yo-fact"><span>请求状态</span><div><strong>' + statusTag(item.status) + '</strong><small>' + esc(item.status === 'failed' ? '失败输出只作观察证据，不进入有效部门历史。' : item.status === 'cancelled' ? '已取消；迟到结果不会恢复已取消流程。' : item.status === 'running' ? '请求进行中，Response 可能尚未取得。' : 'Provider 返回终态，是否推动部门流程仍由控制层确认。') + '</small></div></div><div class="yo-fact"><span>实际模型</span><div><strong>' + esc(item.responseModel || '未知（无终态）') + '</strong><small>请求配置：' + esc(item.requestedModel) + '</small></div></div><div class="yo-fact"><span>耗时</span><strong>' + formatDuration(item.durationMs) + '</strong></div><div class="yo-fact"><span>usage</span><div><strong>' + (usage.reported ? '已上报' : '未上报') + '</strong><small>输入（含缓存） ' + formatNumber(usage.inputTotal) + ' · 输出 ' + formatNumber(usage.output) + ' · 总量 ' + formatNumber(usage.total) + '</small></div></div><div class="yo-fact"><span>同次调用</span><div><strong>' + esc(item.callId) + '</strong><small>' + attempts.length + ' 次物理尝试，可在上方切换。</small></div></div></div></div><div class="yo-panel"><h2>本次输入版本</h2><div class="yo-source-list"><div class="yo-source"><strong>Context · ' + esc(item.context.version) + '</strong><span>' + item.context.sources.length + ' 个来源 · 截止 ' + esc(item.context.capturedAt) + '</span></div><div class="yo-source"><strong>Provider · ' + esc(item.providerConfig.version) + '</strong><span>' + esc(item.providerConfig.name) + ' · ' + esc(item.providerConfig.protocol) + '</span></div><div class="yo-source"><strong>Prompt · ' + esc(item.prompt.version) + '</strong><span>' + esc(item.prompt.name) + ' · ' + esc(item.prompt.status) + '</span></div></div><p>版本是本次实际采用的输入关联，不代表项目当前默认值。</p></div></div><section class="yo-panel" style="margin-top:17px"><h2>事件摘要</h2><p>' + esc(item.events.map(function (event) { return event.label; }).join(' · ')) + '</p><p class="yo-footer-note">切换到 Request、Response 或事件页签查看原始 JSON。</p></section>';
    }

    function requestMarkup(item) {
      return '<div class="yo-json-wrap"><div class="yo-json-head"><strong>Request JSON · 发送前实际请求</strong><span>' + esc(item.provider) + ' · requested model ' + esc(item.requestedModel) + ' · Context ' + esc(item.context.version) + '</span></div><pre class="yo-json">' + json(item.requestRaw) + '</pre></div><p class="yo-footer-note">这里展示发送前记录的模型、工具、输出限制和输入内容；Context 工件另行列出来源，不冒充完整 SDK 请求。</p>';
    }

    function responseMarkup(item) {
      return '<div class="yo-json-wrap"><div class="yo-json-head"><strong>Response JSON · Provider 原始响应</strong><span>' + esc(item.responseModel || 'returned model 未知') + ' · ' + esc(STATUS[item.status] || item.status) + '</span></div><pre class="yo-json">' + json(item.responseRaw) + '</pre></div><p class="yo-footer-note">响应缺失、部分输出和 usage 缺失保持原状，不从输出片段拼造完整 Response。</p>';
    }

    function eventsMarkup(item) {
      return '<div class="yo-event-list">' + item.events.map(function (event) {
        return '<details class="yo-event"><summary><time>' + esc(event.time) + '</time><span class="yo-event-kind ' + esc(event.tone || 'neutral') + '">' + esc(event.label) + '</span><span class="yo-event-detail">' + esc(event.detail) + '</span><span class="yo-event-action">查看原文</span></summary><pre class="yo-json yo-event-raw">' + json({ request_id: item.requestId, attempt: item.attempt, event: event.raw }) + '</pre></details>';
      }).join('') + '</div>';
    }

    function detailMarkup() {
      const item = selectedRequest();
      if (!item) {
        state.screen = 'list';
        return listShellMarkup();
      }
      const attempts = attemptsFor(item);
      let panel = overviewMarkup(item);
      if (state.detailTab === 'request') panel = requestMarkup(item);
      if (state.detailTab === 'response') panel = responseMarkup(item);
      if (state.detailTab === 'events') panel = eventsMarkup(item);
      return '<div class="yo-detail-top"><button class="yo-btn quiet" type="button" data-ob-back-list>' + icon('arrow-left') + '返回请求记录</button><div class="yo-header-actions">' + returnSourceButton() + '</div></div><header class="yo-detail-title"><div class="yo-eyebrow">' + esc(PROJECT_NAMES[projectId] || projectId) + ' · ' + esc(DEPARTMENTS[item.department]) + '</div><h1>模型请求详情</h1><p>' + esc(item.id) + ' · ' + esc(item.workItemTitle) + ' · ' + statusTag(item.status) + '</p></header><div class="yo-crumbs"><span>项目</span><strong>' + esc(PROJECT_NAMES[projectId] || projectId) + '</strong><span>›</span><span>部门</span><strong>' + esc(DEPARTMENTS[item.department]) + '</strong><span>›</span><span>事项</span><strong>' + esc(item.workItemTitle) + '</strong><span>›</span><span>调用</span><strong>' + esc(item.callId) + '</strong></div><div class="yo-attempt-bar"><span class="yo-attempt-label">同一逻辑调用 · ' + esc(item.callId) + '</span>' + attempts.map(function (attempt) { return '<button class="yo-attempt ' + (attempt.status === 'failed' ? 'failed' : '') + ' ' + (attempt.id === item.id ? 'is-active' : '') + '" type="button" data-ob-attempt="' + esc(attempt.id) + '">第 ' + attempt.attempt + ' 次 · ' + esc(STATUS[attempt.status]) + '</button>'; }).join('') + '</div><nav class="yo-detail-tabs" role="tablist" aria-label="请求详情页签"><button class="yo-detail-tab ' + (state.detailTab === 'overview' ? 'is-active' : '') + '" type="button" data-ob-detail-tab="overview" role="tab" aria-selected="' + (state.detailTab === 'overview') + '">概览</button><button class="yo-detail-tab ' + (state.detailTab === 'request' ? 'is-active' : '') + '" type="button" data-ob-detail-tab="request" role="tab" aria-selected="' + (state.detailTab === 'request') + '">Request</button><button class="yo-detail-tab ' + (state.detailTab === 'response' ? 'is-active' : '') + '" type="button" data-ob-detail-tab="response" role="tab" aria-selected="' + (state.detailTab === 'response') + '">Response</button><button class="yo-detail-tab ' + (state.detailTab === 'events' ? 'is-active' : '') + '" type="button" data-ob-detail-tab="events" role="tab" aria-selected="' + (state.detailTab === 'events') + '">事件</button></nav><section class="yo-detail-panel" role="tabpanel">' + panel + '</section>';
    }

    function listShellMarkup() {
      const items = filteredRequests();
      return '<div class="yo-detail-top"><div class="yo-header-actions">' + returnSourceButton() + '</div></div><header class="yo-header"><div><div class="yo-eyebrow">项目级观测 · ' + esc(PROJECT_NAMES[projectId] || projectId) + '</div><h1>模型请求</h1><p class="yo-subtitle">查看三部门实际模型尝试、原始 Request / Response、事件和用量；观测独立于部门工作区。</p></div><div class="yo-header-actions"><span class="yo-status ' + (items.some(function (item) { return item.status === 'running'; }) ? 'running' : 'success') + '"><span class="yo-dot"></span>' + (items.some(function (item) { return item.status === 'running'; }) ? '1 个请求进行中' : '历史请求') + '</span></div></header><div class="yo-scope"><span class="yo-dot"></span><strong>当前项目</strong><span>' + esc(PROJECT_NAMES[projectId] || projectId) + '</span><span>·</span><span>' + allRequests().length + ' 次物理尝试</span><span>·</span><span>项目级入口</span></div><nav class="yo-tabs" role="tablist" aria-label="观测视图"><button class="yo-tab ' + (state.tab === 'requests' ? 'is-active' : '') + '" type="button" data-ob-tab="requests" role="tab" aria-selected="' + (state.tab === 'requests') + '">请求记录</button><button class="yo-tab ' + (state.tab === 'usage' ? 'is-active' : '') + '" type="button" data-ob-tab="usage" role="tab" aria-selected="' + (state.tab === 'usage') + '">用量统计</button></nav>' + filterMarkup() + (state.tab === 'requests' ? listMarkup() : usageMarkup());
    }

    function viewMarkup() {
      return '<section class="yo-page" role="region" aria-label="项目级模型请求观测">' + (state.screen === 'detail' ? detailMarkup() : listShellMarkup()) + '</section>';
    }

    function emitSnapshot(item) {
      if (!root || !item || typeof root.dispatchEvent !== 'function') return;
      root.dispatchEvent(new CustomEvent('yudao-observation-snapshot', { detail: snapshot(item.id) }));
    }

    function refresh() {
      if (!root) return;
      const host = root.querySelector('.yp-ob-host');
      if (!host) return;
      host.innerHTML = viewMarkup();
      if (typeof global.lucide !== 'undefined' && global.lucide && global.lucide.createIcons) global.lucide.createIcons({ attrs: { width: 17, height: 17 } });
    }

    function openRequest(id, returnContext) {
      const item = requestById(id);
      if (!item) return null;
      state.screen = 'detail';
      state.selectedId = item.id;
      state.detailTab = 'overview';
      if (arguments.length > 1) state.returnContext = copyReturnContext(returnContext);
      emitSnapshot(item);
      refresh();
      return item;
    }

    function setReturnContext(context) {
      state.returnContext = copyReturnContext(context);
      return api;
    }

      const item = requestById(id);
      if (!item) return null;
      return {
        id: item.id,
        projectId: item.projectId,
        requestId: item.requestId,
        callId: item.callId,
        attempt: item.attempt,
        department: item.department,
        workItemId: item.workItemId,
        context: {
          version: item.context.version,
          capturedAt: item.context.capturedAt,
          sources: item.context.sources.map(function (source) { return Object.assign({}, source); }),
          omitted: item.context.omitted,
          body: item.context.body
        },
        provider: Object.assign({ requestedModel: item.requestedModel, responseModel: item.responseModel }, item.providerConfig),
        prompt: Object.assign({}, item.prompt)

      const next = nextProjectId || 'cargo';
      if (next === projectId) return api;

      state.screen = 'list';
      state.selectedId = null;
      state.returnContext = null;
      state.filters = { department: 'all', workItem: 'all', status: 'all', search: '' };

    }

    function handleClick(event) {

      if (target.dataset.obTab) {
        state.tab = target.dataset.obTab;
        state.screen = 'list';
        state.selectedId = null;
        refresh();
        return;
      }
      if (target.dataset.obRequest) {
        openRequest(target.dataset.obRequest);
        return;
      }
      if (target.dataset.obAttempt) {
        const attempt = requestById(target.dataset.obAttempt);
        if (attempt) {
          state.selectedId = attempt.id;
          emitSnapshot(attempt);
          refresh();
        }
        return;
      }
      if (target.dataset.obDetailTab) {
        state.detailTab = target.dataset.obDetailTab;
        refresh();
        return;
      }
      if (target.dataset.obBackList !== undefined) {
        state.screen = 'list';
        state.selectedId = null;
        refresh();
        return;
      }
      if (target.dataset.obBackDepartment !== undefined) {
        const context = copyReturnContext(state.returnContext) || { page: 'overview' };

    function handleInput(event) {

      if (target.matches('[data-ob-department],[data-ob-work-item],[data-ob-status]')) refresh();

      mounted = true;

    }

      mount: mount,
      openRequest: openRequest,
      setReturnContext: setReturnContext,
      snapshot: snapshot
    };
    return api;
  }

 return `${commonHeader('项目概览','从项目目标、当前成果和部门流转了解下一步。')}<section class="yp-project-summary"><div><h2>当前目标</h2><p>${esc(p.goal)}</p><p class="yp-small">${esc(p.path)} · ${esc(p.material)}</p></div><div class="yp-summary-side"><div class="yp-summary-item"><span>当前成果</span><strong>${esc(p.baseline)}</strong></div><div class="yp-summary-item"><span>工作项</span><strong>${items.length} 个 · ${done.length} 个已采纳</strong></div><div class="yp-summary-item"><span>项目状态</span><strong>${tag(p.status,'green')}</strong></div></div></section>${waiting.length?`<section class="yp-section yp-notice">${icon('circle-help')}<div class="yp-notice-copy"><strong>${esc(p.question||'有一项重要取舍等待你的决定')}</strong><p>这项决定会影响后续部门如何继续推进；原文与部门建议会保留在项目记录中。</p><button class="yp-link" type="button" data-action="decision">查看待决问题 ${icon('arrow-right')}</button></div></section>`:''}<section class="yp-section"><div class="yp-section-title"><h2>项目输入</h2><span class="yp-small">默认发送给整个项目 · 可在部门内定向指导</span></div>${composeProject(p)}</section><section class="yp-section"><div class="yp-section-title"><div><h2>三部门流转</h2><p class="yp-small" style="margin-top:3px">需求交接、工程交付与验收反馈</p></div><div class="yp-view-toggle" role="group" aria-label="流转视图"><button type="button" class="${state.overviewMode==='flow'?'is-selected':''}" data-overview-mode="flow">流程</button><button type="button" class="${state.overviewMode==='board'?'is-selected':''}" data-overview-mode="board">看板</button></div></div>${state.overviewMode==='flow'?flowView(p):boardView(p)}</section><section class="yp-section"><div class="yp-section-title"><h2>最近交接</h2><button class="yp-link" type="button" data-action="open-all-handoffs">查看全部</button></div>${handoffList(p,4)}</section>`;
}
function messageView(m){return `<article class="yp-message ${m.author==='你'?'user':''}"><div class="yp-row yp-between"><strong>${esc(m.author)} · ${esc(m.kind||'部门消息')}</strong><span class="yp-small">${esc(m.time||'刚刚')} · ${tag(m.status||'已记录',m.status==='待你回应'?'amber':'green')}</span></div><p>${esc(m.text)}</p><p class="yp-message-context">范围：${esc(m.scopeLabel||'整个项目')}${m.snapshotId?` · <button type="button" class="yp-link" data-attempt="${esc(m.snapshotId)}" data-return-dept="${esc(state.department)}" data-return-scope="${esc(state.deptScope[state.department]||'all')}">查看关联快照 ${icon('arrow-up-right')}</button>`:''}</p></article>`}
function composeDepartment(p,dept,scope){const key=`${p.id}|${dept}|${scope}`;return `<form class="yp-composer" data-form="department-input" data-dept="${dept}" data-scope="${scope}"><div class="yp-small" style="margin-bottom:8px">接收范围 · ${scope==='all'?'整个项目':esc(itemById(scope,p)?.title||scope)}</div><textarea data-draft="${esc(key)}" aria-label="发给${roles[dept].name}的指导" placeholder="给${roles[dept].name}追加目标、问题或具体指导…">${esc(state.drafts[key]||'')}</textarea><div class="yp-composer-footer"><span class="yp-small">追加指导 · 发送后等待部门处理</span><button class="yp-btn primary" type="submit">发送给${roles[dept].name} ${icon('send')}</button></div></form>`}
function inspector(p,dept,scope,snapshots){
 const selected=snapshots.find(s=>s.id===state.snapshotId)||snapshots.at(-1)||null;
 const data=selected?ensureObservation().snapshot(selected.id):null;
 if(selected)state.snapshotId=selected.id;
 const rules={product:'持续维护项目目标、需求与取舍。保留用户原话，重要且无法推断的产品决定向用户提出。',engineering:'依据有效要求形成方案、实施和自检。保留项目架构与决定原因，收到质检反馈后修复并重新交付。',quality:'依据项目要求独立检查交付，保留实际验证范围和证据。业务取舍交产品明确，工程问题附复现依据。'};
 const chooser=snapshots.length?`<label class="yp-field" style="margin-top:12px">查看请求快照<select data-snapshot-select>${snapshots.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?.id?'selected':''}>${esc(s.label)}</option>`).join('')}</select></label>`:'<p class="yp-small">尚无模型请求，可先进行项目讨论。</p>';
 let body='';
 if(state.inspect==='context')body=data?`<div class="yp-small" style="margin-top:12px">${esc(data.context.version)} · ${esc(data.context.capturedAt)}</div><details open><summary>当次输入正文</summary><p>${esc(data.context.body)}</p></details><details open><summary>来源与版本</summary>${data.context.sources.map(s=>`<p><strong>${esc(s.name)}</strong><br>${esc(s.version)} · ${esc(s.scope)}</p>`).join('')}</details><details><summary>未纳入内容</summary><p>${esc(data.context.omitted)}</p></details>`:`<details open><summary>项目工作依据</summary><p>${esc(p.goal)}</p><p>当前成果：${esc(p.baseline)}</p></details><p class="yp-small">这是项目当前资料，尚无对应的请求输入快照。</p>`;
 if(state.inspect==='provider')body=data?`<div class="yp-detail"><h3>${esc(data.provider.name)}</h3><p>请求模型：${esc(data.provider.requestedModel)}<br>返回模型：${esc(data.provider.responseModel||'未返回')}<br>协议：${esc(data.provider.protocol)}<br>温度：${esc(data.provider.temperature)}<br>最大输出：${esc(data.provider.maxOutputTokens)}<br>配置版本：${esc(data.provider.version)}</p></div><p class="yp-small">所选请求的配置快照 · 示例</p>`:'<p>还没有请求配置快照。Provider 配置将在后续设计中补充。</p>';
 if(state.inspect==='prompt')body=`${promptConfigurationSummary(p,dept)}${data?`<h3 style="margin-top:18px">所选请求实际使用</h3><div class="yp-small" style="margin-top:12px">${esc(data.prompt.version)} · 当次采用</div><div class="yp-code">${esc(data.prompt.body)}</div>`:'<p class="yp-small">尚无请求采用记录。保存配置不会生成模型请求。</p>'}`;
 return `<aside class="yp-inspector" aria-label="部门检查区"><div class="yp-row yp-between"><h3>工作依据检查</h3><span class="yp-tag outline">${roles[dept].name}</span></div><nav class="yp-tabs" aria-label="检查内容">${[['context','Context'],['provider','Provider'],['prompt','Prompt']].map(([key,label])=>`<button class="yp-tab ${state.inspect===key?'is-selected':''}" type="button" data-inspect="${key}" aria-pressed="${state.inspect===key}">${label}</button>`).join('')}</nav>${chooser}${body}${data?`<button class="yp-link" style="margin-top:16px" type="button" data-attempt="${esc(data.id)}" data-return-dept="${dept}" data-return-scope="${esc(scope)}">查看模型请求 ${icon('arrow-up-right')}</button>`:''}</aside>`;
}
function sourcesPage(){const p=current();return `${commonHeader('资料与依据','项目长期保留的资料说明、三部门依据与待验证项。',`<button class="yp-btn" type="button" data-action="add-source">${icon('plus')}登记资料</button>`)}<section class="yp-section"><div class="yp-info-strip">${icon('info')}<span><strong>本原型只登记位置和说明。</strong> 不读取真实目录，资料支持、推断和待验证项分开保存。</span></div><div class="yp-report">${(p.sources||[]).map(s=>`<div class="yp-source-row">${icon(s.type==='待验证'?'circle-help':'file-text')}<div><strong>${esc(s.name)}</strong><small>${esc(s.text)}</small></div>${tag(s.type,s.type==='待验证'?'amber':'green')}</div>`).join('')}</div></section><section class="yp-section"><div class="yp-section-title"><h2>三部门当前依据</h2><span class="yp-small">项目级长期范围</span></div><div class="yp-report">${Object.entries(roles).map(([k,r])=>`<div class="yp-fact"><span>${esc(r.name)}</span><div><strong>${esc(r.text)}</strong><small>${k==='product'?'维护目标、需求和重要取舍。':k==='engineering'?'维护架构、代码现状和实施决定。':'维护验收依据、缺陷与验证记录。'}</small></div></div>`).join('')}</div></section>`}

lass="yp-btn" type="button" data-action="leave-wizard">取消</button><button class="yp-btn primary" type="submit">${w.kind==='idea'?'建立并开始':'继续建立三部门依据'} ${icon('arrow-right')}</button></div></form></div>`;return importReport(w)}
function importReport(w){const name=w.name||'货物装载规划';return `<div class="yp-wizard"><div class="yp-eyebrow">项目管理 · 三部门建档</div><h1>${esc(name)}</h1><p class="yp-subtitle">以下是根据已登记位置和资料说明生成的示例现状。事实、推断和待验证项分开保留。</p><div class="yp-report">${Object.entries(roles).map(([k,r])=>`<section class="yp-detail"><div class="yp-row yp-between"><h3>${esc(r.name)} · ${esc(r.text)}</h3>${tag(k==='quality'?'待验证':'已整理',k==='quality'?'amber':'green')}</div><p>${k==='product'?'已有目标聚焦装载方案生成与比较；混装方案的优先指标仍需确认。':k==='engineering'?'已登记代码和运行位置，现状扫描在正式开发时再执行；本原型只展示建档结果。':'已登记手动摆放、保存恢复和导出检查方向；本轮实际验证尚未发生。'}</p></section>`).join('')}</div><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="wizard-back">调整项目信息</button><button class="yp-btn primary" type="button" data-action="finish-import">建立项目 ${icon('arrow-right')}</button></div><p class="yp-small" style="margin-top:10px">建档记录与实际验证分开；建立后可从项目概览继续输入。</p></div>`}

p>'}</div><div class="yp-row" style="margin-top:16px">${Object.entries(roles).map(([key,r])=>`<button class="yp-btn" type="button" data-open-dept="${key}" data-focus-item="${item.id}">进入${r.name} ${icon("arrow-up-right")}</button>`).join("")}</div><div class="yp-form-actions"><span class="yp-small">动作仅更新本地示例记录。</span><div class="yp-row">${action}</div></div></section>`}

function showModal(kind){state.menu=false;const p=current();let title='',body='';if(kind==='rename')body=`<form class="yp-form" data-form="rename"><label class="yp-field">项目名称<input name="name" value="${esc(p.name)}" required maxlength="60"></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">取消</button><button class="yp-btn primary" type="submit">保存名称</button></div></form>`;else if(kind==='archive')body=`<p>「${esc(p.name)}」会从日常列表收起，资料、部门记录和工作项保留。你可以在已归档项目中恢复。</p><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">保留在列表</button><button class="yp-btn primary" type="button" data-action="confirm-archive">归档项目</button></div>`;else if(kind==='decision')body=`<p>${esc(p.question||'请补充本项目的重要取舍')}</p><div class="yp-report"><h3>当前部门建议</h3><p>数量和体积分别呈现，先提供两种方案供比较；这只是原型里的部门建议，不代表已采用。</p></div><form class="yp-form" data-form="decision"><label class="yp-field">你的决定<textarea name="answer" required>${esc(p.answer||'数量和体积分别展示，先提供两种方案供比较。')}</textarea></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">稍后处理</button><button class="yp-btn primary" type="submit">记录决定</button></div></form>`;else if(kind==='add-source')body=`<form class="yp-form" data-form="source"><label class="yp-field">资料名称<input name="name" required placeholder="例如：新版需求说明"></label><label class="yp-field">位置或内容说明<textarea name="text" required placeholder="填写来源、文件位置或需要补充的内容"></textarea><small>本原型只登记说明，不读取或上传文件。</small></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">取消</button><button class="yp-btn primary" type="submit">登记资料</button></div></form>`;overlay.innerHTML=`<section class="yp-modal" role="dialog" aria-modal="true" aria-labelledby="yp-modal-title"><div class="yp-row yp-between"><h2 id="yp-modal-title">${title||({rename:'重命名项目',archive:'归档项目',decision:'需要你决定','add-source':'登记项目资料'}[kind]||'项目操作')}</h2><button class="yp-icon" type="button" data-action="close-modal" aria-label="关闭对话框">${icon('x')}</button></div>${body}</section>`;overlay.hidden=false;root.querySelector('.yp-shell').inert=true;initIcons();overlay.querySelector('input,textarea,button')?.focus()}

const promptConfigurations=new Map(),promptDrafts=new Map();
let promptEditor=null,promptFocusReturn=null;
const promptKey=(projectId,department)=>`${projectId}|${department}`;
const promptConfigurationApi={
 read({projectId,department}){
  if(!projects.some(p=>p.id===projectId)||!roles[department])throw new Error('项目或部门不存在');
  const key=promptKey(projectId,department);
  if(!promptConfigurations.has(key))promptConfigurations.set(key,{projectId,department,text:defaultDepartmentPrompts[department],version:1,source:'default',updatedAt:null,pending:false});
  return {...promptConfigurations.get(key),defaultText:defaultDepartmentPrompts[department]};
 },
 save({projectId,department,text,expectedVersion}){
  const current=this.read({projectId,department});
  if(typeof text!=='string'||!text.trim())throw new Error('请填写 Prompt 内容，不能只包含空格。');
  if(expectedVersion!==current.version)throw new Error('配置已被更新。你的草稿已保留，请重新打开配置后核对。');
  if(text===current.text)return current;
  const next={projectId,department,text,version:current.version+1,source:text===current.defaultText?'default':'custom',updatedAt:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),pending:true};
  promptConfigurations.set(promptKey(projectId,department),next);
  return {...next,defaultText:current.defaultText};
 }
};

},true);

projects.forEach(p=>p.workItems.forEach(item=>{for(const key of Object.keys(roles)){if(!Array.isArray(item.snapshots?.[key]))item.snapshots[key]=[];if(!Array.isArray(item.messages?.[key]))item.messages[key]=[]}}));
function departmentPage(dept){const p=current(),r=roles[dept],scope=state.deptScope[dept]||'all',item=scope==='all'?null:itemById(scope,p),messages=[];const projectMessages=(p.departmentMessages?.[dept]||[]).filter(m=>scope==='all'||m.scope==='all'||m.scope===scope);projectMessages.forEach(m=>messages.push({...m,scopeLabel:m.scope==='all'?'整个项目':itemById(m.scope,p)?.title||m.scope}));if(item)(item.messages?.[dept]||[]).forEach(m=>messages.push({...m,scopeLabel:item.title}));else activeItems(p).forEach(it=>(it.messages?.[dept]||[]).forEach(m=>messages.push({...m,scopeLabel:it.title})));const snapshots=scope==='all'?activeItems(p).flatMap(it=>(Array.isArray(it.snapshots?.[dept])?it.snapshots[dept]:[]).map(s=>({...s,itemId:it.id}))):(Array.isArray(item?.snapshots?.[dept])?item.snapshots[dept]:[]).map(s=>({...s,itemId:item.id}));return `${commonHeader(`${r.name}工作区`,`${r.text} · 围绕整个项目持续工作`,`<button class="yp-btn" type="button" data-prompt-config="${dept}">${icon('sliders-horizontal')}配置 Prompt</button>`)}<div class="yp-dept-layout"><section><div class="yp-dept-toolbar"><div><h2>部门消息</h2><p class="yp-small" style="margin-top:3px">${scope==='all'?'当前查看整个项目':`当前聚焦：${esc(item?.title||scope)}`}</p></div><label class="yp-small">查看范围 <select class="yp-scope-select" data-dept-scope="${dept}" aria-label="部门消息查看范围"><option value="all" ${scope==='all'?'selected':''}>整个项目</option>${activeItems(p).map(it=>`<option value="${it.id}" ${scope===it.id?'selected':''}>${esc(it.title)}</option>`).join('')}</select></label></div><div class="yp-timeline"><article class="yp-message"><div class="yp-row yp-between"><strong>${r.name}</strong><span class="yp-small">项目依据已载入 · 示例</span></div><p>${dept==='product'?`当前项目目标：${esc(p.goal)} 产品部持续维护需求、优先级和取舍。`:dept==='engineering'?`从「${esc(p.baseline)}」和已登记资料开始，工程部维护整体实现与技术决定。`:`质检部维护项目验收依据，区分已有证据、本轮检查和仍未验证项。`}</p><p class="yp-message-context">范围：整个项目 · 来源：项目工作依据</p></article>${messages.map(messageView).join('')||`<div class="yp-empty-col" style="margin:12px 0 20px">${r.name}还没有该范围的消息。可以直接输入指导。</div>`}</div>${composeDepartment(p,dept,scope)}</section>${inspector(p,dept,scope,snapshots)}</div>`}
function enhanceInspector(){const panel=content.querySelector('.yp-inspector');if(!panel)return;const head=panel.firstElementChild;if(head&&!head.querySelector('[data-action="toggle-inspector"]')){const button=document.createElement('button');button.type='button';button.className='yp-icon';button.dataset.action='toggle-inspector';button.setAttribute('aria-label','收起工作依据检查');head.appendChild(button)}if(head){const button=head.querySelector('[data-action="toggle-inspector"]');if(button){button.innerHTML=icon(inspectorOpen?'chevron-up':'chevron-down');button.setAttribute('aria-expanded',String(inspectorOpen));button.setAttribute('aria-label',inspectorOpen?'收起工作依据检查':'展开工作依据检查')}}Array.from(panel.children).slice(1).forEach(child=>{child.hidden=!inspectorOpen})}
function render(){const p=current();if(state.page==='observation')ensureObservation()?.setProject?.(state.projectId);root.querySelector('.yp-shell').classList.toggle('show-nav',state.nav);renderSide();renderBar();content.innerHTML=state.page==='archives'?archivesPage():state.page==='wizard'?wizardPage():!p?archivesPage():state.page==='sources'?sourcesPage():state.page==='settings'?settingsPage():state.page==='department'?departmentPage(state.department):state.page==='observation'?observationPage():overviewPage();enhanceInspector();initIcons()}
const renderPage=render;render=function(){renderPage();root.querySelector('.yp-shell').classList.toggle('nav-collapsed',state.navCollapsed);syncSidebarToggle()};
root.addEventListener('click',e=>{const el=e.target.closest('[data-action="toggle-inspector"]');if(el){inspectorOpen=!inspectorOpen;render()}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{state.overviewMode=layoutOptions.overviewMode;render()}});tweak.addSelect(layoutOptions,'overviewMode',{label:'总览默认视图',options:[{label:'三部门流程',value:'flow'},{label:'跨部门看板',value:'board'}]})}
})();
