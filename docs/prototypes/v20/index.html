<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yudao 页面原型 V20</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/page.css">
  <link rel="stylesheet" href="styles/more.css">
  <link rel="stylesheet" href="styles/models.css">
  <link rel="stylesheet" href="styles/org.css">
  <link rel="stylesheet" href="styles/lean.css">
  <link rel="stylesheet" href="styles/workspace.css">
  <link rel="stylesheet" href="styles/loop.css">
</head>
<body>
  <div class="y20-banner" role="note">
    <strong>页面原型 · 示例数据</strong>
    <span class="y20-banner-text">不带画面，内容全部是假数据，不连接任何服务；项目页只有对话（上面带循环图）与设置两页；右下角的「场景」菜单可以切换情形</span>
  </div>

  <div id="y20-window-note" class="y20-window-note" hidden></div>

  <div class="y20-app">
    <aside id="y20-sidebar" class="y20-sidebar" aria-label="首页与项目"></aside>
    <div class="y20-scrim" data-act="drawer" aria-hidden="true"></div>
    <div class="y20-main">
      <header id="y20-topbar" class="y20-topbar"></header>
      <nav id="y20-tabs" class="y20-tabbar" aria-label="项目页面" hidden></nav>
      <main id="y20-content" class="y20-content"></main>
    </div>
  </div>

  <div id="y20-toolbar" class="y20-toolbar" aria-label="原型工具条"></div>
  <div id="y20-modal-root"></div>
  <div id="y20-toast-root" class="y20-toast-root" aria-live="polite"></div>

  <script src="js/y20.js"></script>
  <script src="js/kit.js"></script>
  <script src="js/org.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/pages.js"></script>
  
  <script src="js/data-more.js"></script>
  <script src="js/models.js"></script>
  <script src="js/system.js"></script>
  <script src="js/more.js"></script>
  <script src="js/orgpage.js"></script>
  <script src="js/newflow.js"></script>
  <script src="js/design-data.js"></script>
  <script src="js/lean.js"></script>
  <script src="js/work-units.js"></script>
  <script src="js/organization-ui.js"></script>
  <script src="js/preview-flows.js"></script>
  <script>Y20.app.start();</script>
</body>
</html>
