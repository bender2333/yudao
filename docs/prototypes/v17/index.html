<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yudao 页面原型 v17</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/page.css">
  <link rel="stylesheet" href="styles/more.css">
  <link rel="stylesheet" href="styles/models.css">
  <link rel="stylesheet" href="styles/org.css">
</head>
<body>
  <div class="y17-banner" role="note">
    <strong>页面原型 · 示例数据</strong>
    <span class="y17-banner-text">不带画面，内容全部是假数据，不连接任何服务；右下角的「场景」菜单可以切换情形</span>
  </div>

  <div id="y17-window-note" class="y17-window-note" hidden></div>

  <div class="y17-app">
    <aside id="y17-sidebar" class="y17-sidebar" aria-label="首页与项目"></aside>
    <div class="y17-scrim" data-act="drawer" aria-hidden="true"></div>
    <div class="y17-main">
      <header id="y17-topbar" class="y17-topbar"></header>
      <nav id="y17-tabs" class="y17-tabbar" aria-label="项目页面" hidden></nav>
      <main id="y17-content" class="y17-content"></main>
    </div>
  </div>

  <div id="y17-toolbar" class="y17-toolbar" aria-label="原型工具条"></div>
  <div id="y17-modal-root"></div>
  <div id="y17-toast-root" class="y17-toast-root" aria-live="polite"></div>

  <script src="js/y17.js"></script>
  <script src="js/kit.js"></script>
  <script src="js/org.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/dept.js"></script>
  <script src="js/data-more.js"></script>
  <script src="js/models.js"></script>
  <script src="js/system.js"></script>
  <script src="js/more.js"></script>
  <script src="js/orgpage.js"></script>
  <script src="js/newflow.js"></script>
  <script>Y17.app.start();</script>
</body>
</html>
