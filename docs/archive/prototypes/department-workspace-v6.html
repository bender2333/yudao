<!-- Yudao 综合工作台原型 v6 · 模型管理全局返回与 JSON 编辑器、卡片操作栏重构、三部门独立弹窗配置 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yudao · 项目工作台与协作 (v6)</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-width: 0; min-height: 100%; background: light-dark(#f7f8f7, #171918); }
    body { overflow-x: hidden; }

    #yudao-project-prototype {
      --yp-bg: light-dark(#f7f8f7, #171918);
      --yp-side: light-dark(#eef1ef, #1c201d);
      --yp-surface: light-dark(#fff, #212522);
      --yp-soft: light-dark(#f1f4f2, #292e2a);
      --yp-text: light-dark(#29312d, #e7eee9);
      --yp-muted: light-dark(#68766e, #a4b1a8);
      --yp-line: light-dark(#dce4de, #37443b);
      --yp-green: light-dark(#087f69, #6bd8ba);
      --yp-tint: light-dark(#e4f2eb, #243e32);
      --yp-amber: light-dark(#96680e, #e2be71);
      --yp-amber-bg: light-dark(#faf1dc, #3a3223);
      --yp-red: light-dark(#b44338, #ee9e92);
      --yp-blue: light-dark(#39658c, #95bde3);
      font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      color: var(--yp-text);
      background: var(--yp-bg);
      position: relative;
      min-width: 0;
      text-align: left;
    }

    #yudao-project-prototype * { box-sizing: border-box; }
    #yudao-project-prototype [hidden] { display: none !important; }
    #yudao-project-prototype button,
    #yudao-project-prototype input,
    #yudao-project-prototype textarea,
    #yudao-project-prototype select { font: inherit; color: inherit; }
    #yudao-project-prototype button { cursor: pointer; }
    #yudao-project-prototype button:disabled { cursor: default; opacity: .55; }
    #yudao-project-prototype h1,
    #yudao-project-prototype h2,
    #yudao-project-prototype h3,
    #yudao-project-prototype p { margin: 0; }
    #yudao-project-prototype h1 { font-size: 24px; font-weight: 500; line-height: 1.4; letter-spacing: -.4px; }
    #yudao-project-prototype h2 { font-size: 16px; font-weight: 500; }
    #yudao-project-prototype h3 { font-size: 14px; font-weight: 500; }
    #yudao-project-prototype strong { font-weight: 500; }
    #yudao-project-prototype svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* 外壳骨架 */
    #yudao-project-prototype .yp-shell { display: grid; grid-template-columns: 218px minmax(0, 1fr); min-height: 100vh; }
    #yudao-project-prototype .yp-sidebar { background: var(--yp-side); border-right: 1px solid var(--yp-line); padding: 20px 13px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    #yudao-project-prototype .yp-brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; font-size: 17px; font-weight: 500; letter-spacing: .3px; }
    #yudao-project-prototype .yp-brand svg { color: var(--yp-green); width: 21px; height: 21px; }
    #yudao-project-prototype .yp-proto { font-size: 10px; color: var(--yp-muted); border: 1px solid var(--yp-line); border-radius: 4px; padding: 1px 4px; letter-spacing: 1px; margin-left: auto; }
    #yudao-project-prototype .yp-muted { color: var(--yp-muted); }
    #yudao-project-prototype .yp-small { font-size: 12px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-row { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
    #yudao-project-prototype .yp-between { justify-content: space-between; }
    #yudao-project-prototype .yp-side-label { display: flex; align-items: center; justify-content: space-between; padding: 0 9px; margin: 0 0 8px; font-size: 11px; letter-spacing: 1px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-icon { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; padding: 7px; min-width: 30px; min-height: 30px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-icon:hover { background: var(--yp-soft); color: var(--yp-text); }
    #yudao-project-prototype .yp-search { display: flex; align-items: center; gap: 7px; border: 1px solid var(--yp-line); background: var(--yp-surface); border-radius: 7px; padding: 7px 9px; margin-top: 10px; }
    #yudao-project-prototype .yp-search input { width: 100%; min-width: 0; border: 0; background: transparent; font-size: 12px; padding: 0; outline: none; }
    #yudao-project-prototype .yp-project-list { display: grid; gap: 3px; }
    #yudao-project-prototype .yp-project { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 7px; display: flex; gap: 8px; text-align: left; align-items: center; padding: 9px 8px; margin-top: 2px; }
    #yudao-project-prototype .yp-project:hover { background: var(--yp-soft); }
    #yudao-project-prototype .yp-project.is-selected { background: var(--yp-tint); color: var(--yp-green); border-color: color-mix(in srgb, var(--yp-green) 15%, transparent); }
    #yudao-project-prototype .yp-project span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #yudao-project-prototype .yp-project .yp-project-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--yp-muted); flex: none; }
    #yudao-project-prototype .yp-project.is-selected .yp-project-mark { background: var(--yp-green); }
    #yudao-project-prototype .yp-side-bottom { margin-top: auto; display: grid; gap: 6px; border-top: 1px solid var(--yp-line); padding-top: 14px; }
    #yudao-project-prototype .yp-sidebar-link { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 8px 9px; border-radius: 6px; color: var(--yp-muted); font-size: 12px; }
    #yudao-project-prototype .yp-sidebar-link:hover { background: var(--yp-soft); color: var(--yp-text); }
    #yudao-project-prototype .yp-sidebar-link.is-active { background: var(--yp-soft); color: var(--yp-green); font-weight: 500; }
    #yudao-project-prototype .yp-sidebar-link .yp-count { margin-left: auto; font-size: 11px; }

    /* 顶栏 */
    #yudao-project-prototype .yp-main { min-width: 0; display: flex; flex-direction: column; }
    #yudao-project-prototype .yp-topbar { padding: 12px 28px; min-height: 56px; border-bottom: 1px solid var(--yp-line); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--yp-surface); position: sticky; top: 0; z-index: 20; }
    #yudao-project-prototype .yp-breadcrumb { display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 12px; color: var(--yp-muted); flex-wrap: wrap; }
    #yudao-project-prototype .yp-breadcrumb button { padding: 0; border: 0; background: none; color: var(--yp-muted); }
    #yudao-project-prototype .yp-breadcrumb strong { color: var(--yp-text); }
    #yudao-project-prototype .yp-auto { font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--yp-muted); white-space: nowrap; }
    #yudao-project-prototype .yp-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--yp-green); flex-shrink: 0; }

    /* 主内容区 */
    #yudao-project-prototype .yp-content { padding: 24px 28px 48px; max-width: 1200px; margin: 0 auto; width: 100%; min-width: 0; }
    #yudao-project-prototype .yp-eyebrow { font-size: 11px; letter-spacing: 1.3px; color: var(--yp-muted); margin-bottom: 6px; }
    #yudao-project-prototype .yp-heading { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    #yudao-project-prototype .yp-heading-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; position: relative; }
    #yudao-project-prototype .yp-subtitle { font-size: 13px; color: var(--yp-muted); margin-top: 6px; max-width: 75ch; overflow-wrap: anywhere; }

    /* 按钮 */
    #yudao-project-prototype .yp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--yp-line); border-radius: 6px; background: var(--yp-surface); font-size: 13px; min-height: 33px; white-space: nowrap; }
    #yudao-project-prototype .yp-btn:hover { background: var(--yp-soft); }
    #yudao-project-prototype .yp-btn.primary { background: var(--yp-green); color: light-dark(#fff, #102b20); border-color: var(--yp-green); }
    #yudao-project-prototype .yp-btn.small { padding: 4px 10px; font-size: 12px; min-height: 26px; }
    #yudao-project-prototype .yp-btn.danger { color: var(--yp-red); border-color: color-mix(in srgb, var(--yp-red) 30%, transparent); }
    #yudao-project-prototype .yp-btn.danger:hover { background: color-mix(in srgb, var(--yp-red) 10%, transparent); }

    /* 标签页导航栏 */
    #yudao-project-prototype .yp-tabs-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--yp-line);
      margin-top: 14px;
      overflow: visible;
    }
    #yudao-project-prototype .yp-tabs {
      display: flex;
      gap: 6px;
      overflow: visible;
      margin-bottom: -1px;
    }
    #yudao-project-prototype .yp-tab {
      padding: 9px 15px;
      border: 0;
      background: transparent;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      color: var(--yp-muted);
      white-space: nowrap;
    }
    #yudao-project-prototype .yp-tab:hover { color: var(--yp-text); }
    #yudao-project-prototype .yp-tab.is-selected { color: var(--yp-green); border-bottom-color: var(--yp-green); font-weight: 500; }
    #yudao-project-prototype .yp-tabs-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 6px;
    }

    /* 通用面板与列表 */
    #yudao-project-prototype .yp-section { margin-top: 24px; }
    #yudao-project-prototype .yp-section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    #yudao-project-prototype .yp-project-summary { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; border: 1px solid var(--yp-line); border-radius: 9px; padding: 16px 20px; background: var(--yp-surface); margin-top: 20px; }
    #yudao-project-prototype .yp-summary-side { border-left: 1px solid var(--yp-line); padding-left: 18px; display: grid; gap: 10px; }
    #yudao-project-prototype .yp-summary-item span { display: block; font-size: 11px; color: var(--yp-muted); }
    #yudao-project-prototype .yp-summary-item strong { font-size: 13px; font-weight: 500; }
    #yudao-project-prototype .yp-handoff-list { display: grid; gap: 8px; }
    #yudao-project-prototype .yp-handoff { border: 1px solid var(--yp-line); border-radius: 8px; padding: 12px 16px; background: var(--yp-surface); display: flex; align-items: center; gap: 16px; }
    #yudao-project-prototype .yp-handoff-time { font-size: 11px; color: var(--yp-muted); width: 85px; flex-shrink: 0; }
    #yudao-project-prototype .yp-handoff-status { margin-left: auto; font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--yp-soft); color: var(--yp-muted); }
    #yudao-project-prototype .yp-handoff-status.rework { background: var(--yp-amber-bg); color: var(--yp-amber); }
    #yudao-project-prototype .yp-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    #yudao-project-prototype .yp-tag.green { background: var(--yp-tint); color: var(--yp-green); }
    #yudao-project-prototype .yp-tag.amber { background: var(--yp-amber-bg); color: var(--yp-amber); }

    /* ================= 2D 像素风部门房间样式 ================= */
    .pixel-room-boundary {
      border: 3px solid #23272a;
      border-radius: 10px;
      background: #1e2022;
      color: #cad3f5;
      padding: 16px;
      margin-top: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .pixel-room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px dashed #3a3f44;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .pixel-room-stage {
      position: relative;
      min-height: 250px;
      background: #141618;
      border: 2px solid #2f343a;
      border-radius: 8px;
      margin-top: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pixel-stage-toolbar {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .pixel-stage-toolbar .yp-btn {
      background: #24292e;
      border-color: #3f464e;
      color: #e1e7ec;
    }
    .pixel-room-topwall {
      background: #191c1e;
      border-bottom: 4px solid #0d0e10;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .crt-monitor-board {
      background: #08110b;
      border: 2px solid #1f3b25;
      border-radius: 6px;
      padding: 10px 14px;
      color: #4eed7a;
      font-family: "Courier New", Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      box-shadow: inset 0 0 10px rgba(78, 237, 122, 0.2);
      min-width: 280px;
      position: relative;
    }
    .crt-monitor-board::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    .pixel-room-floor {
      flex: 1;
      background:
        linear-gradient(45deg, #1b1d20 25%, transparent 25%),
        linear-gradient(-45deg, #1b1d20 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1b1d20 75%),
        linear-gradient(-45deg, transparent 75%, #1b1d20 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
      background-color: #17191b;
      position: relative;
      padding: 30px 40px 15px;
      display: flex;
      align-items: flex-end;
      min-height: 140px;
    }
    .pixel-desk-lane {
      display: flex;
      gap: 48px;
      align-items: flex-end;
      width: 100%;
    }
    .pixel-workstation {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pixel-bubble {
      background: #fff;
      color: #1a1a1a;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      position: absolute;
      bottom: 84px;
      white-space: nowrap;
      border: 2px solid #000;
      font-weight: bold;
      animation: floatBubble 2.5s ease-in-out infinite alternate;
    }
    .pixel-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #000 transparent;
      display: block;
      width: 0;
    }
    @keyframes floatBubble {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    .pixel-agent {
      width: 32px;
      height: 44px;
      position: relative;
      margin-bottom: 2px;
      z-index: 2;
    }
    .pixel-agent-head {
      width: 24px;
      height: 24px;
      background: #ffcc80;
      border: 2px solid #000;
      margin: 0 auto;
      position: relative;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
      animation: headBob 2s ease-in-out infinite;
    }
    @keyframes headBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(1px); }
    }
    .pixel-agent-eye-l, .pixel-agent-eye-r {
      width: 4px;
      height: 5px;
      background: #000;
      position: absolute;
      top: 7px;
    }
    .pixel-agent-eye-l { left: 4px; }
    .pixel-agent-eye-r { right: 4px; }
    .pixel-agent-body {
      width: 28px;
      height: 18px;
      background: #087f69;
      border: 2px solid #000;
      margin: -2px auto 0;
      font-size: 8px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-weight: bold;
    }
    .pixel-workstation.subagent .pixel-agent-body {
      background: #39658c;
    }
    .pixel-desk {
      width: 76px;
      height: 26px;
      background: #8d5b36;
      border: 2px solid #000;
      position: relative;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
      z-index: 3;
    }
    .pixel-computer {
      width: 26px;
      height: 20px;
      background: #2b3036;
      border: 2px solid #000;
      position: absolute;
      top: -20px;
      left: 24px;
      box-shadow: 1px 1px 0 rgba(255,255,255,0.2) inset;
    }
    .pixel-computer::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: #11a37f;
      animation: screenFlicker 3s infinite;
    }
    @keyframes screenFlicker {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.7; }
      52% { opacity: 0.95; }
    }
    .pixel-workstation-label {
      font-size: 10px;
      font-family: monospace;
      color: #8c97a4;
      margin-top: 6px;
    }
    .pixel-room-log {
      background: #101214;
      border: 1px solid #2a2e33;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 11px;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pixel-log-row {
      display: flex;
      gap: 10px;
      color: #8b949e;
    }
    .pixel-log-time { color: #565f69; flex-shrink: 0; }
    .pixel-log-msg { color: #c9d1d9; }
    .pixel-log-msg.highlight { color: #58a6ff; }

    /* 人类指令下达输入区 */
    .pixel-room-input-box {
      margin-top: 14px;
      border: 1px solid var(--yp-line);
      border-radius: 8px;
      padding: 14px 16px;
      background: var(--yp-surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pixel-input-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pixel-input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    .pixel-input-row textarea {
      flex: 1;
      min-height: 60px;
      resize: vertical;
      border: 1px solid var(--yp-line);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--yp-bg);
      font-size: 13px;
      line-height: 1.5;
      outline: none;
    }
    .pixel-input-row textarea:focus { border-color: var(--yp-green); }

    /* 模态弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: var(--yp-surface);
      border: 1px solid var(--yp-line);
      border-radius: 10px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 90vh;
    }
    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--yp-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .modal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .modal-foot {
      padding: 12px 18px;
      border-top: 1px solid var(--yp-line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--yp-soft);
    }

    /* ================= 模型管理完整交互样式 ================= */
    .pm-preset-pill-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .pm-preset-pill {
      border: 1px solid var(--yp-line);
      background: var(--yp-surface);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s ease;
      color: var(--yp-text);
    }
    .pm-preset-pill:hover {
      border-color: var(--yp-green);
      background: var(--yp-soft);
    }
    .pm-preset-pill.active {
      background: var(--yp-tint);
      border-color: var(--yp-green);
      color: var(--yp-green);
      font-weight: 500;
    }
    .pm-editor-panel {
      border: 1px solid var(--yp-line);
      border-radius: 8px;
      padding: 20px;
      background: var(--yp-surface);
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pm-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--yp-line);
      padding-bottom: 12px;
    }
    .pm-panel-title {
      font-size: 15px;
      font-weight: 600;
    }
    .pm-form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .pm-form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .pm-form-field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--yp-text);
      display: flex;
      justify-content: space-between;
    }
    .pm-field-hint {
      font-size: 11px;

  // 辅助函数与模型管理操作
  function getAdmittedModels(providerId) {
    const p = modelState.providers.find(item => item.id === providerId);
    if (!p) return [];
    return p.models.filter(m => m.status === '已准入');
  }

  window.toggleExpand = function(id) {
    const item = modelState.providers.find(p => p.id === id);
    if (item) {
      item.expanded = !item.expanded;
      render();
    }
  };

  window.testSingleModel = function(pId, mId, e) {
    e.stopPropagation();
    toast(`正在对模型 [${mId}] 执行准入测试...`);
    setTimeout(() => {
      toast(`模型 [${mId}] 响应正常，验证通过！`);
    }, 600);
  };

  window.removeModelFromProvider = function(pId, mId, e) {
    e.stopPropagation();
    const p = modelState.providers.find(item => item.id === pId);
    if (!p) return;
    const isBound = Object.values(globalDeptBindings).some(b => b.providerId === pId && b.modelId === mId);
    if (isBound) {

  window.formatJsonEditor = function() {
    const area = document.getElementById('jsonEditorTextarea');
    const errBox = document.getElementById('jsonEditorError');
    try {
      const obj = JSON.parse(area.value);
      area.value = JSON.stringify(obj, null, 2);
      errBox.style.display = 'none';
      toast('JSON 格式化成功');
    } catch (e) {
      errBox.textContent = `JSON 语法解析失败: ${e.message}`;
      errBox.style.display = 'block';
    }
  };

  window.resetJsonEditor = function() {
    openJsonEditorModal();
    toast('已重置为当前系统配置');
  };

  window.copyJsonEditor = function() {
    const area = document.getElementById('jsonEditorTextarea');
    navigator.clipboard.writeText(area.value).then(() => {
      toast('已复制 JSON 到剪贴板');
    }).catch(() => {
      area.select();
      document.execCommand('copy');
      toast('已复制 JSON 到剪贴板');
    });
  };

  window.saveJsonEditor = function() {
    const area = document.getElementById('jsonEditorTextarea');
    const errBox = document.getElementById('jsonEditorError');
    try {
      const parsed = JSON.parse(area.value);
      if (!parsed || !Array.isArray(parsed.providers)) {
        throw new Error('配置顶层必须包含 "providers" 数组');
      }
      if (parsed.providers.length === 0) {
        throw new Error('"providers" 数组不可为空');
      }
      for (let i = 0; i < parsed.providers.length; i++) {
        const p = parsed.providers[i];
        if (!p.id || !p.name || !p.protocol || !p.baseUrl) {
          throw new Error(`供应商第 ${i + 1} 项缺少必要属性 (id, name, protocol, baseUrl)`);
        }
        if (!Array.isArray(p.models)) {
          p.models = [];
        }
      }

      // 更新 Provider 配置库
      modelState.providers = parsed.providers.map(p => ({
        ...p,
        expanded: p.expanded !== undefined ? p.expanded : true
      }));

      // 若 JSON 包含全局部门配置则同步应用
      if (parsed.globalDeptBindings) {
        for (const k of ['product', 'engineering', 'quality']) {
          if (parsed.globalDeptBindings[k]) {
            globalDeptBindings[k] = { ...globalDeptBindings[k], ...parsed.globalDeptBindings[k] };
          }
        }
      }

      closeModal();
      render();
      toast('模型与 Provider JSON 配置已成功保存生效！');
    } catch (e) {
      errBox.textContent = `保存失败: ${e.message}`;
      errBox.style.display = 'block';
    }
  };

  // 资料与依据配置弹窗
  window.openProjectSourcesModal = function() {
    const cur = projects[currentProjectId];
    const modal = document.getElementById('modalContainer');

    modal.innerHTML = `
      <div class="modal-card" style="max-width: 660px; width: 92%;">
        <div class="modal-head">
          <div style="display: flex; align-items: center; gap: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <strong>${cur.name} · 资料与依据配置</strong>
          </div>
          <button class="yp-btn small" type="button" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
          <p class="yp-small" style="margin: 0; color: var(--yp-muted);">在此配置项目需求原始文件与各阶段产出依据的放置路径。三部门 Agent 工作时将严格以配置路径作为输入上下文与交付依据。</p>

          <div class="pm-form-field">
            <label style="font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;">
              <span>📝 原始用户需求放置位置 (User Intent / INTEND.MD)</span>
              <span class="pm-field-hint">只读输入 · 保持用户原话</span>
            </label>
            <input type="text" id="cfgMaterial" value="${cur.material}" placeholder="例如：intend.md 或 materials/intend.md" style="font-family: monospace;">
            <div style="font-size: 11px; color: var(--yp-muted); margin-top: 2px;">保存用户初始自然语言诉求与原始背景材料，系统在任何阶段均禁止改写此文件。</div>
          </div>

          <div class="pm-form-field">
            <label style="font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;">
              <span>📋 产品需求规格说明书路径 (PRD.MD)</span>
              <span class="pm-field-hint">产品部职责</span>
            </label>
            <input type="text" id="cfgPrd" value="${cur.prdPath}" placeholder="例如：docs/PRD.md 或 PRD.md" style="font-family: monospace;">
            <div style="font-size: 11px; color: var(--yp-muted); margin-top: 2px;">产品部根据原始需求整理并维护的有效需求合同，作为工程部实施的权威依据。</div>
          </div>

          <div class="pm-form-field">
            <label style="font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;">
              <span>📐 工程事前计划路径 (PLAN.MD)</span>
              <span class="pm-field-hint">工程部职责</span>
            </label>
            <input type="text" id="cfgPlan" value="${cur.planPath}" placeholder="例如：docs/PLAN.md 或 PLAN.md" style="font-family: monospace;">
            <div style="font-size: 11px; color: var(--yp-muted); margin-top: 2px;">工程部在编写具体代码前必须提交并保存的事前实施步骤与技术分解方案。</div>
          </div>

          <div class="pm-form-field">
            <label style="font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;">
              <span>🔍 质检独立验收标准路径 (ACCEPTANCE.MD)</span>
              <span class="pm-field-hint">质检部职责</span>
            </label>
            <input type="text" id="cfgAcceptance" value="${cur.acceptancePath}" placeholder="例如：docs/ACCEPTANCE.md" style="font-family: monospace;">
            <div style="font-size: 11px; color: var(--yp-muted); margin-top: 2px;">质检部执行自动化检查、代码复核与放行决策的判定规则依据。</div>
          </div>

          <div class="pm-form-field">
            <label style="font-size: 12px; font-weight: 600; display: flex; justify-content: space-between;">
              <span>📂 本地工作区物理路径 (Workspace Root)</span>
              <span class="pm-field-hint">宿主工作区</span>
            </label>
            <input type="text" id="cfgPath" value="${cur.path}" placeholder="例如：D:/codes/my-project" style="font-family: monospace;">
            <div style="font-size: 11px; color: var(--yp-muted); margin-top: 2px;">项目代码与工件运行的真实宿主磁盘目录路径。</div>
          </div>
        </div>
        <div class="modal-foot" style="display: flex; justify-content: space-between; align-items: center;">
          <button class="yp-btn small" type="button" onclick="resetProjectSourcesDefault()">恢复默认规范路径</button>
          <div style="display: flex; gap: 8px;">
            <button class="yp-btn small" type="button" onclick="closeModal()">取消</button>
            <button class="yp-btn small primary" type="button" onclick="saveProjectSourcesModal()">保存配置</button>
          </div>
        </div>
      </div>
    `;
    modal.style.display = 'flex';
  };

  window.resetProjectSourcesDefault = function() {
    document.getElementById('cfgMaterial').value = 'intend.md';
    document.getElementById('cfgPrd').value = 'docs/PRD.md';
    document.getElementById('cfgPlan').value = 'docs/PLAN.md';
    document.getElementById('cfgAcceptance').value = 'docs/ACCEPTANCE.md';
    toast('已填入标准规范路径');
  };

  window.saveProjectSourcesModal = function() {
    const cur = projects[currentProjectId];
    const material = document.getElementById('cfgMaterial').value.trim();
    const prd = document.getElementById('cfgPrd').value.trim();
    const plan = document.getElementById('cfgPlan').value.trim();
    const acceptance = document.getElementById('cfgAcceptance').value.trim();
    const rootPath = document.getElementById('cfgPath').value.trim();

    if (!material || !prd || !rootPath) {
      alert('原始需求路径、PRD 路径与工作区目录不可为空！');
      return;
    }

    cur.material = material;
    cur.prdPath = prd;
    cur.planPath = plan;
    cur.acceptancePath = acceptance;
    cur.path = rootPath;

    closeModal();
    render();
    toast('资料与依据路径配置已保存！');
  };

  window.toggleSubagent = function(deptKey) {
    globalDeptBindings[deptKey].subagentActive = !globalDeptBindings[deptKey].subagentActive;
    render();
    toast(globalDeptBindings[deptKey].subagentActive ? '已派发 SubAgent 协同就座！' : 'SubAgent 已完成任务离场');
  };

  window.simulatePixelAction = function(deptKey) {
    const bubble = document.getElementById(`bubble-${deptKey}`);
    if (!bubble) return;
    const old = bubble.textContent;
    bubble.textContent = '执行工具：run_check...';
    setTimeout(() => { bubble.textContent = old; }, 1400);
    toast('小人执行工具操作');
  };

  window.sendHumanInput = function(deptKey) {
    const input = document.getElementById(`humanInput-${deptKey}`);
    const val = input.value.trim();
    if (!val) {
      alert('请输入要下达的指导内容！');
      return;
    }
    const log = document.getElementById(`roomLog-${deptKey}`);
    if (log) {
      const now = new Date().toTimeString().slice(0, 8);
      const row = document.createElement('div');
      row.className = 'pixel-log-row';
      row.innerHTML = `<span class="pixel-log-time">${now}</span><span class="pixel-log-msg">[人类指导] ${val}</span>`;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }
    input.value = '';
    const bubble = document.getElementById(`bubble-${deptKey}`);
    if (bubble) bubble.textContent = '收到人类指令，正在重算任务！';
    toast('指导已注入部门下轮 Context！');
  };

  function bindModelManagementEvents() {
    if (currentPage !== 'model-management') return;

    // 绑定预置模板选择
    document.querySelectorAll(".pm-preset-pill").forEach(pill => {
      pill.onclick = () => {
        document.querySelectorAll(".pm-preset-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");

        const presetKey = pill.dataset.preset;
        const config = PRESETS[presetKey];
        if (!config) return;

        document.getElementById("inputProviderName").value = config.name;
        document.getElementById("inputProtocol").value = config.protocol;
        document.getElementById("inputBaseUrl").value = config.baseUrl;
        document.getElementById("inputDocUrl").value = config.docUrl;
        document.getElementById("inputCredRef").value = config.credRef;

        modelState.currentFormModels = JSON.parse(JSON.stringify(config.models));
        renderEditorModelTable();

        const candidateArea = document.getElementById("remoteCandidateContainer");
        if (candidateArea) candidateArea.style.display = "none";
        toast(`已加载 [${config.name}] 推荐预置`);
      };
    });

    // 绑定获取模型列表
    const fetchBtn = document.getElementById("btnFetchRemoteModels");
    if (fetchBtn) {
      fetchBtn.onclick = () => {
        const activePill = document.querySelector(".pm-preset-pill.active");
        const presetKey = activePill ? activePill.dataset.preset : "custom";
        const config = PRESETS[presetKey] || PRESETS.custom;

        toast("正在连接上游 /models 接口拉取可用模型...");
        setTimeout(() => {
          const grid = document.getElementById("candidateChipGrid");
          grid.innerHTML = config.remoteCandidates.map(candidateId => `
            <div class="pm-candidate-chip" onclick="addCandidateToModels('${candidateId}')">
              <span>+</span> <span>${candidateId}</span>
            </div>
          `).join("");

          document.getElementById("remoteCandidateContainer").style.display = "block";
          toast(`成功获取到 ${config.remoteCandidates.length} 个远端模型，点击即可勾选添加`);
        }, 600);
      };
    }

    // 绑定手动添加一行
    const addManualBtn = document.getElementById("btnAddManualModel");
    if (addManualBtn) {
      addManualBtn.onclick = () => {
        modelState.currentFormModels.push({
          id: "new-custom-model",
          window: 64000,
          maxOutput: 4096,
          status: "待核验"
        });
        renderEditorModelTable();
      };
    }

    // 绑定测试连接
    const testConnBtn = document.getElementById("btnTestConnection");
    if (testConnBtn) {
      testConnBtn.onclick = () => {
        const url = document.getElementById("inputBaseUrl").value;
        toast(`正在向 ${url} 发起连通性探针探测...`);
        setTimeout(() => {
          toast("连接成功！端点握手正常 (耗时 142ms)");
        }, 600);
      };
    }

    // 绑定保存 Provider
    const saveProvBtn = document.getElementById("btnSaveProvider");
    if (saveProvBtn) {
      saveProvBtn.onclick = () => {
        const name = document.getElementById("inputProviderName").value.trim();
        const protocol = document.getElementById("inputProtocol").value;
        const baseUrl = document.getElementById("inputBaseUrl").value.trim();
        const credRef = document.getElementById("inputCredRef").value.trim();
        const timeout = parseInt(document.getElementById("inputTimeout").value, 10) || 600;

        if (!name || !baseUrl) {
          alert("请填写供应商名称与服务地址！");
          return;
        }

        if (modelState.currentFormModels.length === 0) {
          if (!confirm("当前尚未映射任何模型，是否继续保存？")) return;
        }

        if (modelState.editingProviderId) {
          const target = modelState.providers.find(p => p.id === modelState.editingProviderId);
          if (target) {
            target.name = name;
            target.protocol = protocol;
            target.baseUrl = baseUrl;
            target.credRef = credRef;
            target.timeout = timeout;
            target.models = JSON.parse(JSON.stringify(modelState.currentFormModels));
          }
          toast("服务配置已更新");
        } else {
          const newId = "p-" + Date.now().toString(36);
          modelState.providers.unshift({
            id: newId,
            name: name,
            protocol: protocol,
            baseUrl: baseUrl,
            docUrl: document.getElementById("inputDocUrl").value.trim(),
            credRef: credRef,
            timeout: timeout,
            expanded: true,
            models: JSON.parse(JSON.stringify(modelState.currentFormModels))
          });
          toast("新增服务已保存并折叠归档");
        }

        document.getElementById("providerEditor").style.display = "none";
        render();
      };
    }
  }

  window.addCandidateToModels = function(modelId) {
    const exists = modelState.currentFormModels.some(m => m.id === modelId);
    if (exists) {
      toast(`模型 ${modelId} 已存在于映射列表中`);
      return;
    }
    modelState.currentFormModels.push({
      id: modelId,
      window: 128000,
      maxOutput: 8192,
      status: "待核验"
    });
    renderEditorModelTable();
    toast(`已添加模型：${modelId}`);
  };

  // 主渲染
  function render() {
    renderSidebarProjects();
    const cur = projects[currentProjectId];
    const topProject = document.getElementById('topbarProjectName');
    if (topProject) topProject.textContent = cur.name;

    const container = document.getElementById('mainContent');
    if (currentPage === 'overview') {
      container.innerHTML = renderOverview();
    } else if (roles[currentPage]) {
      container.innerHTML = renderDepartment(currentPage);
    } else if (currentPage === 'model-management') {
      container.innerHTML = renderModelManagement();
      bindModelManagementEvents();
    }
  }

  render();
})();
</script>
</body>
</html>
