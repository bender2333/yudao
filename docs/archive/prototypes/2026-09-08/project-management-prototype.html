const projects=[
 {id:'cargo',name:'货物装载规划',kind:'existing',pinned:true,archived:false,goal:'让计划员快速生成可执行的装载方案，兼顾空间利用与操作稳定性。',path:'C:/project/cargo-planning',material:'产品说明、交互原型、代码与测试',status:'持续开发',baseline:'装载工作台 v0.3',sourceReady:true,question:'混装方案中，优先增加装载数量，还是提高体积利用率？',answer:'',tasks:[{id:'cargo-3',title:'增加混装方案比较',status:'waiting',summary:'需要明确数量和体积的优先关系，其他分析已经完成。',messages:[]},{id:'cargo-2',title:'优化手动摆放体验',status:'done',summary:'完成选中、移动和删除交互；已检查键盘操作。',messages:[]},{id:'cargo-1',title:'接入项目并建立三部门依据',status:'done',summary:'已整理产品、工程和质检依据，保留未验证项。',messages:[]}],notes:[]},
 {id:'lab',name:'实验记录助手',kind:'idea',pinned:false,archived:false,goal:'帮助实验人员快速记录过程，让样品、参数和结果能够对应查询。',path:'尚未关联目录',material:'初始想法与用户场景',status:'从想法开始',baseline:'尚无交付',sourceReady:false,question:'',tasks:[{id:'lab-1',title:'明确最小可用版本',status:'running',summary:'产品正在整理核心场景，首轮聚焦记录与查找。',messages:[]}],notes:[]},
 {id:'archive-demo',name:'个人读书清单',kind:'idea',pinned:false,archived:true,goal:'记录阅读进度和读书笔记。',path:'尚未关联目录',material:'需求记录',status:'已归档',baseline:'首版交付',sourceReady:true,question:'',tasks:[],notes:[]}
];
const state={projectId:'cargo',page:'home',taskId:null,taskTab:'overview',inspect:'context',query:'',filter:'all',menu:false,nav:false,modal:null,drafts:{},wizard:null,sourceTab:'basis',toastTimer:null,returnPage:'home'};
const design={density:1,sidebarWidth:210};
let seq=10,modalReturn=null;
const current=()=>projects.find(p=>p.id===state.projectId);
const task=()=>current()?.tasks.find(t=>t.id===state.taskId);
const taskLabel=s=>({waiting:'需要你决定',running:'进行中',done:'已完成',stopped:'已停止',queued:'待开始'}[s]||s);
const tag=(s,tone='')=>`<span class="yp-tag ${tone}">${esc(s)}</span>`;
const statusTag=t=>tag(taskLabel(t.status),t.status==='waiting'?'amber':t.status==='running'?'green':'');
const pTabs=()=>`<nav class="yp-tabs" aria-label="项目页面">${[['home','项目概览'],['tasks','任务'],['sources','资料与依据'],['settings','项目设置']].map(([key,label])=>`<button type="button" class="yp-tab ${state.page===key?'is-selected':''}" data-page="${key}" ${state.page===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`;
const initIcons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}})};
function toast(text){toastBox.textContent=text;toastBox.hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>toastBox.hidden=true,3400)}
function renderSide(){
 const matches=projects.filter(p=>!p.archived&&p.name.toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>Number(b.pinned)-Number(a.pinned));
 side.innerHTML=`<div><div class="yp-brand">${icon('layers-3')}Yudao<span class="yp-proto">原型</span></div><label class="yp-search">${icon('search')}<input aria-label="搜索项目" placeholder="搜索项目" value="${esc(state.query)}" data-search></label></div><div><div class="yp-side-label"><span>我的项目</span><button class="yp-icon" type="button" data-action="new-project" aria-label="新建或接入项目">${icon('plus')}</button></div><div>${matches.map(p=>`<button type="button" class="yp-project ${p.id===state.projectId&&state.page!=='archives'?'is-selected':''}" data-project="${p.id}">${icon(p.pinned?'folder-heart':'folder')}<span>${esc(p.name)}</span>${p.question&&!p.answer?'<span class="yp-dot waiting" style="flex:0 0 6px"></span>':''}</button>${p.id===state.projectId?`<div class="yp-side-tasks">${p.tasks.slice(0,3).map(t=>`<button type="button" class="yp-side-task ${t.id===state.taskId?'is-selected':''}" data-task="${t.id}"><span class="yp-dot ${t.status==='waiting'?'waiting':t.status==='done'?'muted':''}"></span><span>${esc(t.title)}</span></button>`).join('')}<button class="yp-side-task" type="button" data-action="new-task">${icon('plus')}<span>新任务</span></button></div>`:''}`).join('')||'<p class="yp-footnote">没有匹配的项目</p>'}</div></div><div class="yp-side-bottom"><button class="yp-project" type="button" data-page="archives">${icon('archive')}<span>已归档项目</span>${projects.filter(p=>p.archived).length}</button><div class="yp-footnote">交互示例 · 不连接真实项目<br>刷新后恢复初始数据</div></div>`;
}
function header(){const p=current();bar.innerHTML=`<div class="yp-row"><button class="yp-icon yp-mobile-toggle" type="button" data-action="nav" aria-label="切换项目导航" aria-expanded="${state.nav}">${icon('panel-left')}</button><div class="yp-breadcrumb"><button type="button" data-action="home">项目</button>${icon('chevron-right')}<button type="button" data-page="home">${esc(p?.name||'工作空间')}</button>${state.page==='task'?`${icon('chevron-right')}<strong>任务工作台</strong>`:state.page==='wizard'?`${icon('chevron-right')}<strong>建立项目</strong>`:''}</div></div><div class="yp-auto"><span class="yp-dot"></span><span>自动推进 · 关键问题再询问</span></div>`}
function projectHeading(){const p=current();return `<header class="yp-heading"><div><div class="yp-eyebrow">${p.kind==='existing'?'接入已有项目':'从想法开始'} · ${esc(p.status)}</div><h1>${esc(p.name)}</h1><p class="yp-subtitle">${esc(p.goal)}</p></div><div class="yp-row"><button class="yp-icon" type="button" data-action="pin" aria-label="${p.pinned?'取消置顶':'置顶项目'}" title="${p.pinned?'取消置顶':'置顶项目'}">${icon(p.pinned?'pin-off':'pin')}</button><div class="yp-menu-wrap"><button class="yp-icon" type="button" data-action="menu" aria-label="项目操作" aria-expanded="${state.menu}">${icon('ellipsis')}</button>${state.menu?`<div class="yp-menu"><button type="button" data-action="rename">${icon('pencil')}重命名项目</button><button type="button" data-page="settings">${icon('settings-2')}项目设置</button><button type="button" data-action="archive">${icon('archive')}归档项目</button></div>`:''}</div></div></header>${pTabs()}`}
function compose(key,label,placeholder,action='create-task'){return `<form class="yp-composer" data-form="${action}"><textarea aria-label="${label}" placeholder="${placeholder}" data-draft="${key}" required>${esc(state.drafts[key]||'')}</textarea><div class="yp-composer-footer"><span class="yp-small">${action==='create-task'?'沿用当前项目资料与成果':'本次任务 · 产品负责接收整体要求'}</span><button class="yp-btn primary" type="submit">${icon('arrow-up')}${action==='create-task'?'开始任务':'发送要求'}</button></div></form>`}
function taskRows(list){return `<div class="yp-task-list">${list.map(t=>`<div class="yp-task-row"><span class="yp-icon">${icon(t.status==='done'?'circle-check':t.status==='waiting'?'circle-help':t.status==='stopped'?'circle-stop':'circle-dashed')}</span><div><button type="button" class="yp-task-title" data-task="${t.id}">${esc(t.title)}</button><div class="yp-task-meta"><span>${esc(t.summary)}</span></div></div><div>${statusTag(t)}</div></div>`).join('')||'<div class="yp-empty"><h3>还没有任务</h3><p>把接下来想完成的事情交给三部门。</p><button class="yp-btn primary" type="button" data-action="new-task">新建任务</button></div>'}</div>`}
function deptCards(){const p=current();return `<div class="yp-depts">${Object.entries(roles).map(([key,r])=>`<article class="yp-dept"><div class="yp-row yp-between"><h3 class="yp-row">${icon(r.icon)}${r.name}</h3>${tag(p.sourceReady?'已建档':'逐步形成',p.sourceReady?'':'green')}</div><p>${r.text}</p><div class="yp-small">${p.sourceReady?{product:'功能与范围 · 需求来源',engineering:'结构与实现 · 当前版本',quality:'检查依据 · 验证缺口'}[key]:'依据首轮工作持续补充'}</div><button class="yp-link" type="button" data-basis="${key}">查看工作依据 ${icon('arrow-up-right')}</button></article>`).join('')}</div>`}
function home(){const p=current();return `${projectHeading()}${p.question&&!p.answer?`<section class="yp-section yp-notice">${icon('circle-help')}<div class="yp-notice-copy"><strong>有一项取舍需要你决定</strong><p>${esc(p.question)}</p><button class="yp-link" type="button" data-action="decision">查看问题与建议 ${icon('arrow-right')}</button></div>${tag('产品','amber')}</section>`:''}<section class="yp-summary"><div><div class="yp-small">当前工作重点</div><p>${esc(p.tasks.find(t=>t.status==='running'||t.status==='waiting')?.title||'准备下一项工作')}</p><div class="yp-row" style="margin-top:9px">${p.answer?tag('取舍已记录','green'):tag(p.kind==='existing'?'已有项目资料':'初始想法')}<button class="yp-link" type="button" data-page="sources">查看依据 ${icon('arrow-up-right')}</button></div></div><div class="yp-summary-side"><div class="yp-small">当前采用成果</div><p>${esc(p.baseline)}</p><div class="yp-row" style="margin-top:9px">${tag(p.baseline==='尚无交付'?'等待首轮交付':'包含历史验证记录')}<button class="yp-link" type="button" data-action="delivery">查看成果 ${icon('arrow-up-right')}</button></div></div></section><section class="yp-section"><div class="yp-section-title"><h2>接下来，想完成什么？</h2></div>${compose('project-'+p.id,'新任务目标','描述一个新功能、需要修复的问题，或想调整的方向…')}</section><section class="yp-section"><div class="yp-section-title"><h2>近期任务</h2><button class="yp-link" type="button" data-page="tasks">全部 ${p.tasks.length} 项 ${icon('arrow-right')}</button></div>${taskRows(p.tasks.slice(0,3))}</section><section class="yp-section"><div class="yp-section-title"><h2>三部门工作依据</h2><span class="yp-small">随项目演化持续更新</span></div>${deptCards()}</section>`}
function tasksPage(){const p=current();return `${projectHeading()}<section class="yp-section"><div class="yp-section-title"><h2>项目任务</h2><button class="yp-btn primary" type="button" data-action="new-task">${icon('plus')}新任务</button></div><div class="yp-list-tools">${[['all','全部'],['active','进行中'],['done','已完成']].map(([v,l])=>`<button class="yp-pill ${state.filter===v?'is-selected':''}" data-filter="${v}" type="button">${l}</button>`).join('')}</div>${taskRows(p.tasks.filter(t=>state.filter==='all'||state.filter==='done'&&t.status==='done'||state.filter==='active'&&['running','waiting','queued'].includes(t.status)))}</section>`}
function reportFacts(p,dept){if(!p.sourceReady)return `<div class="yp-detail"><h3>${roles[dept].name}依据正在形成</h3><p>${dept==='product'?p.goal:dept==='engineering'?'首轮方案将在需求范围明确后形成。':'验收依据随首轮目标形成，目前没有验证结果。'}</p><p class="yp-small">来源：初始想法 · 用户原文</p></div>`;
 const facts={product:[['资料支持','已有需求说明与功能清单','来源：'+p.material],['待核对','资料描述的功能，需要与当前实现逐项对应','来源：项目资料 · 尚未完整核对'],['有冲突',p.id==='cargo'?'数量与体积的优先关系在现有材料中不明确':'旧版说明与当前计划可能存在差异，示例待核对','处理：影响本次工作时提出具体问题']],engineering:[['资料支持','已关联项目位置和工程资料','来源：'+p.path],['推断','模块职责可依据工程结构形成初步说明','示例推断 · 需要对应到实际代码'],['待验证','运行方式、依赖和未提交修改仍需核对','未执行构建或修改工作目录']],quality:[['资料支持','现有测试与历史验收材料列入检查依据','来源：已有资料 · 历史证据'],['待验证','历史通过记录不代表当前版本通过','应核对受测版本、检查范围与执行结果'],['待验证','没有测试覆盖的能力保留为验证缺口','不因建档完成而显示为验证通过']]};
 return facts[dept].map(([s,t,n])=>`<div class="yp-fact">${tag(s,s==='有冲突'?'amber':s==='资料支持'?'green':'')}<div>${esc(t)}<small>${esc(n)}</small></div></div>`).join('')}
function sourcesPage(){const p=current();return `${projectHeading()}<section class="yp-section"><div class="yp-section-title"><h2>资料与工作依据</h2><button class="yp-btn" type="button" data-action="add-source">${icon('plus')}添加资料</button></div><p class="yp-small">资料记录保留来源；推断与验证结果分别呈现。</p><div class="yp-source-row">${icon('folder-code')}<div><strong>项目工作位置</strong><small>${esc(p.path)}</small></div>${tag('已登记')}</div><div class="yp-source-row">${icon('files')}<div><strong>${esc(p.material||'尚无补充资料')}</strong><small>项目建立时提供的资料</small></div>${tag('来源')}</div>${p.notes.map(n=>`<div class="yp-source-row">${icon('file-text')}<div><strong>${esc(n.name)}</strong><small>${esc(n.text)}</small></div>${tag('补充资料')}</div>`).join('')}</section><section class="yp-section"><div class="yp-section-title"><h2>三部门当前依据</h2></div><div class="yp-list-tools">${Object.entries(roles).map(([k,r])=>`<button class="yp-pill ${state.sourceTab===k?'is-selected':''}" data-source-tab="${k}" type="button">${r.name}</button>`).join('')}</div><div class="yp-report">${reportFacts(p,roles[state.sourceTab]?state.sourceTab:'product')}</div></section>${p.answer?`<section class="yp-section"><h2>重要决定</h2><div class="yp-detail"><h3>${esc(p.answer)}</h3><p>来源：你对项目取舍的回答 · 已用于当前任务</p></div></section>`:''}`}
function settingsPage(){const p=current();return `${projectHeading()}<section class="yp-section" style="max-width:620px"><h2>项目设置</h2><form class="yp-form" data-form="settings" style="margin-top:19px"><label class="yp-field">项目名称<input name="name" value="${esc(p.name)}" required maxlength="60"></label><label class="yp-field">项目目标<textarea name="goal" required>${esc(p.goal)}</textarea></label><label class="yp-field">项目工作位置<input name="path" value="${p.path==='尚未关联目录'?'':esc(p.path)}" placeholder="可选，例如 C:/project/my-project"><small>关联位置是项目来源；变更工作副本在正式执行时确定。</small></label><div class="yp-form-actions"><span class="yp-small">此处修改仅作用于当前原型</span><button class="yp-btn primary" type="submit">保存设置</button></div></form><div class="yp-detail" style="margin-top:20px"><h3>默认工作方式</h3><p>三部门自动推进，遇到关键问题再询问，完成后供你检查。</p></div><div class="yp-detail"><h3>部门与模型</h3><p>沿用产品、工程、质检三个部门。Provider 配置与模型选择将在后续原型中补充。</p></div></section>`}
function archivesPage(){return `<header class="yp-heading"><div><div class="yp-eyebrow">项目管理</div><h1>已归档项目</h1><p class="yp-subtitle">暂时收起的项目，随时可以恢复到项目列表。</p></div><button class="yp-btn" type="button" data-action="new-project">${icon('plus')}建立项目</button></header><section class="yp-section">${projects.filter(p=>p.archived).map(p=>`<div class="yp-source-row">${icon('archive')}<div><strong>${esc(p.name)}</strong><small>${esc(p.goal)}</small></div><button class="yp-btn" type="button" data-restore="${p.id}">恢复项目</button></div>`).join('')||'<div class="yp-empty"><h3>没有已归档项目</h3><p>归档会保留项目的资料和历史。</p></div>'}</section>`}
function wizardPage(){const w=state.wizard;const stage=w.step;return `<div class="yp-wizard"><button class="yp-link" type="button" data-action="leave-wizard">${icon('arrow-left')}返回项目</button><div style="margin-top:22px"><div class="yp-eyebrow">建立一个持续演化的项目</div><h1>${stage==='choice'?'从哪里开始？':w.kind==='idea'?'从一个想法开始':'接入已有项目'}</h1><p class="yp-subtitle">${stage==='choice'?'两种起点，同一套项目工作台。':w.kind==='idea'?'描述你想解决的问题，三部门会逐步形成需求、方案和成果。':'先建立产品、工程与质检依据，再基于现状继续工作。'}</p></div>${stage==='choice'?`<div class="yp-choices"><button class="yp-choice" type="button" data-kind="idea">${icon('lightbulb')}<strong>从想法新建</strong><p>有一个新想法，或准备从零开发。无需提前准备完整需求。</p></button><button class="yp-choice" type="button" data-kind="existing">${icon('folder-input')}<strong>接入已有项目</strong><p>已有代码或部分资料，先让三部门理解项目现状。</p></button></div><p class="yp-small" style="margin-top:20px">项目会持续保留目标、成果和重要决定。</p>`:stage==='form'?wizardForm(w):wizardReport(w)}</div>`}
function wizardForm(w){return `<div class="yp-steps"><span class="yp-step-current">01 · 项目信息</span><span class="yp-step-line"></span><span>02 · ${w.kind==='idea'?'进入首轮工作':'三部门建档'}</span></div><form class="yp-form" data-form="wizard"><label class="yp-field">项目名称<input name="name" required maxlength="60" value="${esc(w.name)}" placeholder="给项目起一个容易找到的名字"></label>${w.kind==='idea'?`<label class="yp-field">你想做什么？<textarea name="goal" required placeholder="希望谁在什么场景下，解决什么问题？">${esc(w.goal)}</textarea></label><label class="yp-field">重要约束与参考资料 <span class="yp-small">选填</span><textarea name="material" placeholder="例如必须离线使用、已有设计稿，或暂时不做的事情">${esc(w.material)}</textarea></label><label class="yp-field">工作目录 <span class="yp-small">选填</span><input name="path" value="${esc(w.path)}" placeholder="可以在开发前再关联目录"></label>`:`<label class="yp-field">项目目录或资料位置<input name="path" value="${esc(w.path)}" placeholder="例如 C:/project/my-project"><small>可以先从代码、文档或部分资料开始，不要求齐全。</small></label><label class="yp-field">已有资料<textarea name="material" placeholder="列出需求说明、代码、测试、设计记录等；可填写资料位置">${esc(w.material)}</textarea></label><label class="yp-field">接下来希望做什么？ <span class="yp-small">选填</span><textarea name="goal" placeholder="可以先了解项目，也可以指定准备继续开发的内容">${esc(w.goal)}</textarea></label><div class="yp-notice">${icon('info')}<div class="yp-notice-copy"><strong>本次体验使用建档示例</strong><p>填写的位置只用于演示，不会读取本地目录；建档结果不是对该项目的实际分析。</p></div></div>`}<p class="yp-error" role="alert" id="yp-wizard-error" hidden></p><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="wizard-back">上一步</button><button class="yp-btn primary" type="submit">${w.kind==='idea'?'创建项目并开始首轮工作':'查看建档示例'} ${icon('arrow-right')}</button></div></form>`}
function wizardReport(w){const temp={...w,sourceReady:true,id:'preview'};return `<div class="yp-steps"><span>01 · 项目信息</span><span class="yp-step-line"></span><span class="yp-step-current">02 · 三部门建档</span></div><div class="yp-row yp-between"><h2>${esc(w.name)} · 建档预览</h2>${tag('示例数据','amber')}</div><p class="yp-small" style="margin-top:8px">下面演示如何组织已有信息。没有读取目录或执行验证。</p>${Object.entries(roles).map(([k,r])=>`<section class="yp-report"><h3 class="yp-row">${icon(r.icon)}${r.name} · ${r.text}</h3>${reportFacts(temp,k)}</section>`).join('')}<div class="yp-form-actions"><button class="yp-btn" type="button" data-action="wizard-back">调整项目信息</button><button class="yp-btn primary" type="button" data-action="finish-import">建立示例项目 ${icon('arrow-right')}</button></div><p class="yp-small" style="margin-top:10px">建档与实际验证分别记录；可从已有可靠依据开始局部工作。</p>`}
function taskPage(){const p=current(),t=task();if(!t){state.page='home';return home()}const dep=roles[state.taskTab];return `<button class="yp-link" type="button" data-page="home">${icon('arrow-left')}回到项目</button><header class="yp-heading" style="margin-top:18px"><div><div class="yp-eyebrow">${esc(p.name)} · 任务</div><h1>${esc(t.title)}</h1><p class="yp-subtitle">${esc(t.summary)}</p></div>${statusTag(t)}</header><nav class="yp-tabs" aria-label="任务工作区">${[['overview','总览'],['product','产品'],['engineering','工程'],['quality','质检'],['observation','观测']].map(([k,l])=>`<button class="yp-tab ${state.taskTab===k?'is-selected':''}" type="button" data-task-tab="${k}" ${state.taskTab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>${dep?departmentView(t,dep):state.taskTab==='observation'?observationView(t):taskOverview(t)}`}
function taskOverview(t){const p=current();return `${t.status==='waiting'?`<section class="yp-section yp-notice">${icon('circle-help')}<div><strong>${esc(p.question||'产品需要你补充一个重要取舍')}</strong><p>取舍会影响后续方案的比较方式。推荐分别呈现数量与体积指标。</p><button class="yp-link" type="button" data-action="decision">回答问题 ${icon('arrow-right')}</button></div></section>`:''}<section class="yp-section"><div class="yp-section-title"><h2>三部门协作</h2><span class="yp-small">需求 → 实现 → 验收</span></div><div class="yp-depts">${Object.entries(roles).map(([k,r])=>`<article class="yp-dept"><div class="yp-row yp-between"><h3>${r.name}</h3>${tag(t.status==='done'?'已完成':k==='product'?'当前工作':'等待交接',t.status!=='done'&&k==='product'?'green':'')}</div><p>${r.text}</p><button class="yp-link" type="button" data-task-tab="${k}">进入工作区 ${icon('arrow-up-right')}</button></article>`).join('')}</div></section><section class="yp-section"><div class="yp-section-title"><h2>${t.status==='done'?'本次交付':'当前进展'}</h2><button class="yp-link" type="button" data-action="delivery">查看成果与依据</button></div><div class="yp-detail"><h3>${t.status==='done'?'工作结果已记录':t.status==='stopped'?'任务已停止，过程记录保留':'正在使用当前项目依据推进'}</h3><p>${esc(t.summary)}</p><p class="yp-small">基于：${esc(p.baseline)} · ${esc(p.material)}</p></div></section>${t.messages.filter(m=>m.scope==='global').map(m=>`<div class="yp-detail"><h3>你追加的要求 ${tag('已接收','green')}</h3><p>${esc(m.text)}</p></div>`).join('')}<section class="yp-section">${['done','stopped'].includes(t.status)?`<div class="yp-notice">${icon('git-branch')}<div><strong>在同一项目中继续演化</strong><p>后续修改建立新任务，关联本次成果和项目依据。</p><button class="yp-link" type="button" data-action="new-task">基于当前项目开始新任务 ${icon('arrow-right')}</button></div></div>`:`${compose('task-'+t.id,'追加整体要求','补充本次任务的目标、优先级或约束…','task-input')}<div style="margin-top:10px;text-align:right"><button class="yp-link" type="button" data-action="stop-task">停止本次任务</button></div>`}</section>`}
function departmentView(t,r){const k=state.taskTab,p=current();const messages=t.messages.filter(m=>m.scope===k);return `<div class="yp-work"><section><div class="yp-section-title"><h2>工作消息</h2><span class="yp-small">${r.name} · 本次任务</span></div><div class="yp-timeline"><article class="yp-message"><div class="yp-row yp-between"><strong>${r.name}</strong><span class="yp-small">项目依据已载入 · 示例</span></div><p>${k==='product'?`本次目标：${t.title}。先核对已有要求与本次变化，重要取舍会向你提出。`:k==='engineering'?`从「${p.baseline}」开始，依据产品明确的范围形成方案并实施，保留已有有效行为。`:'依据当前要求检查本次交付，并区分历史证据与本次实际验证。'}</p></article>${messages.map(m=>`<article class="yp-message user"><div class="yp-row yp-between"><strong>你 · 定向指导</strong>${tag('已接收','green')}</div><p>${esc(m.text)}</p><p class="yp-small">等待${r.name}处理；不会转成其他部门的私有对话。</p></article>`).join('')}</div>${['done','stopped'].includes(t.status)?'<p class="yp-small">本次任务已结束，指导记录保留。</p>':`<form class="yp-composer" data-form="guidance"><div class="yp-small" style="margin-bottom:8px">接收方 · ${r.name}</div><textarea data-draft="guidance-${t.id}-${k}" aria-label="发给${r.name}的指导" placeholder="给当前部门追加说明或指导…" required>${esc(state.drafts['guidance-'+t.id+'-'+k]||'')}</textarea><div class="yp-composer-footer"><span class="yp-small">保留原文与处理状态</span><button class="yp-btn primary" type="submit">发送指导 ${icon('send')}</button></div></form>`}</section><aside class="yp-inspector" aria-label="部门检查区"><h3>本次工作依据</h3><div class="yp-tabs">${[['context','Context'],['provider','Provider'],['prompt','Prompt']].map(([v,l])=>`<button class="yp-tab ${state.inspect===v?'is-selected':''}" type="button" data-inspect="${v}">${l}</button>`).join('')}</div>${state.inspect==='context'?`<p>当前项目目标、已采用成果及本次任务。</p><details open><summary>项目目标</summary><p>${esc(p.goal)}</p></details><details><summary>本次任务</summary><p>${esc(t.title)}</p></details><details><summary>采用成果</summary><p>${esc(p.baseline)}</p></details><button class="yp-link" type="button" data-page="sources" style="margin-top:18px">查看项目资料 ${icon('arrow-up-right')}</button>`:state.inspect==='provider'?'<p>当前为交互示例，没有实际模型请求。</p><p>正式运行时显示本次采用的 Provider 和模型。配置管理将在后续原型中补充。</p>':`<p>${r.name}负责${r.text}。使用当前任务依据，遇到影响目标的重要取舍时提出问题。</p><p>示例部门规则 · 未连接真实 Prompt</p>`}</aside></div>`}
function observationView(t){return `<section class="yp-section"><div class="yp-section-title"><h2>任务观测</h2>${tag('示例范围')}</div><div class="yp-empty">${icon('activity')}<h3 style="margin-top:10px">本次原型没有发起模型请求</h3><p>正式运行的请求记录、原始数据与用量都归属当前任务。</p><button class="yp-btn" type="button" data-action="sample-request">查看请求详情样式</button></div></section>`}
function render(){root.querySelector('.yp-shell').classList.toggle('show-nav',state.nav);renderSide();header();content.innerHTML=state.page==='wizard'?wizardPage():state.page==='archives'?archivesPage():!current()?archivesPage():state.page==='tasks'?tasksPage():state.page==='sources'?sourcesPage():state.page==='settings'?settingsPage():state.page==='task'?taskPage():home();initIcons()}
function goProject(id){state.projectId=id;state.page='home';state.taskId=null;state.taskTab='overview';state.menu=false;state.nav=false;render()}
function openTask(id){state.taskId=id;state.page='task';state.taskTab='overview';state.menu=false;state.nav=false;render()}
function beginWizard(){state.returnPage=state.page;state.page='wizard';state.taskId=null;state.menu=false;state.nav=false;state.wizard={step:'choice',kind:null,name:'',goal:'',path:'',material:''};render()}
function newTask(){state.page='home';state.taskId=null;state.menu=false;state.nav=false;render();content.querySelector('textarea')?.focus()}
function createProject(w){const id='project-'+(++seq),idea=w.kind==='idea';const p={id,name:w.name,kind:w.kind,pinned:false,archived:false,goal:w.goal||(idea?'逐步明确首轮目标':'依据现有项目资料继续演化'),path:w.path||'尚未关联目录',material:w.material||'用户原始想法',status:idea?'从想法开始':'已建档 · 示例',baseline:idea?'尚无交付':'导入起点 · 待验证',sourceReady:!idea,question:'',answer:'',tasks:[{id:id+'-1',title:idea?'形成首轮需求与方案':'建立项目现状与三部门依据',status:idea?'running':'done',summary:idea?'产品开始明确目标与最小范围。':'建档示例已保存，验证状态与实际成果分别记录。',messages:[]}],notes:[]};projects.push(p);state.wizard=null;goProject(id);toast(idea?'示例项目已创建，首轮工作已开始':'示例项目已建立，可以开始下一项任务')}
function showModal(kind){state.menu=false;modalReturn=document.activeElement;state.modal=kind;const p=current();let title='',body='';if(kind==='rename'){title='重命名项目';body=`<form class="yp-form" data-form="rename"><label class="yp-field">项目名称<input name="name" value="${esc(p.name)}" required maxlength="60"></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">取消</button><button class="yp-btn primary" type="submit">保存名称</button></div></form>`}else if(kind==='archive'){title='归档这个项目';body=`<p>「${esc(p.name)}」会从日常列表收起，资料和任务记录保留。你可以在“已归档项目”中恢复。</p><p>归档只整理列表；正在进行的任务不会因此停止。</p><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">保留在列表</button><button class="yp-btn primary" type="button" data-action="confirm-archive">归档项目</button></div>`}else if(kind==='decision'){title='需要你决定';body=`<p>${esc(p.question||'请补充本次任务的重要取舍')}</p><div class="yp-report"><h3>产品建议</h3><p>数量和体积分别呈现。先比较两个方向的方案，避免把不同目标合成一个分数。</p></div><form class="yp-form" data-form="decision"><label class="yp-field">你的决定<textarea name="answer" required>数量和体积分别展示，先提供两种方案供比较。</textarea></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">稍后处理</button><button class="yp-btn primary" type="submit">回复并继续</button></div></form>`}else if(kind==='add-source'){title='添加项目资料';body=`<form class="yp-form" data-form="source"><label class="yp-field">资料名称<input name="name" required placeholder="例如：新版需求说明"></label><label class="yp-field">位置或内容说明<textarea name="text" required placeholder="填写来源、文件位置或需要补充的内容"></textarea><small>本原型只登记说明，不读取或上传文件。</small></label><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">取消</button><button class="yp-btn primary" type="submit">添加资料</button></div></form>`}else if(kind==='delivery'){title='当前成果与检查';body=`<div class="yp-detail"><h3>${esc(p.baseline)}</h3><p>${p.baseline==='尚无交付'?'首轮工作尚未形成交付。':p.id==='cargo'?'示例交付包含装载工作台、手动摆放与方案保存。':'已登记项目起点或历史成果，尚需核对实际内容。'}</p></div><div class="yp-detail"><h3>验证情况</h3><p>${p.id==='cargo'?'历史检查覆盖了手动摆放与保存恢复；混装方案的新目标尚未验证。':'没有本次实际验证结果。'}</p></div><div class="yp-detail"><h3>成果归属</h3><p>项目采用成果与本次任务关联。外部仓库整合和发布另有实际结果。</p></div><div class="yp-form-actions"><button class="yp-btn" type="button" data-action="close-modal">关闭</button><button class="yp-btn primary" type="button" data-action="continue-project">继续开发</button></div>`}else if(kind==='sample-request'){title='模型请求详情 · 样式示例';body='<p>任务、部门、工作轮次与每次尝试可相互关联。</p><div class="yp-code">Provider：未连接\n请求模型：未配置\n实际返回模型：未知\n输入 Token：未上报\n输出 Token：未上报</div><details style="margin-top:17px"><summary>Raw Request 示例</summary><pre class="yp-code">{\n  "source": "prototype",\n  "request_sent": false\n}</pre></details><div class="yp-form-actions"><span class="yp-small">样式演示，不代表实际调用</span><button class="yp-btn" type="button" data-action="close-modal">关闭</button></div>'}overlay.innerHTML=`<section class="yp-modal" role="dialog" aria-modal="true" aria-labelledby="yp-modal-title"><div class="yp-row yp-between"><h2 id="yp-modal-title">${title}</h2><button class="yp-icon" type="button" data-action="close-modal" aria-label="关闭对话框">${icon('x')}</button></div>${body}</section>`;overlay.hidden=false;root.querySelector('.yp-shell').inert=true;initIcons();overlay.querySelector('input,textarea,button')?.focus()}
function closeModal(){overlay.hidden=true;overlay.innerHTML='';root.querySelector('.yp-shell').inert=false;state.modal=null;if(modalReturn?.isConnected)modalReturn.focus()}
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
 if(el.dataset.project){goProject(el.dataset.project);return}if(el.dataset.task){openTask(el.dataset.task);return}if(el.dataset.page){state.page=el.dataset.page;state.taskId=null;state.menu=false;state.nav=false;if(state.page==='sources')state.sourceTab='product';render();return}if(el.dataset.taskTab){state.taskTab=el.dataset.taskTab;state.inspect='context';render();return}if(el.dataset.inspect){state.inspect=el.dataset.inspect;render();return}if(el.dataset.filter){state.filter=el.dataset.filter;render();return}if(el.dataset.sourceTab){state.sourceTab=el.dataset.sourceTab;render();return}if(el.dataset.basis){state.page='sources';state.sourceTab=el.dataset.basis;render();return}if(el.dataset.kind){state.wizard.kind=el.dataset.kind;state.wizard.step='form';render();return}if(el.dataset.restore){const p=projects.find(p=>p.id===el.dataset.restore);p.archived=false;goProject(p.id);toast('项目已恢复');return}
 const a=el.dataset.action;if(!a)return;if(a==='new-project'){beginWizard()}else if(a==='nav'){state.nav=!state.nav;render()}else if(a==='home'){state.page=current()?'home':'archives';state.taskId=null;render()}else if(a==='new-task'){newTask()}else if(a==='menu'){state.menu=!state.menu;render()}else if(a==='pin'){const p=current();p.pinned=!p.pinned;render();toast(p.pinned?'项目已置顶':'已取消置顶')}else if(['rename','archive','decision','add-source','delivery','sample-request'].includes(a)){showModal(a)}else if(a==='close-modal'){closeModal()}else if(a==='confirm-archive'){const p=current();p.archived=true;closeModal();state.projectId=projects.find(p=>!p.archived)?.id||null;state.taskId=null;state.page='archives';render();toast('项目已归档，可随时恢复')}else if(a==='continue-project'){closeModal();newTask()}else if(a==='leave-wizard'){state.page=current()?'home':'archives';state.wizard=null;render()}else if(a==='wizard-back'){const w=state.wizard;if(w.step==='form'){const f=content.querySelector('form');if(f){const data=new FormData(f);for(const k of ['name','goal','path','material'])w[k]=String(data.get(k)||'')}w.step='choice'}else w.step='form';render()}else if(a==='finish-import'){createProject(state.wizard)}else if(a==='stop-task'){task().status='stopped';task().summary='用户停止了本次任务，已有工作和输入记录保留。';render();toast('本次示例任务已停止')}
});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.query=e.target.value;const pos=e.target.selectionStart;renderSide();initIcons();const field=side.querySelector('[data-search]');field.focus();field.setSelectionRange(pos,pos)}if(e.target.dataset.draft)state.drafts[e.target.dataset.draft]=e.target.value});
root.addEventListener('submit',e=>{const form=e.target.closest('form');if(!form)return;e.preventDefault();if(!form.reportValidity())return;const data=new FormData(form),kind=form.dataset.form,p=current();
 if(kind==='wizard'){const w=state.wizard;for(const k of ['name','goal','path','material'])w[k]=String(data.get(k)||'').trim();if(!w.name||w.kind==='idea'&&!w.goal){toast('请填写项目名称与想法');return}if(w.kind==='existing'&&!w.path&&!w.material){const err=content.querySelector('#yp-wizard-error');err.hidden=false;err.textContent='请至少提供一个项目位置或资料说明。';return}if(w.kind==='idea'){createProject(w)}else{w.step='report';render()}}
 else if(kind==='create-task'){const key='project-'+p.id,text=(state.drafts[key]||'').trim();if(!text){toast('请描述这次想完成的事情');return}const t={id:'task-'+(++seq),title:text.length>40?text.slice(0,40)+'…':text,status:'running',summary:'产品正在结合项目现状明确本次目标。',messages:[{scope:'global',text}]};p.tasks.unshift(t);state.drafts[key]='';openTask(t.id);toast('新任务已建立，示例流程开始')}
 else if(kind==='task-input'){const t=task(),key='task-'+t.id,text=(state.drafts[key]||'').trim();if(!text)return;t.messages.push({scope:'global',text});state.drafts[key]='';render();toast('要求已接收，等待产品处理')}
 else if(kind==='guidance'){const t=task(),key='guidance-'+t.id+'-'+state.taskTab,text=(state.drafts[key]||'').trim();if(!text)return;t.messages.push({scope:state.taskTab,text});state.drafts[key]='';render();toast('指导已接收，等待目标部门处理')}
 else if(kind==='settings'){const name=String(data.get('name')||'').trim(),goal=String(data.get('goal')||'').trim();if(!name||!goal){toast('项目名称和目标不能为空');return}p.name=name;p.goal=goal;p.path=String(data.get('path')||'').trim()||'尚未关联目录';render();toast('项目设置已更新')}
 else if(kind==='rename'){const name=String(data.get('name')||'').trim();if(!name)return;p.name=name;closeModal();render();toast('项目名称已更新')}
 else if(kind==='decision'){const answer=String(data.get('answer')||'').trim();if(!answer)return;p.answer=answer;const t=p.tasks.find(t=>t.status==='waiting');if(t){t.status='running';t.summary='已收到你的取舍，产品继续整理需求。';t.messages.push({scope:'global',text:answer})}closeModal();render();toast('决定已记录，示例任务继续推进')}
 else if(kind==='source'){const name=String(data.get('name')||'').trim(),text=String(data.get('text')||'').trim();if(!name||!text)return;p.notes.push({name,text});closeModal();render();toast('资料说明已添加')}
});
root.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const els=[...overlay.querySelectorAll('button,input,textarea,select,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--yp-sidebar-width',design.sidebarWidth+'px');root.querySelector('.yp-shell').style.gridTemplateColumns=window.innerWidth>740?`${design.sidebarWidth}px minmax(0,1fr)`:'';content.style.paddingTop=(29*design.density)+'px'}});tweak.addSlider(design,'sidebarWidth',{label:'项目导航宽度',min:180,max:250,step:10,unit:'px'});tweak.addSlider(design,'density',{label:'页面留白',min:.8,max:1.2,step:.1})}
})();
