[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yudao-harness"
version = "0.1.0"
description = "Yudao Loop System: a native product/engineering/quality model loop"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.26,<3", "httpx>=0.23,<1", "anthropic>=1.7,<2", "pydantic>=2.7,<3",
    "fastapi>=0.141,<1", "uvicorn>=0.54,<1", "filelock>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.8", "import-linter>=2.15,<3"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["web/static/*", "definitions/*.json"]

# 分层的依赖规则（应用层与接口层设计说明第 2.4 节），由 harness/tests/test_layers.py 检查
[tool.importlinter]
root_package = "harness"

[[tool.importlinter.contracts]]
name = "接口层只导入应用层"
type = "forbidden"
source_modules = ["harness.api"]
forbidden_modules = ["harness.*"]
ignore_imports = ["harness.api.** -> harness.app.**"]

[[tool.importlinter.contracts]]
name = "控制核心不导入应用层与接口层，应用层不导入接口层"
type = "protected"
protected_modules = ["harness.app", "harness.api"]
allowed_importers = ["harness.api", "harness.__main__", "harness.tests"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["."]
addopts = "-q"
