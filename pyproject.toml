[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yudao-harness"
version = "0.1.0"
description = "Yudao Loop System: a native product/engineering/quality model loop"
requires-python = ">=3.11"
dependencies = ["openai>=2.26,<3", "httpx>=0.23,<1", "anthropic>=1.7,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["web/static/*", "definitions/*.json"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["."]
addopts = "-q"
