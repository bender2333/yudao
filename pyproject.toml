[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yudao-harness"
version = "0.2.0"
description = "Yudao Loop System: a native product/engineering/quality model loop"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.26,<3", "httpx>=0.23,<1", "anthropic>=1.7,<2", "httpx2>=2,<3", "pydantic>=2.11,<3",
    "fastapi>=0.141,<1", "uvicorn>=0.54,<1", "filelock>=4,<5", "truststore>=0.10,<1", "pygit2>=1.20,<2",
    # MCP 客户端（网络与 MCP 设计说明第 7.1 节，工单 #69）：官方 SDK，以及按进程标识结束遗留进程用的 psutil
    "mcp>=2.2,<3", "psutil>=7,<8",
    # HTML 转文本（网络与 MCP 设计说明第 6.4、17 节，工单 #68）：取回时保留标题、列表、链接与表格的成熟库
    "html-to-markdown>=1,<2",
]

# 安装成 yudao 命令（桌面客户端的安装、更新与发布设计说明第 4.1 节）
[project.scripts]
yudao = "harness.__main__:main"

# uv sync 默认安装 dev 组，测试在按锁文件安装的项目环境中运行
[dependency-groups]
# PyYAML 供测试读取 YAML 固件，也供发布脚本 scripts/release.py 读取 latest.yml；
# cryptography 供 scripts/github-app/ 用私钥签 GitHub App 的 JWT（工单 #513），
# trustme 已经带着同一个包，这里显式声明，不依赖传递依赖；
# distlib 供 scripts/github-app/make_entries.py 生成 gh.exe 与 git.exe 两个入口（工单 #526）；
# playwright 供场景 1 评测的界面智能体操作浏览器（工单 #191）
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "import-linter>=2.15,<3",
    "trustme>=1.2,<2",
    "pyyaml>=6,<7",
    "pytest-timeout>=2.4.0",
    "pyflakes>=3.3,<5",
    "cryptography>=42,<51",
    "distlib>=0.4,<1",
    "playwright>=1.40,<2",
]

[tool.setuptools.packages.find]
include = ["harness*"]

# 发布资源目录：被 git 忽略，发布脚本把页面文件与执行代理的 wheel 放进去，
# 随 wheel 一起发布（设计说明第 5.1、6.1 节）；从源码运行没有这个目录
[tool.setuptools.package-data]
harness = ["definitions/*.json", "release_assets/*", "release_assets/**/*"]

# 分层的依赖规则（应用层与接口层设计说明第 2.4 节），由 harness/tests/test_layers.py 检查
[tool.importlinter]
root_package = "harness"
# 工单 #69：MCP 客户端模块不导入 Yudao 的其他模块（网络与 MCP 设计说明第 7.1 节；执行环境服务设计说明第 5 节）。
# 阶段四搬进执行代码包时只改导入路径
[[tool.importlinter.contracts]]
name = "MCP 客户端模块不导入 Yudao 的其他模块"
type = "forbidden"
source_modules = ["harness.mcp_client"]
forbidden_modules = ["harness.*"]

[[tool.importlinter.contracts]]
name = "接口层只导入应用层"
type = "forbidden"
source_modules = ["harness.api"]
forbidden_modules = ["harness.*"]
ignore_imports = ["harness.api.** -> harness.app.**"]

[[tool.importlinter.contracts]]
name = "控制核心不导入应用层与接口层，应用层不导入接口层"
type = "protected"
protected_modules = ["harness.app", "harness.api"]
allowed_importers = ["harness.api", "harness.__main__", "harness.demo", "harness.smoke", "harness.tests"]

# S6a（工单 #829）：契约的导入方向。契约模块（路由、装配、执行与收紧检查的契约，加共用的版本核对）
# 只导入内核与标准库（骨架与应用设计说明第 3.2、5 节；总图第二节第二环「契约」），
# 每一行放行都对应一个内核模块或契约圈里的一个模块，多出来的导入由这条合同报出
[[tool.importlinter.contracts]]
name = "契约模块只导入内核与标准库"
type = "forbidden"
source_modules = [
  "harness.routing_contract",
  "harness.assembly_contract",
  "harness.execution_contract",
  "harness.tightening_contract",
  "harness.contract_versions",
]
forbidden_modules = ["harness.*"]
ignore_imports = [
  # 内核模块（kernel-manifest.json 里 kind 为 module 的路径）：契约里出现的应用侧类型按 Any 标注，
  # 具体类型由实现给出；契约用到的只有事件信封、定义、写入口与裁决的合同
  "harness.* -> harness.kernel_events",
  "harness.* -> harness.adjudication",
  "harness.* -> harness.write_path",
  "harness.* -> harness.definitions",
  # 契约圈自己：这几份模块属于同一环，彼此可以互相导入
  "harness.* -> harness.contract_versions",
  "harness.* -> harness.routing_contract",
  "harness.* -> harness.assembly_contract",
  "harness.* -> harness.execution_contract",
  "harness.* -> harness.tightening_contract",
]

# S6a（工单 #829，与 #620 合并处理）：应用层只导入控制核心的公开接口（应用层与接口层设计说明第 2.4 节）。
# 下面是放出这一版时的公开接口模块清单，按第 2.4 节的几类分组；清单以外多一行导入，这条合同失败并报出
# 是哪一个导入。归不进第 2.4 节那八类、由执行者定作公开接口的几组注明「补」，
# 清单与登记见交付说明与 docs/architecture-issues.md（由架构师事后写进设计说明）
[[tool.importlinter.contracts]]
name = "应用层只导入控制核心的公开接口"
type = "forbidden"
source_modules = ["harness.app"]
forbidden_modules = ["harness.*"]
# 只查直接导入：公开接口模块自己再往下导入内核的哪几块，是那一份模块的事
#（`harness.runtime` 导入薄驱动、`harness.projects` 导入工件与 Git 版本都在这一层之外）
allow_indirect_imports = true
ignore_imports = [
  # 流程编排的入口：组装处（LoopSystem）与继续一个 run 时的恢复
  "harness.app.** -> harness.runtime",
  "harness.app.** -> harness.recovery",
  # 写入口
  "harness.app.** -> harness.write_path",
  # 事件日志的读取与订阅：日志、事件信封与骨架事件的种类、流与停止原因的常量
  "harness.app.** -> harness.event_store",
  "harness.app.** -> harness.kernel_events",
  "harness.app.** -> harness.streams",
  # 保存的投影：run 流、项目流与内核的最小投影
  "harness.app.** -> harness.projection",
  "harness.app.** -> harness.project_projection",
  "harness.app.** -> harness.minimal_projection",
  # 输出片段通道
  "harness.app.** -> harness.deltas",
  # 知识层的查询：项目与事项、观察与统计、参数、交互记录
  "harness.app.** -> harness.projects",
  "harness.app.** -> harness.observability",
  "harness.app.** -> harness.parameters",
  "harness.app.** -> harness.interactions",
  # Provider 模块的管理接口：目录、凭据与调用目标的选择
  "harness.app.** -> harness.providers",
  "harness.app.** -> harness.providers.**",
  # 补：定义的加载与结构校验
  "harness.app.** -> harness.definitions",
  # 补：事件种类与界面用的名词声明（S5a 以后由应用自己持有）
  "harness.app.** -> harness.models",
  # 补：工件引用与树的封存
  "harness.app.** -> harness.artifacts",
  "harness.app.** -> harness.tree_archive",
  # 补：网络取回——接口层启动时把服务自己的监听地址交给应用，应用交给取回（网络与 MCP 设计说明第 6.3、18 节）
  "harness.app.** -> harness.fetch",
  # 补：用户决定的读取
  "harness.app.** -> harness.decisions",
  # 补：Git 版本与回写
  "harness.app.** -> harness.git_versions",
  "harness.app.** -> harness.writeback",
  # 补：公开路径规则与工具参数的脱敏
  "harness.app.** -> harness.path_rules",
  "harness.app.** -> harness.redact",
  # 补：重放核对的读取
  "harness.app.** -> harness.replay_check",
  # 补：MCP 服务器探测（工单 #1174）：探测本体在 mcp_probe，命令层只转调
  "harness.app.** -> harness.mcp_probe",
]

# S6a（工单 #829）：应用（应用层、路由实现、装配实现、执行实现）不导入薄驱动的内部
# （骨架与应用设计说明第 5.1、5.2、5.3、6 节；总图第四节「执行」「装配」缝）：这三道缝的实现由组装处
# 经构造参数交给薄驱动，实现要用薄驱动时由薄驱动把自己作为参数交进去。只查直接导入：
# 组装处导入薄驱动是它的职责，反过来不行
[[tool.importlinter.contracts]]
name = "应用不导入薄驱动的内部"
type = "forbidden"
source_modules = [
  "harness.app",
  "harness.watched_outputs",
  "harness.tightening",
  "harness.assembly",
  "harness.engine",
]
forbidden_modules = ["harness.orchestrator"]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["."]
addopts = "-q --tb=line -rfE -p no:warnings"
markers = ["unit: 内存数据与纯规则的测试", "module: 单个模块连同真实依赖的测试", "integration: 完整循环与服务进程的测试", "real_model: 需要真实模型服务的测试，只在明确选择（-m real_model）时运行"]
strict_markers = true
