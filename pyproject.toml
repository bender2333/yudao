[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yudao-harness"
version = "0.1.0"
description = "Yudao Loop System: isolated product/engineering/quality sessions over structured specs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["."]
addopts = "-q"
