[project]
name = "doc-consistency"
version = "0.1.0"
description = "Yudao 文档一致性核对工具：索引与脚手架线检查"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "clingo>=5.7",
    "lark>=1.2",
]

[project.scripts]
doc-consistency = "doc_consistency.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_consistency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
