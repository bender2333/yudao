<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Application</title>
  <style>
    body {
      background-color: lavender;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: indigo;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 16px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 4px;
      background-color: #310055;
    }
    nav a:hover {
      background-color: #5c0099;
    }
    .container {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background-color: white;
      border: 2px solid indigo;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(75, 0, 130, 0.15);
    }
    .card-header {
      background-color: indigo;
      color: white;
      margin: -20px -20px 20px -20px;
      padding: 12px 20px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      font-weight: bold;
      font-size: 18px;
    }
    .btn {
      background-color: indigo;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn:hover {
      background-color: #3b0066;
    }
    .btn-secondary {
      background-color: #4b0082;
      opacity: 0.85;
    }
    .btn-danger {
      background-color: #800040;
    }
    .input-text {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .input-text:focus {
      border-color: indigo;
      outline: none;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      flex-grow: 1;
      max-width: 400px;
    }
    .filters {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      background-color: #d1c4e9;
      color: indigo;
      border: 1px solid indigo;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .filter-btn.active {
      background-color: indigo;
      color: white;
    }
    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      background-color: #faf9fd;
      border-left: 4px solid indigo;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    li.todo-item.completed {
      background-color: #f0f0f5;
      border-left-color: #888;
    }
    li.todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #888;
    }
    .todo-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
    }
    .todo-actions {
      display: flex;
      gap: 8px;
    }
    .about-section {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Indigo Todo App</h1>
    <nav>
      <a href="#tasks" id="nav-tasks" onclick="showSection('tasks')">Tasks</a>
      <a href="#add" id="nav-add" onclick="showSection('add')">Add Task</a>
      <a href="#about" id="nav-about" onclick="showSection('about')">About</a>
    </nav>
  </header>

  <div class="container">
    <div id="add-section" class="card">
      <div class="card-header">Add Task</div>
      <form id="add-form" onsubmit="addTask(event)">
        <input type="text" id="task-input" class="input-text" placeholder="Enter new task description..." required>
        <button type="submit" class="btn" id="add-task-btn">Add Task</button>
      </form>
    </div>

    <div id="tasks-section" class="card">
      <div class="card-header">All Tasks</div>
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="search-input" class="input-text" style="margin-bottom:0" placeholder="Search tasks..." oninput="renderTodos()">
          <button type="button" class="btn" onclick="renderTodos()">Search</button>
        </div>
        <div class="filters">
          <button type="button" class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
          <button type="button" class="filter-btn" id="filter-active" onclick="setFilter('active')">Active</button>
          <button type="button" class="filter-btn" id="filter-completed" onclick="setFilter('completed')">Completed</button>
        </div>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>

    <div id="about-section" class="card about-section">
      <div class="card-header">About Application</div>
      <p>This is an advanced to-do list web application designed with a lavender background and indigo components.</p>
    </div>
  </div>

  <script>
    let todos = [
      { id: 1, text: 'Review project requirements', completed: false },
      { id: 2, text: 'Prepare test plan', completed: true }
    ];
    let nextId = 3;
    let currentFilter = 'all';

    function showSection(section) {
      document.getElementById('tasks-section').style.display = 'block';
      document.getElementById('add-section').style.display = 'block';
      document.getElementById('about-section').style.display = 'none';

      if (section === 'add') {
        document.getElementById('task-input').focus();
      } else if (section === 'about') {
        document.getElementById('about-section').style.display = 'block';
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('filter-' + filter);
      if (activeBtn) activeBtn.classList.add('active');
      renderTodos();
    }

    function addTask(event) {
      if (event) event.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: nextId++, text: text, completed: false });
      input.value = '';
      renderTodos();
    }

    function toggleComplete(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        renderTodos();
      }
    }

    function editTask(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;
      const newText = prompt('Edit task description:', todo.text);
      if (newText !== null && newText.trim() !== '') {
        todo.text = newText.trim();
        renderTodos();
      }
    }

    function deleteTask(id) {
      todos = todos.filter(t => t.id !== id);
      renderTodos();
    }

    function renderTodos() {
      const list = document.getElementById('todo-list');
      const search = (document.getElementById('search-input').value || '').toLowerCase();
      list.innerHTML = '';

      const filtered = todos.filter(t => {
        if (currentFilter === 'active' && t.completed) return false;
        if (currentFilter === 'completed' && !t.completed) return false;
        if (search && !t.text.toLowerCase().includes(search)) return false;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<li style="padding: 16px; color: #666; text-align: center;">No tasks found.</li>';
        return;
      }

      filtered.forEach(t => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (t.completed ? ' completed' : '');

        const content = document.createElement('div');
        content.className = 'todo-content';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = t.completed;
        checkbox.onchange = () => toggleComplete(t.id);

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = t.text;

        content.appendChild(checkbox);
        content.appendChild(span);

        const actions = document.createElement('div');
        actions.className = 'todo-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-secondary';
        editBtn.textContent = 'Edit';
        editBtn.onclick = () => editTask(t.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteTask(t.id);

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(content);
        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    // Handle hash change for navigation
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash) showSection(hash);
    });

    renderTodos();
  </script>
</body>
</html>
