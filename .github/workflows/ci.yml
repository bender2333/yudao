# 每个 PR 与 main 的每次推送都运行，也可以手动触发。合并 main 要求 check 通过（docs/agents/autopilot-runtime.md「main 的规则」）。
# 测试按层与时机运行（docs/design/test-pyramid.md docs/design/test-pyramid.md「各角色运行哪一层」）：
#   合并前（PR、main 的推送与手动触发）：① 单元层、② 模块层、评测工具、客户端、工作台脚本、内核检查六个作业并行，check 汇总六项的结果
#     并在运行摘要里写出各层的表；PR 上另有「用例变化」，列出合并前后各层用例的增减，只显示，不挡合并
#   合并以后（main 的推送与手动触发）：③ 集成层，不挡合并
#   发布之前（架构师手动运行，不在 CI 中）：真实模型冒烟与桌面测试
# 本文件由用户在场时的架构师维护，solo 执行者与架构师循环不修改。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # 只改文档与日记的推送（架构师经常直接推送）不运行；PR 上不跳过，check 是合并必须通过的检查
    paths-ignore:
      - "docs/**"
      - "agents_jour/**"
      - "claude_jour.md"
      - "tools/**"
      - ".doc-index/**"
  workflow_dispatch:

# PR 与手动触发：同一分支的新运行取消旧运行。main 的推送：每个合并提交各自运行到底，
# 失败能对应到一次合并
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ① 单元层
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: uv sync --frozen

      # 包括固定检查 test_layers.py
      - name: 单元层
        run: uv run python -m pytest -m unit --junitxml=.tmp/test-results/unit.xml

      - name: 保存结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: .tmp/test-results/unit.xml
          if-no-files-found: ignore

  module:
    name: ② 模块层
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # test_openapi_snapshot.py 用 openapi-ts 按快照重新生成客户端类型
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harness/tests/openapi/package-lock.json

      - name: git 身份（测试会建仓库并提交）
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        run: |
          uv sync --frozen
          npm ci --prefix harness/tests/openapi

      # 包括固定检查 test_openapi_snapshot.py
      - name: 模块层
        run: uv run python -m pytest -m module --junitxml=.tmp/test-results/module.xml

      - name: 保存结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: module-results
          path: .tmp/test-results/module.xml
          if-no-files-found: ignore

  evals:
    name: 评测工具
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: git 身份（测试会建仓库并提交）
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        run: uv sync --frozen

      # 需要真实模型的用例标 real_model，默认不选（docs/design/test-pyramid.md docs/design/test-pyramid.md「各角色运行哪一层」），CI 上没有模型服务的凭据
      - name: 评测工具
        run: uv run python -m pytest evals/tests --junitxml=.tmp/test-results/evals.xml

      - name: 保存结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: .tmp/test-results/evals.xml
          if-no-files-found: ignore

  client:
    name: 客户端
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        id: install
        run: npm ci --prefix client

      # 安装以后的各项检查互不依赖：前一项失败时后面的照样运行，一次给出全部结果
      # room-screen-switch 等测试用 Playwright 启动 Chromium 挂载页面
      - name: 安装 Chromium
        working-directory: client
        run: npx playwright install chromium

      - name: 客户端单元测试
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: client
        timeout-minutes: 10
        run: node --test --test-force-exit --test-timeout=60000 --test-reporter=spec tests/unit/*.test.js tests/unit/*.test.ts

      - name: 编译页面与 wheel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build:pages --prefix client
          uv build --wheel

      - name: 客户端类型检查
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: client
        run: npm run typecheck

  # 工作台的脚本：solo 循环与架构师循环用的调度脚本（.claude/skills/*/scripts），只有 Node 内置模块，不需要装依赖。
  # 这些脚本决定派哪张工单、谁在做、收账成不成立，判断一旦错整个交付队列都跟着错，所以与产品代码同样进 CI
  workbench:
    name: 工作台脚本
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 单元测试
        run: node --test --test-reporter=spec .claude/skills/solo/scripts/test/*.test.mjs .claude/skills/next/scripts/test/*.test.mjs .claude/skills/architect-loop/scripts/test/*.test.mjs .claude/hooks/*.test.mjs

      - name: 语法检查
        run: |
          node --check .claude/skills/solo/scripts/solo.mjs
          node --check .claude/skills/solo/scripts/hook.mjs
          node --check .claude/skills/solo/scripts/state.mjs
          node --check .claude/skills/next/scripts/rotate-records.mjs
          node --check .claude/skills/architect-loop/scripts/wake.mjs
          node --check .claude/skills/architect-loop/scripts/scan.mjs
          node --check .claude/skills/architect-loop/scripts/release.mjs
          node --check .claude/skills/architect-loop/scripts/check-evidence.mjs

  # 内核的代码质量检查（docs/design/kernel-quality-gate.md）：调用检查工具的合并检查入口，
  # 与执行者交付前在本地运行的是同一条命令、同一个结论。只对清单里开关已打开的内核模块检查，
  # 没改到这些模块时工具直接通过。检查工具所在的目录不存在时各步跳过、作业成功：接线先于工具，
  # 工具一出现就自己生效，不靠谁在合并以后想起来
  kernel:
    name: 内核检查
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      # 合并基点要完整的历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查工具在不在
        id: tool
        run: |
          if [ -f tools/kernel_checks/__main__.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.tool.outputs.present == 'true' }}
        with:
          python-version: "3.13"

      - name: git 身份（工具的测试会建仓库并提交）
        if: ${{ steps.tool.outputs.present == 'true' }}
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        if: ${{ steps.tool.outputs.present == 'true' }}
        run: uv sync --frozen

      - name: 检查工具自己的测试
        if: ${{ steps.tool.outputs.present == 'true' }}
        run: uv run python -m pytest tools/kernel_checks/tests

      # 退出码：0 通过，1 不通过，2 工具自己出错；2 也让作业失败
      - name: 内核检查
        if: ${{ steps.tool.outputs.present == 'true' }}
        run: uv run python -m tools.kernel_checks check --base origin/main --report .tmp/kernel-checks/report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 保存报告
        if: ${{ !cancelled() && steps.tool.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-checks-report
          path: .tmp/kernel-checks/report.json
          if-no-files-found: ignore

  # 合并必须通过的检查（main 的规则要求名为 check 的检查）：上面六个作业都成功才成功。
  # 无论六个作业结果如何都运行，在运行摘要里写出各层的表
  check:
    if: ${{ always() }}
    needs: [unit, module, evals, client, workbench, kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: .tmp/test-results
          merge-multiple: true

      - name: 各层的结果
        run: |
          python3 scripts/ci_layers.py summary --layers harness/tests/layers.toml \
            --junit unit=.tmp/test-results/unit.xml --junit module=.tmp/test-results/module.xml \
            --junit evals=.tmp/test-results/evals.xml --pending integration | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 六项都通过
        run: |
          echo "① 单元层：${{ needs.unit.result }}；② 模块层：${{ needs.module.result }}；评测工具：${{ needs.evals.result }}；客户端：${{ needs.client.result }}；工作台脚本：${{ needs.workbench.result }}；内核检查：${{ needs.kernel.result }}"
          test "${{ needs.unit.result }}" = success
          test "${{ needs.module.result }}" = success
          test "${{ needs.evals.result }}" = success
          test "${{ needs.client.result }}" = success
          test "${{ needs.workbench.result }}" = success
          test "${{ needs.kernel.result }}" = success

  # PR 合并前后的用例清单（只收集，不运行），按层列出新增、删除与换层（docs/design/test-pyramid.md docs/design/test-pyramid.md「用例的变化」）。
  # 只显示，不是合并必须通过的检查；删除的用例由审查者与交付说明逐条核对
  inventory:
    name: 用例变化
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      # PR 的检出是合并提交，它的第一个父提交就是合并前的 main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: 收集合并后的用例
        run: |
          mkdir -p .tmp/inventory
          uv sync --frozen
          uv run python -m pytest harness/tests evals/tests --collect-only -p no:cacheprovider \
            -m "real_model or not real_model" > .tmp/inventory/head.txt || true
          tail -n 2 .tmp/inventory/head.txt

      - name: 收集合并前的用例
        run: |
          git worktree add --detach ../base HEAD^1
          cp ../base/harness/tests/layers.toml .tmp/inventory/base-layers.toml
          cd ../base
          uv sync --frozen
          uv run python -m pytest harness/tests evals/tests --collect-only -p no:cacheprovider \
            -m "real_model or not real_model" > "$GITHUB_WORKSPACE/.tmp/inventory/base.txt" || true
          tail -n 2 "$GITHUB_WORKSPACE/.tmp/inventory/base.txt"

      - name: 用例变化
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python scripts/ci_layers.py inventory \
            --base .tmp/inventory/base.txt --head .tmp/inventory/head.txt \
            --base-layers .tmp/inventory/base-layers.toml --head-layers harness/tests/layers.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ③ 集成层全部（docs/design/test-pyramid.md docs/design/test-pyramid.md「集成层在每次合并以后运行」）。不是合并必须通过的检查：
  # main 的每次推送（每次合并以后）与手动触发时运行，PR 上不运行。失败由 solo 执行者按 solo-worker 技能「main 上的 CI」处理
  integration:
    name: ③ 集成层
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    # 正常一趟 15 至 16 分钟；工作进程消失时 xdist 会一直等下去，45 分钟不够快，收到 25 分钟（#1208）。
    # 2026-10-30：用例长到 969 项、机器上同时跑多个分支与合并，正常一趟已到 15 至 16 分钟，
    # 一次工作进程消失就把 25 分钟吃满、失败清单打不出来；收到 25 分钟改为 35 分钟，并给 pytest 加 -v，
    # 失败名一出现就在日志里，作业被取消也留得下（#1274、#1255 之外由架构师当场改，见 docs/CHANGELOG.md）
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: git 身份（测试会建仓库并提交）
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        run: uv sync --frozen

      # #1182、#1184 的集成用例起真实的 Playwright MCP 与 Chromium。程序按 docs/design/browser-and-computer-use.md
      # docs/design/browser-and-computer-use.md「执行位置上的程序」由使用者安装，这台机器照同样的办法装，版本与那一节同步；Chromium 用 Playwright MCP 依赖的
      # playwright 版本自带的安装命令，浏览器修订号才对得上
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Playwright MCP 与 Chromium
        run: |
          npm install --global @playwright/mcp@0.0.83
          npx --yes playwright@"$(npm view @playwright/mcp@0.0.83 dependencies.playwright)" install chromium

      # --dist loadgroup：带同一个 xdist_group 标记的用例在同一个 worker 里运行（#614），没有标记的照常分配
      # --timeout=300：单条用例超过 5 分钟算失败并报出用例名（pytest-timeout 已是开发依赖）；作业本身另有 35 分钟的兜底
      # -v：失败名一出现就写进日志，作业被取消时不至于连是哪一条失败都留不下
      - name: 集成层
        run: uv run python -m pytest -m integration -n 4 --dist loadgroup --timeout=300 --timeout-method=thread -v --junitxml=.tmp/test-results/integration.xml

      - name: 集成层的结果
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python scripts/ci_layers.py summary --layers harness/tests/layers.toml \
            --junit integration=.tmp/test-results/integration.xml | tee -a "$GITHUB_STEP_SUMMARY"

      # 失败时从这份结果读出失败项名称，用于单进程重新运行（docs/design/test-pyramid.md docs/design/test-pyramid.md「输出的读取」）
      - name: 保存结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: .tmp/test-results/integration.xml
          if-no-files-found: ignore
