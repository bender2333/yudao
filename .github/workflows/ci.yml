# 每个 PR 与 main 的每次推送都运行，也可以手动触发。合并 main 要求 check 通过（docs/agents/dispatcher.md）。
# 本文件由架构师维护，修改前经用户确认；执行者使用的开发 App 没有 workflows 权限。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            harness/tests/openapi/package-lock.json

      - name: git 身份（测试会建仓库并提交）
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        id: install
        run: |
          uv sync --frozen
          npm ci --prefix client
          npm ci --prefix harness/tests/openapi

      # 安装以后的各项检查互不依赖：前一项失败时后面的照样运行，一次给出全部结果
      # 包括两项固定检查（test_layers.py 在单元层，test_openapi_snapshot.py 在模块层）
      - name: 单元层与模块层
        run: uv run python -m pytest -m "unit or module"

      # evals/ 的测试不在 harness 的分层登记里，单独运行；CI 没有模型凭据，需要模型的用例跳过
      - name: 评测工作线的测试
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python -m pytest evals/tests

      # room-screen-switch 等测试用 Playwright 启动 Chromium 挂载页面
      - name: 安装 Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: client
        run: npx playwright install chromium

      # 逐场景回放测试（*-replay）按 AGENTS.md 单独运行，不在 CI 中
      - name: 客户端单元测试
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: client
        timeout-minutes: 10
        run: node --test --test-force-exit --test-timeout=60000 --test-reporter=spec $(ls tests/unit/*.test.js tests/unit/*.test.ts | grep -v -- '-replay\.test\.')

      - name: 编译页面与 wheel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build:pages --prefix client
          uv build --wheel

      - name: 客户端类型检查
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: client
        run: npm run typecheck

  # 集成层全部（docs/design/test-pyramid.md 第 4 节），与 check 并行。
  # 量出运行时间、加进 main 的规则以前，不是合并必须通过的检查，派发者照旧按派发者规则第 5 节运行集成层
  integration:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: git 身份（测试会建仓库并提交）
        run: |
          git config --global user.name "Yudao CI"
          git config --global user.email "ci@yudao.invalid"

      - name: 安装依赖
        run: uv sync --frozen

      - name: 集成层
        run: uv run python -m pytest -m integration -n 4 --junitxml=.tmp/test-results/integration.xml

      # 失败时从这份结果读出失败项名称，用于单进程重新运行（docs/design/test-pyramid.md 第 6 节）
      - name: 保存结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: .tmp/test-results/integration.xml
          if-no-files-found: ignore
