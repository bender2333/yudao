<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yudao</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="yudao-workbench" role="region" aria-label="Yudao 项目工作台">
    <div class="yp-shell" id="yp-shell">
      <aside class="yp-sidebar" id="yp-sidebar" aria-label="项目导航"></aside>
      <main class="yp-main">
        <header class="yp-topbar" id="yp-topbar"></header>
        <div id="department-workspace-prototype">
          <div class="yp-content" id="dw-main" aria-live="polite"></div>
        </div>
      </main>
    </div>
  </div>
  <dialog id="yp-project-dialog" aria-labelledby="yp-project-dialog-title">
    <form method="dialog" id="yp-project-dialog-form" class="dw-dialog-form">
      <div class="dw-dialog-head"><h2 id="yp-project-dialog-title">从想法新建项目</h2><button class="dw-icon-button" value="cancel" type="submit" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <label for="yp-project-name">项目名称</label>
      <input id="yp-project-name" name="name" required placeholder="给这个长期工作一个名字">
      <label for="yp-project-goal">长期目标</label>
      <textarea id="yp-project-goal" name="goal" rows="4" required placeholder="描述这个项目要长期达成什么"></textarea>
      <div class="dw-dialog-actions"><button class="dw-back" value="cancel" type="submit">取消</button><button class="dw-primary" id="yp-project-submit" value="default" type="submit"><i data-lucide="plus" aria-hidden="true"></i>建立项目</button></div>
      <p class="dw-dialog-error" id="yp-project-error" role="alert" hidden></p>
    </form>
  </dialog>
  <dialog id="dw-prompt-dialog" aria-labelledby="dw-prompt-dialog-title">
    <form method="dialog" id="dw-prompt-dialog-form" class="dw-dialog-form yp-prompt-editor">
      <div class="dw-dialog-head"><h2 id="dw-prompt-dialog-title">配置 Prompt</h2><button class="dw-icon-button" value="cancel" type="submit" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <p class="dw-dialog-meta" id="dw-prompt-meta"></p>
      <div class="yp-prompt-current" id="dw-prompt-default-wrap">
        <strong>默认内容</strong>
        <pre id="dw-prompt-default" class="dw-prompt-block"></pre>
      </div>
      <label for="dw-prompt-text">编辑<textarea id="dw-prompt-text" name="text" rows="10" required></textarea></label>
      <div class="dw-dialog-actions">
        <button class="dw-back" id="dw-prompt-restore" type="button">恢复默认</button>
        <button class="dw-back" value="cancel" type="submit">取消</button>
        <button class="dw-primary" value="default" type="submit"><i data-lucide="save" aria-hidden="true"></i>保存</button>
      </div>
      <p class="dw-dialog-error" id="dw-prompt-error" role="alert" hidden></p>
    </form>
  </dialog>
  <dialog id="dw-event-dialog" aria-labelledby="dw-event-title">
    <form method="dialog" class="dw-dialog-form"><div class="dw-dialog-head"><h2 id="dw-event-title">事件详情</h2><button class="dw-icon-button" value="cancel" type="submit" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div><p id="dw-event-version" class="dw-dialog-meta" hidden></p><ul id="dw-event-files" class="dw-dialog-files" hidden></ul><pre id="dw-event-document" class="dw-dialog-json" hidden></pre><pre id="dw-event-json" class="dw-dialog-json"></pre><div id="dw-event-sources" class="dw-dialog-sources"></div></form>
  </dialog>
  <dialog id="yp-rename-dialog" aria-labelledby="yp-rename-dialog-title">
    <form method="dialog" id="yp-rename-dialog-form" class="dw-dialog-form">
      <div class="dw-dialog-head"><h2 id="yp-rename-dialog-title">重命名项目</h2><button class="dw-icon-button" value="cancel" type="submit" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <label for="yp-rename-name">名称</label>
      <input id="yp-rename-name" name="name" required>
      <div class="dw-dialog-actions"><button class="dw-back" value="cancel" type="submit">取消</button><button class="dw-primary" value="default" type="submit">保存</button></div>
      <p class="dw-dialog-error" id="yp-rename-error" role="alert" hidden></p>
    </form>
  </dialog>
  <script src="/static/lucide.min.js"></script>
  <script src="/static/context-view.js"></script>
  <script src="/static/trace-view.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/provider-config.js"></script>
</body>
</html>
