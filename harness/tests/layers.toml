# 测试分层登记表（测试分层设计说明第 3 节）
#
# 键是 Python 测试文件相对 harness/tests/ 的路径（包括 kernel/ 等子目录），
# 值是该文件里全部测试所属的一层。根 conftest.py 用标准库 tomllib 读取本表，
# 在收集阶段按文件给每项测试加标记，并检查两边有没有对不上的文件。
#
# 这一步（#158）先把 harness/tests/ 下现有的全部测试文件登记为 integration，
# 逐个文件降到 unit 或 module 由 #406 负责。登记表的键只追加与修改单行。
